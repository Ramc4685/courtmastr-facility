  /public/relationship-confirmations:
    post:
      operationId: publicDecideRelationship
      tags: [clients]
      summary: Accept or decline a relationship request by emailed token
      description: The token travels in the body (the emailed link puts it in the landing page's URL fragment; that page
        sends Referrer-Policy no-referrer). It is single-use, short-lived, hashed at rest and redacted from logs. Acceptance
        binds to the invited party - when the request carries a client session, accept succeeds only if that session's
        identity has portal access to the invited client (else 403); without a session the token alone may decline, and
        accept is allowed only for an invitee with no login. Decline never requires a session.
      x-priority: P0
      x-surface: public
      x-permission: public:token
      x-authorization: token valid and unconsumed; on accept, a present client session must belong to the invited client
        (client_portal_access(identity, invited_client_id)); an invitee with a login must sign in to accept.
      x-features: [FAM-02]
      security: [{}, {clientSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RelationshipDecision'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Relationship'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '410': {$ref: '#/components/responses/Gone'}
        default: {$ref: '#/components/responses/Problem'}
      x-problem-codes: [invalid-state-transition, token-expired, sign-in-required, session-identity-mismatch]
