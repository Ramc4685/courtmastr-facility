# FacilityHub API skeleton: billing, pos, access, staff.
# Status: Phase 1 design contract for GATE 1 (2026-11-10). Conforms to docs/architecture/overview.md 3.12-3.16,
# data-model-money.md and rbac-matrix.md. Once routers exist, the generated /api/v1/openapi.json snapshot
# (docs/api/openapi.json) supersedes this file; until then this file is the contract the routers are written to.
# Schemas carry key fields only; full column lists live in the data model. Clean-room: all names are ours.
openapi: 3.1.0
info:
  title: 'FacilityHub API: money contexts (billing, pos, access, staff)'
  version: 1.0.0-skeleton
  description: |
    Skeleton for four bounded contexts. Paths are relative to `/api/v1`.

    Conventions (overview 3.12 to 3.16), applied to every operation and not repeated:
    - Surfaces by prefix: none = staff session or scoped API key; `/portal` = client identity acting for self or a
      related client; `/kiosk` = device token; `/public` = anonymous, tenant from host; `/webhooks/<provider>` =
      signature-verified and unversioned.
    - Errors are `application/problem+json` (RFC 9457). `code` is the machine contract; each operation lists its
      codes in `x-problem-codes`. An id outside the caller's tenant or location scope is `404 not-found`.
    - Lists are keyset pages `{data, page}`; `limit` default 50, max 200; filters are flat field names with
      operator suffixes `[gte] [gt] [lte] [lt] [in] [ne]`; unknown parameters are `400`.
    - Money is integer minor units (`*_minor`, int64) in the tenant currency. Percentages (`*_pct`) and rates are
      decimal strings. Timestamps are UTC; `*_on` are location-local dates; `*_time` are location-local wall time.
    - Operations without a `security` block use the document default (staff session or bearer token).
    - `Idempotency-Key` is required where `x-idempotent: required` (money movement, POS completion, refunds,
      kiosk and portal writes) and honoured where `optional`.

    Extensions:
    - `x-permission`: catalogue key from rbac-matrix.md checked at router and service; or `authenticated-staff`
      (configuration reads need no key), `client:can_act_for` (ownership policy, rbac 9), `kiosk-device` (fixed
      capability set, rbac 10), `public`, `provider-signature`.
    - `x-permission-also`: further keys required conditionally (`when`).
    - `x-features`: discovery feature ids served. `x-priority`: P0 fully specified, P1 path stub.
    - `x-features-without-endpoints`: P0/P1 features of these prefixes that need no path here, with the reason.

    Decisions (alternative rejected):
    1. Settings tables are one path each with `?location_id=` (absent = tenant default); `DELETE` drops a location
       override. Rejected: `/locations/{id}/<x>-settings` twins, which double six settings paths.
    2. Configuration rows are deactivated by `PATCH is_active=false`; no `DELETE` except where the data model allows
       a hard delete (unused coupon, future tax rate). Rejected: soft-delete endpoints nothing can restore from.
    3. Money edits on a posted charge go through `PATCH /charges/{id}` and produce an adjustment row; the response
       is the original charge with `adjustments[]`. Rejected: a separate `/adjustments` resource (staff think
       "edit the item", BIL-01).
    4. Undo is four explicit verbs: `reverse` (charge), `void` (charge, invoice, record-only payment), `release`
       (allocation, as `DELETE`), `refund` (payment remainder). Rejected: one polymorphic "undo" (hides the
       permission and ledger difference).
    5. A refund returns only the unapplied remainder of one payment (data model 1.3). Refunding paid items is
       reverse-then-refund; `POST /clients/{id}/account-credit/refund` and POS returns are the one-call composites.
    6. Processed tenders are two-phase: `POST /payments` returns `next_action` (provider client secret) when the
       payer must confirm in provider-hosted fields; `POST /payments/{id}/confirm` re-reads the provider. The
       webhook is authoritative; `confirm` only shortens the wait. No card or bank numbers cross this API (PAY-06).
    7. Bulk work (BIL-02) is `POST /billing-bulk-actions` returning `202` and a resource with per-item results;
       `is_dry_run` previews. Rejected: synchronous bulk endpoints (timeouts, no partial-failure story).
    8. A denied check-in is `201` with `result: denied`, not a 4xx: it is a logged fact (CHK-01). 4xx is kept for
       malformed or unauthorised requests. Kiosk responses collapse the reason to `admitted | see_staff`.
    9. Kiosk lookup returns an opaque short-lived `match_token`, never a client id, and records whether the client
       was identified by possession (scan) or by name; purchases require possession (rbac 10).
    10. POS cart is server-side (`pos_sale` draft) so totals, tax and discounts have one implementation and a
        handed-over tablet resumes. Rejected: client-side cart posted whole (duplicates rounding rules in TS).
    11. Split tender: each `POST /pos-sales/{id}/tenders` captures one leg; `complete` requires legs to equal the
        total. A failed card leg does not undo a captured cash leg (data model 2.3).
    12. Equipment rent-out is a POS line (`line_kind: equipment`); return is its own action with staff-confirmed
        fees (data model 2.5; never auto-posted).
    13. Time clock punches re-authenticate in the body (`password`) and are refused off-network with
        `403 network-not-allowed` (STF-06, STF-07). Rejected: trusting the session alone on shared front-desk PCs.
    14. Payroll runs are asynchronous snapshots: create returns `202` in `calculating`; statements are immutable
        after `finalize` (STF-09, STF-10).
    15. History (BIL-09) is one filtered read, `GET /billing-history`, over `audit_event`. Rejected: a
        `/history` sub-resource per aggregate.
    16. Reports (BIL-19, CHK-20, STF-11, POS-22 reorder, RPT-32) are served by the reporting context over `rpt_*`
        views and are not paths here.
servers:
- {url: /api/v1, description: Versioned API prefix (overview 3.15).}
tags:
- {name: billing, description: 'Receivables, payments, ledger, tax, coupons, autopay, provider (BIL, PAY).'}
- {name: pos, description: 'Registers, products, stock, sales, returns, equipment loans (POS, RNT-14..16).'}
- {name: access, description: 'Check-in, kiosk, credentials, access rules (CHK).'}
- {name: staff, description: 'Payees, pay rates, time clock, shifts, payroll runs (STF).'}
security:
- {staffSession: []}
- {bearerToken: []}
x-features-without-endpoints: {BIL-03: P1. Filters on GET /charges (is_invoiced=false with created_by_staff_user_id or location_id);
    no cart resource., BIL-18: P1. Post-billed package close is owned by packages (data model 1.6); its paths belong to
    the programs/packages API file., BIL-19: P1. Accounts receivable is a reporting-context report over rpt_receivable.,
  BIL-24: P2. Not built., PAY-12: v2-adapter. Terminal port; POS tender gains terminal_ref later., PAY-13: v2-adapter.,
  PAY-15: P1. Wallets ride the provider-hosted element; only the `wallet` fields and provider capability flag exist., PAY-19: P2.
    Not built; no raw card data enters the system., POS-11: 'P1. `source: coupon` on POST /pos-sales/{id}/discounts; reporting
    stub GET /coupons/{id}/redemptions.', POS-14: 'P1. Receipt header is location contact data, footer is billing-settings.receipt_footer;
    no new path.', POS-15: v2-adapter. Browser print in v1., POS-19: 'P1. `package_plan_id` on POST /pos-sales/{id}/lines.',
  POS-20: P2. Covered in intent by drawer sessions., POS-21: v2-adapter., POS-22: 'P1. GET /products?is_below_reorder_level=true
    plus reporting-context views; alert email is pos-settings.', POS-23: v2-adapter., CHK-15: v2-adapter. CredentialReader
    port; credential kinds exist., CHK-16: v2-adapter. DoorController port; access.door.unlock has no route in v1., CHK-17: P2.
    Not built., CHK-20: P1. Reporting-context report over rpt_check_in., CHK-21: P1. Alerts already return in CheckInResult.alerts
    with an `action` hint; remediation deep-links to billing and memberships routes., STF-11: 'P1. Reporting-context report
    (rpt_trainer_session), own-reach scoped through staff_payee.staff_user_id.', STF-12: P1. Flags on StaffPayee; delivery
    is an engagement handler on scheduling events., STF-13: P1. integrations calendar_feed., STF-14: v2-adapter.}
paths:
  /revenue-categories:
    get:
      operationId: listRevenueCategories
      tags: [billing]
      summary: List revenue categories
      description: 'Configuration read: no key (rbac 1).'
      x-priority: P0
      x-permission: authenticated-staff
      x-features: [BIL-13]
      parameters:
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Cursor'}
      - {$ref: '#/components/parameters/Sort'}
      - {$ref: '#/components/parameters/Include'}
      - {name: is_active, in: query, schema: {type: boolean}}
      - {name: parent_id, in: query, schema: {type: string, format: uuid}}
      - {name: q, in: query, schema: {type: string}}
      x-problem-codes: [permission-denied]
      responses:
        '200':
          description: Keyset page.
          content: {application/json: {schema: {$ref: '#/components/schemas/RevenueCategoryPage'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createRevenueCategory
      tags: [billing]
      summary: Create a revenue category
      x-priority: P0
      x-permission: billing.revenue_category.manage
      x-features: [BIL-13, BIL-12]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RevenueCategoryWrite'}}}
      x-problem-codes: [permission-denied, validation-failed, already-exists]
      responses:
        '201':
          description: Created.
          content: {application/json: {schema: {$ref: '#/components/schemas/RevenueCategory'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /revenue-categories/{revenue_category_id}:
    get:
      operationId: getRevenueCategory
      tags: [billing]
      summary: Get a revenue category
      x-priority: P0
      x-permission: authenticated-staff
      x-features: [BIL-13]
      parameters:
      - {name: revenue_category_id, in: path, required: true, schema: {type: string, format: uuid}}
      x-problem-codes: [permission-denied, not-found]
      responses:
        '200':
          description: OK.
          content: {application/json: {schema: {$ref: '#/components/schemas/RevenueCategory'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: updateRevenueCategory
      tags: [billing]
      summary: Update, re-parent, map taxes or deactivate
      x-priority: P0
      x-permission: billing.revenue_category.manage
      x-features: [BIL-13, BIL-12]
      parameters:
      - {name: revenue_category_id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RevenueCategoryWrite'}}}
      x-problem-codes: [permission-denied, not-found, validation-failed, already-exists, category-cycle]
      responses:
        '200':
          description: OK.
          content: {application/json: {schema: {$ref: '#/components/schemas/RevenueCategory'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /taxes:
    get:
      operationId: listTaxes
      tags: [billing]
      summary: List taxes with their dated rates
      description: 'Configuration read: no key (rbac 1).'
      x-priority: P0
      x-permission: authenticated-staff
      x-features: [BIL-12]
      parameters:
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Cursor'}
      - {$ref: '#/components/parameters/Sort'}
      - {$ref: '#/components/parameters/Include'}
      - {name: is_active, in: query, schema: {type: boolean}}
      x-problem-codes: [permission-denied]
      responses:
        '200':
          description: Keyset page.
          content: {application/json: {schema: {$ref: '#/components/schemas/TaxPage'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createTax
      tags: [billing]
      summary: Create a tax with its first rate
      x-priority: P0
      x-permission: billing.tax.manage
      x-features: [BIL-12]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/TaxWrite'}}}
      x-problem-codes: [permission-denied, validation-failed, already-exists]
      responses:
        '201':
          description: Created.
          content: {application/json: {schema: {$ref: '#/components/schemas/Tax'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /taxes/{tax_id}:
    get:
      operationId: getTax
      tags: [billing]
      summary: Get a tax
      x-priority: P0
      x-permission: authenticated-staff
      x-features: [BIL-12]
      parameters:
      - {name: tax_id, in: path, required: true, schema: {type: string, format: uuid}}
      x-problem-codes: [permission-denied, not-found]
      responses:
        '200':
          description: OK.
          content: {application/json: {schema: {$ref: '#/components/schemas/Tax'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: updateTax
      tags: [billing]
      summary: Update or deactivate a tax (from a date)
      x-priority: P0
      x-permission: billing.tax.manage
      x-features: [BIL-12]
      parameters:
      - {name: tax_id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/TaxWrite'}}}
      x-problem-codes: [permission-denied, not-found, validation-failed]
      responses:
        '200':
          description: OK.
          content: {application/json: {schema: {$ref: '#/components/schemas/Tax'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /taxes/{tax_id}/rates:
    post:
      operationId: addTaxRate
      tags: [billing]
      summary: Add an effective-dated rate
      x-priority: P0
      x-permission: billing.tax.manage
      x-features: [BIL-12]
      parameters:
      - {name: tax_id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/TaxRateWrite'}}}
      x-problem-codes: [permission-denied, not-found, validation-failed, already-exists]
      responses:
        '201':
          description: Created.
          content: {application/json: {schema: {$ref: '#/components/schemas/TaxRate'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /taxes/{tax_id}/rates/{tax_rate_id}:
    patch:
      operationId: updateTaxRate
      tags: [billing]
      summary: Edit a future-dated rate
      x-priority: P0
      x-permission: billing.tax.manage
      x-features: [BIL-12]
      parameters:
      - {name: tax_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: tax_rate_id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/TaxRateWrite'}}}
      x-problem-codes: [permission-denied, not-found, validation-failed, tax-rate-in-use]
      responses:
        '200':
          description: OK.
          content: {application/json: {schema: {$ref: '#/components/schemas/TaxRate'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
    delete:
      operationId: deleteTaxRate
      tags: [billing]
      summary: Delete a future-dated rate
      x-priority: P0
      x-permission: billing.tax.manage
      x-features: [BIL-12]
      parameters:
      - {name: tax_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: tax_rate_id, in: path, required: true, schema: {type: string, format: uuid}}
      x-problem-codes: [permission-denied, not-found, tax-rate-in-use]
      responses:
        '204': {description: No content.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /tender-types:
    get:
      operationId: listTenderTypes
      tags: [billing]
      summary: List tender types (payment method configuration)
      description: 'Configuration read: no key (rbac 1).'
      x-priority: P0
      x-permission: authenticated-staff
      x-features: [PAY-02]
      parameters:
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Cursor'}
      - {$ref: '#/components/parameters/Sort'}
      - {$ref: '#/components/parameters/Include'}
      - {name: is_enabled, in: query, schema: {type: boolean}}
      x-problem-codes: [permission-denied]
      responses:
        '200':
          description: Keyset page.
          content: {application/json: {schema: {$ref: '#/components/schemas/TenderTypePage'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createTenderType
      tags: [billing]
      summary: Add a record-only tender
      x-priority: P0
      x-permission: billing.settings.manage
      x-features: [PAY-02]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/TenderTypeWrite'}}}
      x-problem-codes: [permission-denied, validation-failed, already-exists]
      responses:
        '201':
          description: Created.
          content: {application/json: {schema: {$ref: '#/components/schemas/TenderType'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /tender-types/{tender_type_id}:
    patch:
      operationId: updateTenderType
      tags: [billing]
      summary: Rename, reorder, enable or hide a tender
      x-priority: P0
      x-permission: billing.settings.manage
      x-features: [PAY-02]
      parameters:
      - {name: tender_type_id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/TenderTypeWrite'}}}
      x-problem-codes: [permission-denied, not-found, validation-failed, tender-not-optional]
      responses:
        '200':
          description: OK.
          content: {application/json: {schema: {$ref: '#/components/schemas/TenderType'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /billing-settings:
    get:
      operationId: getBillingSettings
      tags: [billing]
      summary: Resolved billing preferences
      description: 'Configuration read: no key (rbac 1).'
      x-priority: P0
      x-permission: authenticated-staff
      x-features: [BIL-16, BIL-17, BIL-22, PAY-08]
      parameters:
      - {name: location_id, in: query, schema: {type: string, format: uuid}}
      x-problem-codes: [permission-denied]
      responses:
        '200':
          description: OK.
          content: {application/json: {schema: {$ref: '#/components/schemas/BillingSettings'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    put:
      operationId: putBillingSettings
      tags: [billing]
      summary: Set tenant defaults or a location override
      x-priority: P0
      x-permission: billing.settings.manage
      x-permission-also:
      - {key: billing.autopay.configure, when: 'changing autopay default, retry or reminder fields (BIL-17)'}
      x-features: [BIL-16, BIL-22, PAY-08]
      parameters:
      - {name: location_id, in: query, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/BillingSettingsWrite'}}}
      x-problem-codes: [permission-denied, validation-failed]
      responses:
        '200':
          description: OK.
          content: {application/json: {schema: {$ref: '#/components/schemas/BillingSettings'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Unprocessable'}
    delete:
      operationId: deleteBillingSettingsOverride
      tags: [billing]
      summary: Remove a location override
      x-priority: P0
      x-permission: billing.settings.manage
      x-features: [BIL-16]
      parameters:
      - {name: location_id, in: query, schema: {type: string, format: uuid}}
      x-problem-codes: [permission-denied]
      responses:
        '204': {description: No content.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /catalog-items:
