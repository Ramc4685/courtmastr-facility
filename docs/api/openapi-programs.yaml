      x-priority: P1
      x-permission: signature
      x-features: [INT-09]
    servers: [{url: /, description: Unversioned inbound webhooks}]
components:
  securitySchemes:
    staffSession:
      type: apiKey
      in: cookie
      name: fh_session
      description: Opaque staff session cookie (HttpOnly, SameSite=Lax) plus X-CSRF-Token on unsafe methods.
    apiKey:
      type: http
      scheme: bearer
      description: Scoped API key `fhk_<tenant>_<secret>`; scopes are permission keys.
    clientSession:
      type: http
      scheme: bearer
      description: Opaque client identity token (mobile) or the session cookie (web portal).
    providerSignature:
      type: apiKey
      in: header
      name: X-Signature
      description: Provider-specific signature header, verified per adapter.
  parameters:
    Limit:
      name: limit
      in: query
      description: Page size.
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    Cursor:
      name: cursor
      in: query
      description: Opaque keyset cursor from page.next_cursor.
      schema: {type: string}
    Sort:
      name: sort
      in: query
      description: Comma-separated allow-listed fields, `-` prefix for descending; id is the tiebreaker.
      schema: {type: string}
    Include:
      name: include
      in: query
      description: '`total` to compute page.total.'
      schema: {type: string}
    LocationId:
      name: location_id
      in: query
      description: Location filter; always intersected with the caller's permitted locations.
      schema: {type: string, format: uuid}
    Q:
      name: q
      in: query
      description: Free-text search for the resource.
      schema: {type: string}
    ActingFor:
      name: acting_for
      in: query
      description: Related client the caller acts for (FAM-03); default is the caller. Checked by can_act_for for the
        operation's capability; 403 otherwise.
      schema: {type: string, format: uuid}
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      description: Required. Same key and body replays the stored response for 24 h.
      schema: {type: string, maxLength: 255}
      required: true
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      description: Optional for staff sessions; required for API-key callers on this operation.
      schema: {type: string, maxLength: 255}
  responses:
    BadRequest:
      description: Malformed request or unknown query parameter.
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    Unauthorized:
      description: Missing or invalid credentials.
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    PaymentDeclined:
      description: payment-declined, with the provider decline category.
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    Forbidden:
      description: 'permission-denied: the principal can see the resource but not perform the action.'
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    NotFound:
      description: 'not-found: also returned for ids outside the tenant or location scope.'
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    Conflict:
      description: State conflict; see x-problem-codes of the operation.
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    Unprocessable:
      description: validation-failed with `errors[]`, or idempotency-key-reused.
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    RateLimited:
      description: rate-limited.
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
      headers: {Retry-After: {schema: {type: integer}}}
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem document (overview 3.13). `code` is the stable machine contract.
      required: [type, title, status, code, trace_id]
      properties:
        type: {type: string, description: 'URI reference, /problems/<code>'}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
        code: {type: string}
        trace_id: {type: string}
        errors:
          type: array
          description: Validation failures (422).
          items:
            type: object
            properties:
              pointer: {type: string, description: JSON Pointer into the request body}
              code: {type: string}
              detail: {type: string}
      additionalProperties: true
    Page:
      type: object
      description: Keyset page envelope (overview 3.14).
      required: [next_cursor, has_more]
      properties:
        next_cursor: {type: [string, 'null']}
        has_more: {type: boolean}
        total: {type: [integer, 'null'], description: only with include=total}
    Money:
      type: object
      description: Amount in minor units; currency is the tenant currency.
      required: [amount_minor, currency]
      properties:
        amount_minor: {type: integer}
        currency: {type: string, description: 'ISO 4217, echoed from the tenant'}
    ICalendar: {type: string, description: RFC 5545 iCalendar document.}
    ProgramGroup:
      type: object
      description: Registerable container or child node (program, camp, clinic, team, session block). REG-01, REG-02.
      required: [id]
      properties:
        id: {type: string, format: uuid}
        location_id: {type: string, format: uuid}
        parent_id: {type: [string, 'null'], format: uuid}
        root_id: {type: string, format: uuid}
        depth: {type: integer}
        kind:
          type: string
          enum: [program, camp, clinic, class_series, competition, team, other]
        name: {type: string}
        child_label: {type: string}
        status: {type: string, enum: [active, completed, archived]}
        deleted_at: {type: [string, 'null'], format: date-time}
        starts_on: {type: [string, 'null'], format: date}
        ends_on: {type: [string, 'null'], format: date}
        capacity: {type: [integer, 'null'], description: subtree cap; null = unlimited}
        max_children: {type: [integer, 'null']}
        enrolled_count: {type: integer}
        waitlist_count: {type: integer}
        waitlist_mode: {type: [string, 'null'], enum: [disabled, manual, auto_promote, null], description: null = inherit (REG-09)}
        revenue_category_id: {type: [string, 'null'], format: uuid}
        auto_archive_on: {type: [string, 'null'], format: date}
        season_classifier_id: {type: [string, 'null'], format: uuid}
        sport_classifier_id: {type: [string, 'null'], format: uuid}
        age_division_classifier_id: {type: [string, 'null'], format: uuid}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ProgramGroupInput:
      type: object
      description: Create or merge-patch a group node. `parent_id` is immutable after create (use move).
      required: [location_id, name]
      properties:
        location_id: {type: string, format: uuid}
        parent_id: {type: [string, 'null'], format: uuid}
        kind: {type: string}
        name: {type: string}
        description: {type: [string, 'null']}
        child_label: {type: string}
        starts_on: {type: [string, 'null'], format: date}
        ends_on: {type: [string, 'null'], format: date}
        capacity: {type: [integer, 'null']}
        max_children: {type: [integer, 'null']}
        waitlist_mode: {type: [string, 'null']}
        revenue_category_id: {type: [string, 'null'], format: uuid}
        auto_archive_on: {type: [string, 'null'], format: date}
        season_classifier_id: {type: [string, 'null'], format: uuid}
        sport_classifier_id: {type: [string, 'null'], format: uuid}
        age_division_classifier_id: {type: [string, 'null'], format: uuid}
    ProgramGroupTree:
      type: object
      description: A root with its descendants, depth-first.
      required: [root, nodes]
      properties:
        root: {$ref: '#/components/schemas/ProgramGroup'}
        nodes: {type: array, items: {$ref: '#/components/schemas/ProgramGroup'}}
    ProgramSessionLink:
      type: object
      description: Link between a group node and a scheduling session (CLS-10).
      required: [id]
      properties:
        id: {type: string, format: uuid}
        program_group_id: {type: string, format: uuid}
        session_id: {type: string, format: uuid}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        resource_id: {type: [string, 'null'], format: uuid}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ProgramSessionLinkInput:
      type: object
      description: Attach existing sessions, or have scheduling create them from a recurrence.
      properties:
        session_ids: {type: array, items: {type: string, format: uuid}}
        create:
          type: object
          additionalProperties: true
          description: reservation_type_id, resource_id, starts_at, ends_at, recurrence; forwarded to scheduling.service
            (holds apply)
    ProgramFee:
      type: object
      description: Fee of a group node, or a location catalogue fee when program_group_id is null (REG-07, REG-10).
      required: [id]
      properties:
        id: {type: string, format: uuid}
        location_id: {type: string, format: uuid}
        program_group_id: {type: [string, 'null'], format: uuid}
        name: {type: string}
        fee_kind: {type: string, enum: [individual, join_subgroup, new_subgroup]}
        amount_minor: {type: integer, description: Minor units of the tenant currency.}
        deposit_minor: {type: [integer, 'null'], description: Minor units of the tenant currency.}
        instalment_count: {type: [integer, 'null']}
        tax_category_id: {type: [string, 'null'], format: uuid}
        revenue_category_id: {type: [string, 'null'], format: uuid}
        is_online: {type: boolean}
        available_from: {type: [string, 'null'], format: date-time}
        available_until: {type: [string, 'null'], format: date-time}
        is_active: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ProgramFeeInput:
      type: object
      description: Create or merge-patch a fee.
      required: [name, fee_kind, amount_minor]
      properties:
        location_id: {type: string, format: uuid}
        name: {type: string}
        fee_kind: {type: string}
        amount_minor: {type: integer, description: Minor units of the tenant currency.}
        deposit_minor: {type: [integer, 'null'], description: Minor units of the tenant currency.}
        instalment_count: {type: [integer, 'null']}
        tax_category_id: {type: [string, 'null'], format: uuid}
        revenue_category_id: {type: [string, 'null'], format: uuid}
        is_online: {type: boolean}
        available_from: {type: [string, 'null'], format: date-time}
        available_until: {type: [string, 'null'], format: date-time}
        is_active: {type: boolean}
    RegistrationConfig:
      type: object
      description: Online registration configuration of one group node; null fields inherit the location default (REG-10,
        REG-11, SSP-17). PUT replaces the writable fields.
      required: [program_group_id]
      properties:
        program_group_id: {type: string, format: uuid}
        is_portal_visible: {type: boolean}
        portal_publish_name: {type: [string, 'null']}
        portal_published_at: {type: [string, 'null'], format: date-time}
        opens_at: {type: [string, 'null'], format: date-time}
        closes_at: {type: [string, 'null'], format: date-time}
        registration_mode: {type: [string, 'null'], enum: [individual, team, both, null]}
        payment_policy: {type: [string, 'null'], enum: [pay_in_full, deposit, instalments, pay_later, null]}
        min_age: {type: [integer, 'null']}
        max_age: {type: [integer, 'null']}
        age_as_of: {type: [string, 'null'], format: date}
        gender_restriction: {type: [string, 'null']}
        required_document_template_ids: {type: array, items: {type: string, format: uuid}}
        form_id: {type: [string, 'null'], format: uuid}
        waitlist_mode: {type: [string, 'null']}
        notification_emails: {type: array, items: {type: string, format: email}}
        description_html: {type: [string, 'null']}
    Enrollment:
      type: object
      description: 'A client''s place in a group node or a single session: the roster row (CLS-01, REG-07).'
      required: [id]
      properties:
        id: {type: string, format: uuid}
        location_id: {type: string, format: uuid}
        client_id: {type: string, format: uuid}
        target_kind: {type: string, enum: [group, session]}
        program_group_id: {type: [string, 'null'], format: uuid}
        session_id: {type: [string, 'null'], format: uuid}
        status: {type: string, enum: [pending, enrolled, cancelled]}
        pricing: {type: string, enum: [fee, entitlement, free]}
        program_fee_id: {type: [string, 'null'], format: uuid}
        client_package_id: {type: [string, 'null'], format: uuid}
        charge_id: {type: [string, 'null'], format: uuid}
        payer_client_id: {type: [string, 'null'], format: uuid}
        checkout_id: {type: [string, 'null'], format: uuid}
        batch_id: {type: [string, 'null'], format: uuid}
        channel:
          type: string
          enum: [staff, portal, mobile, public_link, kiosk, api, waitlist, roster_invite]
        hold_expires_at: {type: [string, 'null'], format: date-time}
        enrolled_at: {type: [string, 'null'], format: date-time}
        cancelled_at: {type: [string, 'null'], format: date-time}
        cancel_kind:
          type: [string, 'null']
          enum: [early, late, staff_removed, session_cancelled, hold_expired, demoted_to_waitlist, payment_refunded, client_merged,
            null]
        billing_disposition: {type: [string, 'null'], enum: [reversed, kept, none, null]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    EnrollmentCreate:
      type: object
      description: 'Enrol one client. Exactly one of session_id / program_group_id. For sessions the entitlement is `client_package_id`,
        or `pricing: free` where the session allows free booking (CLS-05); omit both to auto-select when exactly one eligible
        package exists (speed-register, CLS-01). For groups pass `program_fee_ids` (REG-07).'
      required: [client_id]
      properties:
        client_id: {type: string, format: uuid}
        session_id: {type: string, format: uuid}
        program_group_id: {type: string, format: uuid}
        pricing: {type: string, enum: [fee, entitlement, free]}
        client_package_id: {type: string, format: uuid}
        program_fee_ids: {type: array, items: {type: string, format: uuid}}
        payer_client_id: {type: string, format: uuid}
        override_capacity: {type: boolean, description: needs scheduling.enrollment.override_capacity}
        registrant_comment: {type: string}
    PortalEnrollmentCreate:
      type: object
      additionalProperties: false
      description: 'Portal booking of one session (CLS-09). Only client-settable fields: price, payer, fees and capacity
        override are never accepted here (staff use EnrollmentCreate). The payer is the caller''s own client. Entitlement
        is `client_package_id` or `pricing: free` where the session allows free booking (CLS-05); omit both to auto-select
        when exactly one eligible package exists (CLS-01). Groups and paid bookings go through a registration checkout.'
      required: [client_id, session_id]
      properties:
        client_id:
          type: string
          format: uuid
          description: participant; must satisfy can_act_for(identity, client_id, book), else 403
        session_id: {type: string, format: uuid}
        pricing: {type: string, enum: [entitlement, free], description: free is honoured only where the session allows it}
        client_package_id:
          type: string
          format: uuid
          description: must satisfy can_use_entitlement(client_id, package) (ADR 0009 section 8.3), else 403
        registrant_comment: {type: string}
    EnrollmentBatchCreate:
      type: object
      description: 'Multi-session enrolment (CLS-02): one savepoint per occurrence.'
      required: [client_id, session_id, booked_scope]
      properties:
        client_id: {type: string, format: uuid}
        session_id: {type: string, format: uuid, description: anchor occurrence}
        booked_scope: {type: string, enum: [all_linked, custom]}
        session_ids: {type: array, items: {type: string, format: uuid}, description: required for custom}
        pricing: {type: string, enum: [entitlement, free]}
        client_package_id: {type: string, format: uuid}
    EnrollmentBatchResult:
      type: object
      description: Per-occurrence outcome; full or ineligible sessions are skipped, not fatal.
      required: [batch_id, enrolled, skipped]
      properties:
        batch_id: {type: string, format: uuid}
        enrolled: {type: array, items: {$ref: '#/components/schemas/Enrollment'}}
        skipped:
          type: array
          items:
            type: object
            properties:
              session_id: {type: string, format: uuid}
              code:
                type: string
                description: capacity-full, already-enrolled, no-credit-remaining, policy-violation
    EnrollmentCancel:
      type: object
      description: Cancel or remove. Staff choose the credit and billing outcome; clients get the outcome the booking policy
        dictates.
      properties:
        cancel_kind: {type: string, enum: [early, late, staff_removed]}
        billing_disposition: {type: string, enum: [reversed, kept, none]}
        reason: {type: string}
        add_to_waitlist: {type: boolean, description: demote instead of drop}
        scope: {type: string, enum: [single, batch], description: cancel every enrolment of the batch}
    EnrollmentRebook:
      type: object
      description: Early-cancel and re-enrol in another session in one transaction (CLS-03).
      required: [session_id]
      properties:
        session_id: {type: string, format: uuid}
        client_package_id: {type: string, format: uuid}
    RosterRow:
      type: object
      description: 'Roster line: enrolment plus participant summary and the attendance mark for the session in question.'
      required: [enrollment, client_name, attendance_status]
      properties:
        enrollment: {$ref: '#/components/schemas/Enrollment'}
        client_name: {type: string}
        client_photo_url: {type: [string, 'null'], format: uri}
        alerts:
          type: array
          items: {type: string}
          description: unsigned waiver, balance due, medical note flag
        attendance_status:
          type: string
          enum: [unmarked, attended, no_show, late_cancel, early_cancel, excused]
        checked_in_at: {type: [string, 'null'], format: date-time}
    SessionRoster:
      type: object
      description: Roster of one session with seat counters (CLS-03).
      required: [session_id, capacity, booked_count, rows]
      properties:
        session_id: {type: string, format: uuid}
        capacity: {type: integer}
        booked_count: {type: integer}
        waitlist_count: {type: integer}
        rows: {type: array, items: {$ref: '#/components/schemas/RosterRow'}}
    AttendanceMarks:
      type: object
      description: Bulk upsert of attendance marks; idempotent per (enrollment, session).
      required: [marks]
      properties:
        marks:
          type: array
          items:
            type: object
            required: [enrollment_id, status]
            properties:
              enrollment_id: {type: string, format: uuid}
              status:
                type: string
                enum: [unmarked, attended, no_show, late_cancel, early_cancel, excused]
    WaitlistEntry:
      type: object
      description: FIFO queue entry for a full group node, session or form (CLS-06, REG-09). Position is derived.
      required: [id]
      properties:
        id: {type: string, format: uuid}
        location_id: {type: string, format: uuid}
        client_id: {type: string, format: uuid}
        target_kind: {type: string, enum: [group, session, form]}
        program_group_id: {type: [string, 'null'], format: uuid}
        session_id: {type: [string, 'null'], format: uuid}
        form_id: {type: [string, 'null'], format: uuid}
        status: {type: string, enum: [waiting, offered, promoted, expired, removed]}
        mode: {type: string, enum: [manual, auto_promote, open_offer]}
        position: {type: [integer, 'null']}
        queued_at: {type: string, format: date-time}
        offer_expires_at: {type: [string, 'null'], format: date-time}
        promoted_enrollment_id: {type: [string, 'null'], format: uuid}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    WaitlistEntryCreate:
      type: object
      description: Join a queue; exactly one target.
      required: [client_id]
      properties:
        client_id: {type: string, format: uuid}
        session_id: {type: string, format: uuid}
        program_group_id: {type: string, format: uuid}
        form_id: {type: string, format: uuid}
        client_package_id: {type: string, format: uuid, description: entitlement to consume on promotion}
    WaitlistPromote:
      type: object
      description: Staff "set as enrolled".
      properties:
        bill_now: {type: boolean, description: raise the charge at promotion (REG-09)}
        program_fee_ids: {type: array, items: {type: string, format: uuid}}
        override_capacity: {type: boolean}
    SessionBookingPolicy:
      type: object
      description: 'Self-service booking rules: the location default row, or an override for one reservation type (SSP-02,
        SSP-03). PUT replaces.'
      required: [location_id]
      properties:
        id: {type: string, format: uuid}
        location_id: {type: string, format: uuid}
        reservation_type_id: {type: [string, 'null'], format: uuid, description: null = location default}
        allows_self_booking: {type: boolean}
        allows_self_cancel: {type: boolean}
        listing_mode: {type: string, enum: [bookable, list_only, unlisted, hidden]}
        booking_opens_min_before: {type: [integer, 'null']}
        booking_closes_min_before: {type: integer}
        early_cancel_cutoff_min: {type: integer}
        late_cancel_consumes_credit: {type: boolean}
        max_bookings_per_day: {type: [integer, 'null']}
        requires_entitlement: {type: boolean}
        allows_inline_purchase: {type: boolean}
        allowed_package_plan_ids: {type: array, items: {type: string, format: uuid}}
        waitlist_mode: {type: string, enum: [disabled, auto_promote, open_offer]}
        waitlist_offer_min: {type: [integer, 'null']}
        hides_full_sessions: {type: boolean}
        visible_range_days: {type: integer}
        sends_instant_staff_alert: {type: boolean}
    CheckoutItem:
      type: object
      description: One line of a registration checkout.
      required: [kind, client_id]
      properties:
        id: {type: string, format: uuid}
        kind:
          type: string
          enum: [group_enrollment, session_enrollment, package_purchase, form_submission]
        client_id: {type: string, format: uuid}
        program_group_id: {type: [string, 'null'], format: uuid}
        session_id: {type: [string, 'null'], format: uuid}
        package_plan_id: {type: [string, 'null'], format: uuid}
        program_fee_ids: {type: array, items: {type: string, format: uuid}}
        form_answers: {type: [object, 'null'], additionalProperties: true}
        enrollment_id: {type: [string, 'null'], format: uuid}
        amount_minor: {type: integer, description: Minor units of the tenant currency.}
    CheckoutItemInput:
      type: object
      description: Add a line; takes the seat as a pending enrolment with a hold expiry. `package_plan_id` with `session_id`
        is the inline package purchase (SSP-08).
      required: [kind, client_id]
      properties:
        kind: {type: string}
        client_id:
          type: string
          format: uuid
          description: participant; must satisfy can_act_for on the portal
        program_group_id: {type: string, format: uuid}
        session_id: {type: string, format: uuid}
        package_plan_id: {type: string, format: uuid}
        program_fee_ids: {type: array, items: {type: string, format: uuid}}
        new_subgroup_name: {type: string, description: team registration creates a child node}
        form_answers: {type: object, additionalProperties: true}
    RegistrationCheckout:
      type: object
      description: Cart for group registration, session booking with inline purchase, and form submission (REG-07, REG-12,
        SSP-08).
      required: [id]
      properties:
        id: {type: string, format: uuid}
        location_id: {type: string, format: uuid}
        account_client_id: {type: string, format: uuid}
        channel: {type: string, enum: [staff, portal, public_link, mobile, api]}
        status: {type: string, enum: [open, awaiting_payment, completed, expired, abandoned]}
        items: {type: array, items: {$ref: '#/components/schemas/CheckoutItem'}}
        subtotal_minor: {type: integer, description: Minor units of the tenant currency.}
        discount_minor: {type: integer, description: Minor units of the tenant currency.}
        tax_minor: {type: integer, description: Minor units of the tenant currency.}
        total_minor: {type: integer, description: Minor units of the tenant currency.}
        due_now_minor: {type: integer, description: Minor units of the tenant currency.}
        coupon_id: {type: [string, 'null'], format: uuid}
        invoice_id: {type: [string, 'null'], format: uuid}
        expires_at: {type: string, format: date-time}
        required_document_template_ids: {type: array, items: {type: string, format: uuid}}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    RegistrationCheckoutCreate:
      type: object
      description: Open a cart (staff surface; the portal uses PortalRegistrationCheckoutCreate).
      required: [location_id]
      properties:
        location_id: {type: string, format: uuid}
        account_client_id: {type: string, format: uuid, description: payer (Bill To)}
        items: {type: array, items: {$ref: '#/components/schemas/CheckoutItemInput'}}
    PortalRegistrationCheckoutCreate:
      type: object
      additionalProperties: false
      description: Open a portal cart. The payer is always the acting identity's own client (not settable); registrants on
        the items may be the caller or dependents the caller can act for. Every confirm path (card, stored method,
        pay_later, autopay) charges or bills that same payer.
      required: [location_id]
      properties:
        location_id: {type: string, format: uuid}
        items: {type: array, items: {$ref: '#/components/schemas/CheckoutItemInput'}}
    CheckoutConfirm:
      type: object
      description: Confirm and pay (staff surface; the portal uses PortalCheckoutConfirm). Payment detail is a billing
        payment-method reference or a provider confirmation token; never card data.
      properties:
        payment_method_id: {type: string, format: uuid, description: must belong to the checkout's payer}
        provider_confirmation_token: {type: string}
        pay_later: {type: boolean, description: staff may defer payment regardless of policy}
        accepted_document_ids:
          type: array
          items: {type: string, format: uuid}
          description: signed documents (documents context)
        accepts_payment_terms: {type: boolean}
    PortalCheckoutConfirm:
      type: object
      additionalProperties: false
      description: Confirm and pay a portal cart. Payment detail is a stored method or a provider confirmation token; never
        card data.
      properties:
        payment_method_id:
          type: string
          format: uuid
          description: must be owned by the checkout's payer, and the payer must be a client the identity holds direct portal
            access to (never a dependent's or related client's stored method); else 403
        provider_confirmation_token: {type: string}
        pay_later: {type: boolean, description: honoured only where the tenant's payment policy allows deferral online; else 422}
        accepted_document_ids:
          type: array
          items: {type: string, format: uuid}
          description: documents the caller signed; each must be for a client the caller can act for
        accepts_payment_terms: {type: boolean}
    SessionListing:
      type: object
      description: A bookable session with the eligibility verdict for the acting client (CLS-09, SSP-12).
      required: [session_id, starts_at, eligibility]
      properties:
        session_id: {type: string, format: uuid}
        reservation_type_id: {type: string, format: uuid}
        name: {type: string}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        resource_name: {type: [string, 'null']}
        trainer_name: {type: [string, 'null']}
        spots_left: {type: [integer, 'null']}
        is_virtual: {type: boolean}
        my_enrollment_id: {type: [string, 'null'], format: uuid}
        my_waitlist_entry_id: {type: [string, 'null'], format: uuid}
        eligibility:
          type: string
          enum: [bookable, needs_purchase, full_waitlist, full, closed, not_yet_open, already_booked]
        eligible_client_package_ids: {type: array, items: {type: string, format: uuid}}
        purchasable_package_plan_ids: {type: array, items: {type: string, format: uuid}}
    PublicProgramGroup:
      type: object
      description: Published program as seen by registrants (SSP-17, REG-12).
      required: [id, name, registration_state]
      properties:
        id: {type: string, format: uuid}
        location_id: {type: string, format: uuid}
        name: {type: string}
        description_html: {type: [string, 'null']}
        starts_on: {type: [string, 'null'], format: date}
        ends_on: {type: [string, 'null'], format: date}
        spots_left: {type: [integer, 'null']}
        registration_state: {type: string, enum: [open, not_yet_open, closed, full_waitlist, full]}
        fees: {type: array, items: {$ref: '#/components/schemas/ProgramFee'}}
        children: {type: array, items: {$ref: '#/components/schemas/PublicProgramGroup'}}
        sessions: {type: array, items: {$ref: '#/components/schemas/ProgramSessionLink'}}
        form_id: {type: [string, 'null'], format: uuid}
        required_document_template_ids: {type: array, items: {type: string, format: uuid}}
    RosterMessage:
      type: object
      description: Email everyone on a roster (CLS-03); creates a direct-send campaign with a session or group audience.
      required: [subject, body_html]
      properties:
        subject: {type: string}
        body_html: {type: string}
        message_template_id: {type: string, format: uuid}
        statuses: {type: array, items: {type: string}, description: enrolment statuses to include}
    Accepted:
      type: object
      description: Handle for an asynchronous command.
      required: [job_id, status]
      properties:
        job_id: {type: string, format: uuid}
        status: {type: string, enum: [queued, running, succeeded, failed]}
        resource_url: {type: [string, 'null']}
    Sport:
      type: object
      description: Sport with defaults snapshotted onto new competitions (LGE-01, LGE-05).
      required: [id]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        game_length_min: {type: integer}
        points_win: {type: integer}
        points_tie: {type: integer}
        points_loss: {type: integer}
        standings_columns: {type: array, items: {type: string}}
        tiebreakers: {type: array, items: {type: string}}
        is_active: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    SportInput:
      type: object
      description: Create or merge-patch a sport.
      required: [name]
      properties:
        name: {type: string}
        game_length_min: {type: integer}
        points_win: {type: integer}
        points_tie: {type: integer}
        points_loss: {type: integer}
        standings_columns: {type: array, items: {type: string}}
        tiebreakers: {type: array, items: {type: string}}
        is_active: {type: boolean}
    AgeGroup:
      type: object
      description: Age classification of competitions.
      required: [id]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        min_age: {type: [integer, 'null']}
        max_age: {type: [integer, 'null']}
        sort_order: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AgeGroupInput:
      type: object
      description: Create or merge-patch an age group.
      required: [name]
      properties:
        name: {type: string}
        min_age: {type: [integer, 'null']}
        max_age: {type: [integer, 'null']}
        sort_order: {type: integer}
    Season:
      type: object
      description: Season grouping competitions.
      required: [id]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        starts_on: {type: [string, 'null'], format: date}
        ends_on: {type: [string, 'null'], format: date}
        is_current: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    SeasonInput:
      type: object
      description: Create or merge-patch a season.
      required: [name]
      properties:
        name: {type: string}
        starts_on: {type: [string, 'null'], format: date}
        ends_on: {type: [string, 'null'], format: date}
        is_current: {type: boolean}
    Competition:
      type: object
      description: One league or tournament (LGE-01, LGE-02).
      required: [id]
      properties:
        id: {type: string, format: uuid}
        location_id: {type: string, format: uuid}
        kind: {type: string, enum: [league, tournament]}
        format:
          type: string
          enum: [round_robin, pool_play, single_elimination, double_elimination, three_games_guaranteed]
        name: {type: string}
        sport_id: {type: string, format: uuid}
        age_group_id: {type: [string, 'null'], format: uuid}
        season_id: {type: [string, 'null'], format: uuid}
        division_label: {type: [string, 'null']}
        starts_on: {type: string, format: date}
        ends_on: {type: [string, 'null'], format: date}
        game_length_min: {type: integer}
        is_public: {type: boolean}
        shows_roster_publicly: {type: boolean}
        points_win: {type: integer}
        points_tie: {type: integer}
        points_loss: {type: integer}
        standings:
          type: object
          additionalProperties: true
          description: columns, tiebreaker order, forfeit and bonus point rules (LGE-06)
        max_defaults: {type: [integer, 'null']}
        source_program_group_id: {type: [string, 'null'], format: uuid}
        status: {type: string, enum: [draft, active, completed, archived]}
        team_count: {type: integer}
        game_count: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    CompetitionInput:
      type: object
      description: Create or merge-patch a competition. `kind` is immutable once linked to a program group; sport defaults
        are snapshotted at create.
      required: [location_id, kind, format, name, sport_id, starts_on]
      properties:
        location_id: {type: string, format: uuid}
        kind: {type: string, enum: [league, tournament]}
        format:
          type: string
          enum: [round_robin, pool_play, single_elimination, double_elimination, three_games_guaranteed]
        name: {type: string}
        sport_id: {type: string, format: uuid}
        age_group_id: {type: [string, 'null'], format: uuid}
        season_id: {type: [string, 'null'], format: uuid}
        division_label: {type: [string, 'null']}
        starts_on: {type: string, format: date}
        ends_on: {type: [string, 'null'], format: date}
        game_length_min: {type: integer}
        is_public: {type: boolean}
        shows_roster_publicly: {type: boolean}
        points_win: {type: integer}
        points_tie: {type: integer}
        points_loss: {type: integer}
        standings:
          type: object
          additionalProperties: true
          description: columns, tiebreaker order, forfeit and bonus point rules (LGE-06)
        max_defaults: {type: [integer, 'null']}
        source_program_group_id: {type: [string, 'null'], format: uuid}
    Division:
      type: object
      description: Division or pool inside a competition.
      required: [id]
      properties:
        id: {type: string, format: uuid}
        competition_id: {type: string, format: uuid}
        name: {type: string}
        kind: {type: string, enum: [division, pool]}
        sort_order: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    DivisionInput:
      type: object
      description: Create or merge-patch a division.
      required: [name]
      properties: {name: {type: string}, kind: {type: string}, sort_order: {type: integer}}
    Team:
      type: object
      description: Persistent team identity, reusable across competitions (LGE-03).
      required: [id]
      properties:
        id: {type: string, format: uuid}
        location_id: {type: string, format: uuid}
        name: {type: string}
        short_name: {type: [string, 'null']}
        color: {type: [string, 'null']}
        program_group_id: {type: [string, 'null'], format: uuid}
        captain_client_id: {type: [string, 'null'], format: uuid}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    TeamInput:
      type: object
      description: Create or merge-patch a team.
      required: [location_id, name]
      properties:
        location_id: {type: string, format: uuid}
        name: {type: string}
        short_name: {type: [string, 'null']}
        color: {type: [string, 'null']}
        captain_client_id: {type: [string, 'null'], format: uuid}
    CompetitionTeam:
      type: object
      description: A team entered in a competition, with division and seed.
      required: [id]
      properties:
        id: {type: string, format: uuid}
        competition_id: {type: string, format: uuid}
        team_id: {type: string, format: uuid}
        team_name: {type: string}
        division_id: {type: [string, 'null'], format: uuid}
        seed: {type: [integer, 'null']}
        status: {type: string, enum: [active, withdrawn]}
        roster_count: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    CompetitionTeamInput:
      type: object
      description: Enter an existing team or create one inline.
      properties:
        team_id: {type: string, format: uuid}
        team: {$ref: '#/components/schemas/TeamInput'}
        division_id: {type: [string, 'null'], format: uuid}
        seed: {type: [integer, 'null']}
        status: {type: string}
    TeamGenerate:
      type: object
      description: Generate placeholder teams ("Team 1".."Team N").
      required: [count]
      properties:
        count: {type: integer}
        name_prefix: {type: string}
        division_id: {type: [string, 'null'], format: uuid}
    TeamCopy:
      type: object
      description: Copy team entries, optionally with rosters, from another competition.
      required: [source_competition_id]
      properties:
        source_competition_id: {type: string, format: uuid}
        competition_team_ids: {type: array, items: {type: string, format: uuid}, description: default all}
        includes_rosters: {type: boolean}
    Seeding:
      type: object
      description: Full seeding of a competition or division; applied atomically (deferrable unique).
      required: [competition_team_ids]
      properties:
        division_id: {type: [string, 'null'], format: uuid}
        competition_team_ids: {type: array, items: {type: string, format: uuid}, description: in seed order}
    LeagueRosterEntry:
      type: object
      description: Player on a competition team. Linked to a client where known; unlinked name-only fallback allowed (LGE-04).
      required: [id]
      properties:
        id: {type: string, format: uuid}
        competition_team_id: {type: string, format: uuid}
        client_id: {type: [string, 'null'], format: uuid}
        display_name: {type: string}
        jersey_number: {type: [string, 'null']}
        position: {type: [string, 'null']}
        role: {type: string, enum: [player, captain, coach, manager]}
        status: {type: string, enum: [active, suspended, removed]}
        enrollment_id: {type: [string, 'null'], format: uuid}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    LeagueRosterEntryInput:
      type: object
      description: Add or merge-patch a roster entry.
      properties:
        client_id: {type: [string, 'null'], format: uuid}
        first_name: {type: string}
        last_name: {type: string}
        jersey_number: {type: [string, 'null']}
        position: {type: [string, 'null']}
        role: {type: string}
        status: {type: string}
    Standing:
      type: object
      description: Computed standings row for one competition team (LGE-06).
      required: [competition_team_id, rank]
      properties:
        id: {type: string, format: uuid}
        competition_team_id: {type: string, format: uuid}
        team_name: {type: string}
        division_id: {type: [string, 'null'], format: uuid}
        rank: {type: integer}
        played: {type: integer}
        wins: {type: integer}
        losses: {type: integer}
        ties: {type: integer}
        points: {type: integer}
        points_for: {type: integer}
        points_against: {type: integer}
        adjustment_points: {type: integer}
        defaults: {type: integer}
        is_over_default_cap: {type: boolean}
        extra: {type: object, additionalProperties: true, description: sport-specific columns}
    StandingAdjust:
      type: object
      description: Manual points adjustment or penalty; audited.
      required: [adjustment_points, reason]
      properties: {adjustment_points: {type: integer}, reason: {type: string}}
    ScheduleRun:
      type: object
      description: 'One run of the schedule generator: inputs, state and balance statistics (LGE-08).'
      required: [id]
      properties:
        id: {type: string, format: uuid}
        location_id: {type: string, format: uuid}
        kind: {type: string, enum: [round_robin, pool_play, bracket]}
        competition_ids: {type: array, items: {type: string, format: uuid}}
        resource_ids: {type: array, items: {type: string, format: uuid}}
        starts_on: {type: string, format: date}
        ends_on: {type: [string, 'null'], format: date}
        time_slots:
          type: array
          description: Weekly windows per resource.
          items:
            type: object
            properties:
              weekday: {type: integer}
              starts_at: {type: string, format: time}
              ends_at: {type: string, format: time}
              resource_id: {type: [string, 'null'], format: uuid}
        blackout_dates: {type: array, items: {type: string, format: date}}
        games_per_team: {type: [integer, 'null']}
        rounds: {type: [integer, 'null']}
        game_length_min: {type: integer}
        buffer_min: {type: integer}
        bye_mode: {type: string, enum: [hidden, occupy_slot, fold_last_round, rotate_extra_game], description: odd team counts (LGE-09)}
        max_games_per_team_per_day: {type: integer}
        reservation_type_id: {type: string, format: uuid}
        wizard_step: {type: integer}
        state:
          type: string
          enum: [draft, generating, previewed, committing, committed, failed, discarded]
        stats:
          type: [object, 'null']
          additionalProperties: true
          description: per-team home/away, time-slot and venue balance
        proposed_count: {type: integer}
        scheduled_count: {type: integer}
        unschedulable_count: {type: integer}
        error: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ScheduleRunInput:
      type: object
      description: Create or merge-patch the wizard inputs (auto-saved per step). Editing a previewed run discards its proposed
        games.
      required: [location_id, kind, competition_ids]
      properties:
        location_id: {type: string, format: uuid}
        kind: {type: string, enum: [round_robin, pool_play, bracket]}
        competition_ids: {type: array, items: {type: string, format: uuid}}
        resource_ids: {type: array, items: {type: string, format: uuid}}
        starts_on: {type: string, format: date}
        ends_on: {type: [string, 'null'], format: date}
        time_slots:
          type: array
          description: Weekly windows per resource.
          items:
            type: object
            properties:
              weekday: {type: integer}
              starts_at: {type: string, format: time}
              ends_at: {type: string, format: time}
              resource_id: {type: [string, 'null'], format: uuid}
        blackout_dates: {type: array, items: {type: string, format: date}}
        games_per_team: {type: [integer, 'null']}
        rounds: {type: [integer, 'null']}
        game_length_min: {type: integer}
        buffer_min: {type: integer}
        bye_mode: {type: string, enum: [hidden, occupy_slot, fold_last_round, rotate_extra_game], description: odd team counts (LGE-09)}
        max_games_per_team_per_day: {type: integer}
        reservation_type_id: {type: string, format: uuid}
        wizard_step: {type: integer}
    Game:
      type: object
      description: A fixture. Scheduled games own a booking in scheduling; byes, proposed and unschedulable games do not
        (LGE-08, LGE-31).
      required: [id]
      properties:
        id: {type: string, format: uuid}
        competition_id: {type: string, format: uuid}
        division_id: {type: [string, 'null'], format: uuid}
        home_team_id: {type: [string, 'null'], format: uuid}
        away_team_id: {type: [string, 'null'], format: uuid}
        home_label: {type: [string, 'null']}
        away_label: {type: [string, 'null']}
        resource_id: {type: [string, 'null'], format: uuid}
        starts_at: {type: [string, 'null'], format: date-time}
        length_min: {type: integer}
        game_type: {type: string, enum: [regular, post_season]}
        round_label: {type: [string, 'null']}
        location_id: {type: string, format: uuid}
        status:
          type: string
          enum: [proposed, scheduled, bye, unschedulable, played, postponed, cancelled]
        ends_at: {type: [string, 'null'], format: date-time}
        booking_id: {type: [string, 'null'], format: uuid}
        schedule_run_id: {type: [string, 'null'], format: uuid}
        bracket_slot_id: {type: [string, 'null'], format: uuid}
        is_bye: {type: boolean}
        doubleheader_of_game_id: {type: [string, 'null'], format: uuid}
        home_score: {type: [integer, 'null']}
        away_score: {type: [integer, 'null']}
        officials: {type: array, items: {$ref: '#/components/schemas/GameOfficial'}}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    GameReschedule:
      type: object
      description: Move a game; the booking is moved under the hold exclusion constraint.
      required: [resource_id, starts_at]
      properties:
        resource_id: {type: string, format: uuid}
        starts_at: {type: string, format: date-time}
        notifies_teams: {type: boolean}
    GameSide:
      type: object
      description: Result of one side.
      required: [competition_team_id]
      properties:
        competition_team_id: {type: string, format: uuid}
        score: {type: integer}
        outcome:
          type: string
          enum: [win, loss, tie, forfeit_win, forfeit_loss, double_forfeit, default_loss]
        overtime: {type: boolean}
        bonus_points: {type: integer}
        sportsmanship_points: {type: [integer, 'null']}
        participation: {type: [integer, 'null']}
        cards: {type: [object, 'null'], additionalProperties: true, description: discipline counts by kind}
    GameResult:
      type: object
      description: Both sides of a played game (LGE-14).
      required: [game_id, home, away]
      properties:
        game_id: {type: string, format: uuid}
        status: {type: string, enum: [played, scheduled]}
        home: {$ref: '#/components/schemas/GameSide'}
        away: {$ref: '#/components/schemas/GameSide'}
        notes: {type: [string, 'null']}
        entered_by_staff_user_id: {type: string, format: uuid}
        entered_at: {type: string, format: date-time}
    GameResultInput:
      type: object
      description: Save or amend a result. Outcome is derived from scores unless a forfeit or default is given.
      required: [home, away]
      properties:
        home: {$ref: '#/components/schemas/GameSide'}
        away: {$ref: '#/components/schemas/GameSide'}
        notes: {type: [string, 'null']}
    Official:
      type: object
      description: Referee, umpire or scorekeeper. Not a staff user by default (LGE-15).
      required: [id]
      properties:
        id: {type: string, format: uuid}
        location_id: {type: string, format: uuid}
        first_name: {type: string}
        last_name: {type: string}
        email: {type: [string, 'null'], format: email}
        phone: {type: [string, 'null']}
        staff_user_id: {type: [string, 'null'], format: uuid}
        sport_ids: {type: array, items: {type: string, format: uuid}}
        age_group_ids: {type: array, items: {type: string, format: uuid}}
        is_active: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    OfficialInput:
      type: object
      description: Create or merge-patch an official.
      required: [location_id, first_name, last_name]
      properties:
        location_id: {type: string, format: uuid}
        first_name: {type: string}
        last_name: {type: string}
        email: {type: [string, 'null'], format: email}
        phone: {type: [string, 'null']}
        staff_user_id: {type: [string, 'null'], format: uuid}
        sport_ids: {type: array, items: {type: string, format: uuid}}
        age_group_ids: {type: array, items: {type: string, format: uuid}}
        is_active: {type: boolean}
    GameOfficial:
      type: object
      description: Assignment of an official to a game.
      required: [official_id, role]
      properties:
        id: {type: string, format: uuid}
        game_id: {type: string, format: uuid}
        official_id: {type: string, format: uuid}
        official_name: {type: string}
        role: {type: string}
        status: {type: string, enum: [assigned, confirmed, declined]}
    GameOfficialsInput:
      type: object
      description: Replace the assignments of a game. An official cannot hold overlapping games (exclusion constraint).
      required: [assignments]
      properties:
        assignments:
          type: array
          items:
            type: object
            required: [official_id, role]
            properties: {official_id: {type: string, format: uuid}, role: {type: string}}
    GameInput:
      type: object
      description: Manual game add or merge-patch (LGE-31). With resource_id and starts_at the booking is created immediately;
        labels stand in for undetermined opponents.
      required: [competition_id]
      properties:
        competition_id: {type: string, format: uuid}
        division_id: {type: [string, 'null'], format: uuid}
        home_team_id: {type: [string, 'null'], format: uuid}
        away_team_id: {type: [string, 'null'], format: uuid}
        home_label: {type: [string, 'null']}
        away_label: {type: [string, 'null']}
        resource_id: {type: [string, 'null'], format: uuid}
        starts_at: {type: [string, 'null'], format: date-time}
        length_min: {type: integer}
        game_type: {type: string, enum: [regular, post_season]}
        round_label: {type: [string, 'null']}
    BracketSlot:
      type: object
      description: One position in a bracket round; decided when its game is played or it is a bye.
      required: [id, round_number, position]
      properties:
        id: {type: string, format: uuid}
        bracket_round_id: {type: string, format: uuid}
        round_number: {type: integer}
        position: {type: integer}
        side: {type: string, enum: [winners, losers, final, consolation]}
        game_id: {type: [string, 'null'], format: uuid}
        home_source: {type: [string, 'null'], description: 'seed N, winner of slot X, loser of slot Y'}
        away_source: {type: [string, 'null']}
        home_team_id: {type: [string, 'null'], format: uuid}
        away_team_id: {type: [string, 'null'], format: uuid}
        is_bye: {type: boolean}
        winner_team_id: {type: [string, 'null'], format: uuid}
    Bracket:
      type: object
      description: Elimination bracket with rounds and slots (LGE-12).
      required: [id]
      properties:
        id: {type: string, format: uuid}
        competition_id: {type: string, format: uuid}
        name: {type: string}
        bracket_type: {type: string, enum: [single_elimination, double_elimination, three_games_guaranteed]}
        size: {type: integer}
        status: {type: string, enum: [draft, published, completed]}
        has_third_place_game: {type: boolean}
        slots: {type: array, items: {$ref: '#/components/schemas/BracketSlot'}}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    BracketGenerate:
      type: object
      description: Generate a draft bracket from seeds or final standings. Non-power-of-two entries get byes for top seeds.
      required: [bracket_type, seed_source]
      properties:
        name: {type: string}
        bracket_type: {type: string}
        seed_source: {type: string, enum: [seeds, standings, manual]}
        competition_team_ids: {type: array, items: {type: string, format: uuid}, description: manual order}
        division_id: {type: [string, 'null'], format: uuid}
        has_third_place_game: {type: boolean}
    BracketSlotInput:
      type: object
      description: Assign teams, venue and time to a slot (creates or moves the game booking).
      properties:
        home_team_id: {type: [string, 'null'], format: uuid}
        away_team_id: {type: [string, 'null'], format: uuid}
        resource_id: {type: [string, 'null'], format: uuid}
        starts_at: {type: [string, 'null'], format: date-time}
    EmailVerification:
      type: object
      description: Double opt-in state of one client email address (MKT-01).
      required: [client_id, email, status]
      properties:
        client_id: {type: string, format: uuid}
        email: {type: string, format: email}
        status: {type: string, enum: [pending, verified]}
        method: {type: [string, 'null'], enum: [client_link, staff_manual, sign_in, null]}
        consent_basis: {type: string, enum: [express, implied_purchase, implied_inquiry]}
        sent_at: {type: [string, 'null'], format: date-time}
        verified_at: {type: [string, 'null'], format: date-time}
    CommunicationPreferences:
      type: object
      description: Per-address subscriptions by topic and channel (MKT-02). PUT replaces.
      required: [topics]
      properties:
        client_id: {type: string, format: uuid}
        email: {type: [string, 'null'], format: email}
        topics:
          type: array
          items:
            type: object
            required: [topic, channel, is_subscribed]
            properties:
              topic:
                type: string
                enum: [marketing, session_reminders, billing_notices, league_alerts, news]
              channel: {type: string, enum: [email, push, sms]}
              is_subscribed: {type: boolean}
              is_locked: {type: boolean, description: transactional; cannot be turned off}
        is_globally_unsubscribed: {type: boolean}
    CommunicationPreferencesUpdate:
      type: object
      additionalProperties: false
      description: Portal replace of the acted-for client's subscriptions. The subject comes from `acting_for` (can_act_for),
        never the body; `is_locked` topics are ignored server-side.
      required: [topics]
      properties:
        topics:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [topic, channel, is_subscribed]
            properties:
              topic:
                type: string
                enum: [marketing, session_reminders, billing_notices, league_alerts, news]
              channel: {type: string, enum: [email, push, sms]}
              is_subscribed: {type: boolean}
        is_globally_unsubscribed: {type: boolean}
    PublicCommunicationPreferencesUpdate:
      type: object
      additionalProperties: false
      description: Preference-centre save from a signed email link. The subject address is the one bound to the token; the
        body cannot name a client or address.
      required: [token, topics]
      properties:
        token: {type: string, description: signed preference-centre token; short-lived, redacted from logs}
        topics:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [topic, channel, is_subscribed]
            properties:
              topic:
                type: string
                enum: [marketing, session_reminders, billing_notices, league_alerts, news]
              channel: {type: string, enum: [email, push, sms]}
              is_subscribed: {type: boolean}
        is_globally_unsubscribed: {type: boolean}
    MessageTemplate:
      type: object
      description: 'Reusable content: preset, saved or system template (MKT-05).'
      required: [id]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [full, subject_only]}
        origin: {type: string, enum: [preset, saved, system]}
        channel: {type: string, enum: [email, push, sms]}
        name: {type: string}
        subject: {type: [string, 'null']}
        body_html: {type: [string, 'null']}
        body_text: {type: [string, 'null']}
        system_key: {type: [string, 'null'], description: e.g. booking_confirmation}
        location_id: {type: [string, 'null'], format: uuid}
        is_active: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    MessageTemplateInput:
      type: object
      description: Create or merge-patch a template. System templates can be edited, not created or deleted.
      required: [name, channel]
      properties:
        kind: {type: string}
        channel: {type: string}
        name: {type: string}
        subject: {type: [string, 'null']}
        body_html: {type: [string, 'null']}
        body_text: {type: [string, 'null']}
        location_id: {type: [string, 'null'], format: uuid}
        is_active: {type: boolean}
    Segment:
      type: object
      description: Saved audience definition; built-ins are read-only (MKT-03).
      required: [id]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        is_builtin: {type: boolean}
        definition:
          type: object
          additionalProperties: true
          description: source (all_clients, members_by_status, program_group, session, form, competition) plus filters
        estimated_size: {type: [integer, 'null']}
        location_id: {type: [string, 'null'], format: uuid}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    SegmentInput:
      type: object
      description: Create or merge-patch a segment.
      required: [name, definition]
      properties:
        name: {type: string}
        definition: {type: object, additionalProperties: true}
        location_id: {type: [string, 'null'], format: uuid}
    SegmentPreview:
      type: object
      description: Audience count before consent, verification and suppression filtering, and after.
      required: [matched, sendable]
      properties:
        matched: {type: integer}
        sendable: {type: integer}
        excluded:
          type: object
          additionalProperties: true
          description: 'counts by reason: unverified, unsubscribed, suppressed, no_address, no_device'
        sample: {type: array, items: {type: object, additionalProperties: true}}
    Campaign:
      type: object
      description: 'A bulk send on one channel: email campaign or push broadcast (MKT-03, MKT-16).'
