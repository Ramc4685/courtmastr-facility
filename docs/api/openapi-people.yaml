        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        default: {$ref: '#/components/responses/Problem'}
      x-problem-codes: [invalid-state-transition]
  /clients/{client_id}/photo:
    put:
      operationId: setClientPhoto
      tags: [clients]
      summary: Set the client photo
      x-priority: P0
      x-surface: staff
      x-permission: clients.client.update
      x-features: [CLI-12]
      security: [{staffSession: []}, {apiKey: []}]
      parameters:
      - name: client_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FileRef'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Client'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deleteClientPhoto
      tags: [clients]
      summary: Remove the client photo
      x-priority: P0
      x-surface: staff
      x-permission: clients.client.update
      x-features: [CLI-12]
      security: [{staffSession: []}, {apiKey: []}]
      parameters:
      - name: client_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '204':
          description: No content
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
  /clients/{client_id}/emergency-contacts:
    get:
      operationId: getClientEmergencyContacts
      tags: [clients]
      summary: Get emergency contacts
      x-priority: P0
      x-surface: staff
      x-permission: clients.client.read_sensitive
      x-features: [CLI-18]
      security: [{staffSession: []}, {apiKey: []}]
      parameters:
      - name: client_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EmergencyContactList'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
