# FacilityHub OpenAPI 3.1 skeleton: clients, documents, memberships, packages, assessments.
# Source of truth for the people contexts until the generated /api/v1/openapi.json replaces it.
openapi: 3.1.0
info:
  title: 'FacilityHub API: people contexts'
  version: 1.0.0-skeleton
  description: |
    Skeleton for the people contexts: clients, documents, memberships, packages, assessments.
    Conforms to docs/architecture/overview.md (3.12 to 3.16) and docs/architecture/data-model-people.md; schemas carry key
    fields only, the data model holds the full column lists. P0 operations are specified; P1 operations are path stubs
    (`x-priority: P1`). P2 and v2-adapter features have no paths (MEM-06, MEM-23, PKG-11, DOC-10..DOC-13).

    Extensions on every operation:
    - `x-priority`: P0 | P1 (parity matrix).
    - `x-surface`: staff (staff session or scoped API key; the public REST API is the same resources, INT-01/02/04) |
      portal (client identity) | public (anonymous, tenant from host, rate-limited).
    - `x-permission`: catalogue key from rbac-matrix.md. `portal:can_act_for` = ownership policy (FAM-03);
      `portal:identity` = any signed-in client identity; `public:token` = possession of a single-use hashed token.
      The router gate uses this key; the service gate additionally applies location, own-clients and subject scope.
    - `x-features`: discovery feature IDs served.
    - `x-problem-codes`: Problem `code` values beyond the generic ones (permission-denied, not-found, validation-failed).

    Conventions and decisions (alternative rejected in brackets):
    1. Nesting rule: only children owned by the clients context nest under `/clients/{client_id}`. Every other context
       exposes top-level collections filtered by `client_id` (`/client-documents?client_id=`, `/assessment-results?client_id=`),
       so no router mounts under another context's prefix. [Uniform nesting under /clients: couples five routers to one path.]
    2. Portal act-for: clients-context portal paths carry `{client_id}`; all other portal paths take `?client_id=` (default:
       the identity's primary client) checked by `can_act_for`. Outside the acting set the answer is 404. [A header such
       as X-Act-For: invisible in logs and caches.]
    3. Optimistic concurrency: bodies of versioned aggregates carry `version`; mismatch is 409 `version-conflict`
       (overview 3.1). [ETag/If-Match: second mechanism beside the stored column.]
    4. Money-moving POSTs (sell, renew, buy, credit adjustment) require `Idempotency-Key`; other creates accept it.
    5. Sale = one command. `sell*`/`buy*` create the entitlement, issue the bound document, create charges and take
       payment through billing.service in one transaction, with a side-effect-free `/quote` twin sharing the request
       schema. [Cart then checkout resources for staff sales: two round trips and an abandoned-cart state for no gain;
       the POS cart (PKG-08) and the session+package checkout (SSP-08) are owned by pos and programs and call
       packages.service in-process.]
    6. Document gate: a sale blocked by an unaccepted bound document returns 409 `document-required` with the pending
       `client_document` id in `blockers`; `document_handling=collect_later` (permission-gated) or `email_link` lets staff
       proceed (DOC-08, MEM-08). Online sales always block.
    7. Membership standing is its own batch resource (`/membership-standings`), as is the waiver flag
       (`/client-document-statuses`): clients (L1) cannot call memberships or documents (L2), so the web client composes
       the list columns. Consequence: the reference's "all members" client view is `listMembershipStandings`, not a
       `view=` on `/clients`. [Embedding standing in the Client payload: upward dependency or an event-fed copy.]
    8. No HTTP surface for credit reserve/release/consume, visit recording, or eligibility checks by other contexts:
       those are in-process service interfaces (packages.service, memberships.service) called by programs, scheduling and
       access. The ledger and visits are read-only over HTTP except the audited manual adjustment.
    9. Communication consent (CLI-16, P0) is not here: it is engagement's `communication-preferences` resource. Portal
       self-registration, login, password and magic link (SSP-05, SSP-06 recovery) are platform identity endpoints.
       Rental-plan sharing (FAM-06) is a rentals resource; POS package sale (PKG-08) is a pos cart line.
       Reports (CLI-11 report, MEM-21, PKG-15, FIT-03/04 exports) are reporting-context resources over the rpt_* views.
    10. Soft-deleted documents: `DELETE /client-documents/{id}` sets deleted_at; `restore` clears it inside the recovery
        window; `void` is the terminal, evidence-keeping state (DOC-06).
    11. Files: uploads go through the platform upload endpoint and are referenced by `file_id`; downloads are signed URLs
        returned as JSON, never redirects (works for cookie and bearer clients alike).

    Open questions for the lead:
    - Q1 SSP-08 (P0) needs online package purchase, which PKG-09 rates P1. The portal package plan list, quote and buy
      are specified as P0 here; confirm, or demote them and ship SSP-08 with pre-owned packages only.
    - Q2 `GET /portal/membership-contracts` is P0 (read-only, for the member card and FAM-04 sharers) although online
      membership sale (MEM-09) and opt-out (MEM-18) are P1. Confirm.
    - Q3 Template and plan reads are gated by the operational permission (`documents.document.generate`,
      `memberships.contract.read`, `packages.package.read`) rather than new `*.template.read` / `*.plan.read` keys.
      Coach/Trainer holds package.sell but only own-scoped package.read; confirm that own-scope does not hide plans.
    - Q4 Staff approval of a pending portal relationship (`approveClientRelationship`) follows rbac-matrix 627; the data
      model only describes token confirmation by the other adult. Both are specified; confirm staff approval stays.
    - Q5 Waiver override uses `documents.document.collect_signature`; a dedicated key may be wanted for audit.
servers:
- {url: /api/v1, description: Versioned API prefix (overview 3.15). Tenant resolved from host.}
tags:
- name: clients
  description: Clients, households, relationships, portal access, tags, field policy (CLI, FAM).
- name: documents
  description: Templates, bindings, issued documents, acceptance evidence, waiver indicator (DOC).
- name: memberships
  description: Types, plans, contracts, billing schedule, freezes, shares, visits (MEM, FAM-04).
- name: packages
  description: Package plans, sold packages, credit ledger, shares (PKG, FAM-05).
- name: assessments
  description: Assessment categories, fields, results and history (FIT).
paths:
  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: Search and list clients
      description: 'Own-clients scope applies when enabled (CLI-17). `members` is not a view here: use listMembershipStandings.'
      x-priority: P0
      x-surface: staff
      x-permission: clients.client.read
      x-features: [CLI-03, CLI-19, INT-02]
      security: [{staffSession: []}, {apiKey: []}]
      parameters:
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Cursor'}
      - {$ref: '#/components/parameters/Sort'}
      - {$ref: '#/components/parameters/Include'}
      - name: q
        in: query
        required: false
        schema: {type: string}
        description: Trigram search over name, email, phone digits, member number; min 3 chars
      - name: view
        in: query
        required: false
        schema:
          type: string
          enum: [all, recently_viewed, recently_created, birthdays, disabled]
        description: Named server-side view (data model T-C3)
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum: [active, disabled]
      - name: client_category_id
        in: query
        required: false
        schema: {type: string, format: uuid}
      - name: tag_id[in]
        in: query
        required: false
        schema: {type: string}
      - name: home_location_id
        in: query
        required: false
        schema: {type: string, format: uuid}
      - name: default_trainer_staff_user_id
        in: query
        required: false
        schema: {type: string, format: uuid}
      - name: birthday_month
        in: query
        required: false
        schema: {type: integer}
      responses:
        '200':
          description: Page
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/ClientSummary'}
                  page: {$ref: '#/components/schemas/Page'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createClient
      tags: [clients]
      summary: Create a client
      x-priority: P0
      x-surface: staff
      x-permission: clients.client.create
      x-features: [CLI-02, CLI-04, CLI-01]
      security: [{staffSession: []}, {apiKey: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClientCreate'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Client'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Problem'}
      x-problem-codes: [duplicate-candidate, already-exists, request-in-progress, idempotency-key-reused]
  /clients/{client_id}:
    get:
      operationId: getClient
      tags: [clients]
      summary: Get a client profile
      description: Upserts client_recent_view for staff sessions. A merged tombstone returns the record with merged_into_id set.
      x-priority: P0
      x-surface: staff
      x-permission: clients.client.read
      x-features: [CLI-01, CLI-19, INT-02]
      security: [{staffSession: []}, {apiKey: []}]
      parameters:
      - name: client_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Client'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      operationId: updateClient
      tags: [clients]
      summary: Update a client profile
      x-priority: P0
      x-surface: staff
      x-permission: clients.client.update
      x-features: [CLI-01, CLI-02, CLI-06, CLI-08, INT-02]
      security: [{staffSession: []}, {apiKey: []}]
      parameters:
      - name: client_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClientUpdate'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Client'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Problem'}
      x-problem-codes: [already-exists, version-conflict]
