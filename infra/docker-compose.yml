# Local infrastructure only. Host ports are deliberately non-default to avoid clashes.
name: facilityhub
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${FH_POSTGRES_PASSWORD:?set in .env}
      FH_DB_OWNER_PASSWORD: ${FH_DB_OWNER_PASSWORD:?set in .env}
      FH_DB_APP_PASSWORD: ${FH_DB_APP_PASSWORD:?set in .env}
      FH_DB_PLATFORM_PASSWORD: ${FH_DB_PLATFORM_PASSWORD:?set in .env}
      TZ: UTC
    ports: ["127.0.0.1:55432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d facilityhub"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:51025:1025", "127.0.0.1:58025:8025"]
  # Optional, off by default: `docker compose --profile storage up -d s3` (S3 adapter tests), and
  # `--profile scan up -d clamav` (malware scanner tests; the first start downloads signatures for minutes).
  # The S3 stand-in is RustFS, a MinIO-compatible server: MinIO no longer publishes container images.
  s3:
    image: rustfs/rustfs:latest
    profiles: [storage]
    environment:
      RUSTFS_ACCESS_KEY: ${FH_S3_ACCESS_KEY_ID:-dev-minio}
      RUSTFS_SECRET_KEY: ${FH_S3_SECRET_ACCESS_KEY:-dev-minio-secret}
    ports: ["127.0.0.1:59000:9000", "127.0.0.1:59001:9001"]
    volumes:
      - s3data:/data
  clamav:
    image: clamav/clamav-debian:stable  # multi-arch; clamav/clamav has no arm64 image
    profiles: [scan]
    ports: ["127.0.0.1:53310:3310"]
volumes:
  pgdata:
  s3data:
