components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: fh_access
      description: 'Web: opaque access token (fhs_ prefix) in an HttpOnly, Secure, SameSite=Lax cookie. Cookie name is provisional.'
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Session-bound token, required with the cookie on unsafe methods.
    bearerToken:
      type: http
      scheme: bearer
      description: Mobile access token or API key. API keys are limited to their scopes (permission keys) and location set.
  parameters:
    Limit:
      name: limit
      in: query
      description: Page size
      schema: {type: integer, default: 50, minimum: 1, maximum: 200}
    Cursor:
      name: cursor
      in: query
      description: Opaque keyset cursor from page.next_cursor
      schema: {type: string}
    Sort:
      name: sort
      in: query
      description: Comma-separated allow-listed fields, - prefix for descending; id is always the tiebreaker
      schema: {type: string}
    Include:
      name: include
      in: query
      description: Comma-separated extras; `total` adds page.total
      schema: {type: string}
    Q:
      name: q
      in: query
      description: Free-text search for the resource
      schema: {type: string}
    LocationId:
      name: location_id
      in: query
      description: Restrict to one permitted location
      schema: {type: string, format: uuid}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: {type: string, maxLength: 255}
      description: Optional for staff sessions, required for API-key principals. Keys live 24 hours (overview 3.12).
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, maxLength: 255}
      description: 'Required: the command moves money or books from portal, mobile or API. Same key with a different body
        is 422 idempotency-key-reused; a concurrent duplicate is 409 request-in-progress.'
  responses:
    Problem:
      description: Any other error. 5xx carries only trace_id.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    BadRequest:
      description: 400 malformed request or unknown query parameter
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unauthenticated:
      description: 401 unauthenticated
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    PaymentDeclined:
      description: 402 payment-declined with the provider decline category
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    PermissionDenied:
      description: '403 permission-denied: visible to the principal but the action is not allowed'
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotFound:
      description: '404 not-found: unknown id, or outside the caller tenant or location scope; also feature-disabled'
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Conflict:
      description: '409 state conflict: booking-conflict, capacity-full, version-conflict, invalid-state-transition, already-exists,
        request-in-progress'
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    ValidationFailed:
      description: 422 validation-failed with errors[] JSON Pointers; also idempotency-key-reused
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    RateLimited:
      description: 429 rate-limited
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
      headers:
        Retry-After:
          schema: {type: integer}
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem document (overview 3.13). `code` is the stable contract.
      required: [type, title, status, code, trace_id]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
        code: {type: string, description: 'Last segment of `type`, e.g. booking-conflict'}
        trace_id: {type: string}
        errors:
          type: array
          description: Validation failures (422)
          items:
            type: object
            required: [pointer, code]
            properties:
              pointer: {type: string, description: JSON Pointer}
              code: {type: string}
              detail: {type: string}
        conflicts:
          type: array
          description: booking-conflict only
          items: {$ref: '#/components/schemas/HoldConflict'}
      additionalProperties: true
    PageInfo:
      type: object
      description: Keyset page (overview 3.14). `total` only with ?include=total.
      required: [next_cursor, has_more]
      properties:
        next_cursor: {type: [string, 'null']}
        has_more: {type: boolean}
        total: {type: integer}
    HoldConflict:
      type: object
      description: '`during` is [start, end) including buffers. `conflicting_booking_id` is null when the caller may not read
        that booking.'
      required: [resource_id, during]
      properties:
        resource_id: {type: string, format: uuid}
        during:
          type: array
          items: {type: string, format: date-time}
        conflicting_booking_id: {type: [string, 'null'], format: uuid}
    SeriesJobAccepted:
      type: object
      description: Returned with 202 when a series command exceeds 50 occurrences and runs as a job (ADR 0004 section 6).
      required: [status, status_url]
      properties:
        status: {type: string, enum: [pending, running]}
        status_url: {type: string, description: 'GET /booking-series/{booking_series_id}/runs/{run_id}'}
        run_id: {type: string, format: uuid}
        booking_series_id: {type: string, format: uuid}
        booking_series_rule_id: {type: [string, 'null'], format: uuid}
    SignInRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string}
        audience: {type: string, enum: [staff, client]}
        client_kind: {type: string, enum: [web, mobile]}
    EmailLinkRequest:
      type: object
      description: Always answered 202 with uniform timing (no account enumeration, ADR 0002).
      required: [email]
      properties:
        email: {type: string, format: email}
        audience: {type: string, enum: [staff, client]}
        redirect_path: {type: string}
    TokenConsumeRequest:
      type: object
      description: '`new_password` required for password_reset; optional for invite (invitee may stay on magic link).'
      required: [token]
      properties:
        token: {type: string}
        new_password: {type: string}
        client_kind: {type: string, enum: [web, mobile]}
    RefreshRequest:
      type: object
      description: Body only for bearer clients; web sends the refresh cookie.
      properties:
        refresh_token: {type: string}
    AuthSession:
      type: object
      description: Tokens appear in the body only for bearer clients (mobile); web gets HttpOnly cookies plus `csrf_token`.
      required: [id, kind, principal, access_expires_at]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [web, mobile, impersonation]}
        principal: {$ref: '#/components/schemas/Principal'}
        access_token: {type: string}
        access_expires_at: {type: string, format: date-time}
        refresh_token: {type: string}
        idle_expires_at: {type: string, format: date-time}
        absolute_expires_at: {type: string, format: date-time}
        mfa_verified_at: {type: [string, 'null'], format: date-time}
        mfa_required: {type: boolean}
        csrf_token: {type: string}
    Principal:
      type: object
      required: [kind, identity_id, email]
      properties:
        kind: {type: string, enum: [staff, client]}
        identity_id: {type: string, format: uuid}
        staff_user_id: {type: [string, 'null'], format: uuid}
        client_ids:
          type: array
          items: {type: string, format: uuid}
        email: {type: string, format: email}
        display_name: {type: string}
    Me:
      type: object
      description: Everything the SPA needs to route by role. `permissions` and `role` are null for client principals.
      required: [principal, tenant]
      properties:
        principal: {$ref: '#/components/schemas/Principal'}
        tenant: {$ref: '#/components/schemas/Tenant'}
        role:
          oneOf:
          - {$ref: '#/components/schemas/RoleRef'}
          - {type: 'null'}
        permissions:
          type: array
          items: {$ref: '#/components/schemas/EffectivePermission'}
        has_all_location_access: {type: boolean}
        locations:
          type: array
          items: {$ref: '#/components/schemas/LocationRef'}
        primary_location_id: {type: [string, 'null'], format: uuid}
        entitlements:
          type: array
          items: {type: string}
        linked_resource_id: {type: [string, 'null'], format: uuid}
    EffectivePermission:
      type: object
      description: '`subject_ids` null = all subjects. `source = override` is the diverged-from-role flag (PLT-05).'
      required: [key, reach]
      properties:
        key: {type: string}
        reach: {type: string, enum: [all, own]}
        subject_type: {type: [string, 'null']}
        subject_ids:
          type: [array, 'null']
          items: {type: string, format: uuid}
        source: {type: string, enum: [role, override]}
    Tenant:
      type: object
      required: [id, name, slug, status, currency, default_time_zone]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        slug: {type: string}
        status: {type: string, enum: [active, suspended, closed]}
        currency: {type: string}
        default_time_zone: {type: string, description: IANA time zone}
        locale: {type: string}
        staff_mfa_policy: {type: string, enum: [optional, privileged, all]}
        trial_ends_on: {type: [string, 'null'], format: date}
        settings: {type: object, additionalProperties: true}
    TenantUpdate:
      type: object
      description: '`currency` is immutable once any charge exists (409 invalid-state-transition).'
      properties:
        name: {type: string}
        default_time_zone: {type: string, description: IANA time zone}
        locale: {type: string}
        currency: {type: string}
        settings: {type: object, additionalProperties: true}
    LocationRef:
      type: object
      required: [id, name]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        slug: {type: string}
        time_zone: {type: string, description: IANA time zone}
    Location:
      type: object
      required: [id, name, slug, time_zone, status]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        public_name: {type: string}
        slug: {type: string}
        address_line1: {type: [string, 'null']}
        address_line2: {type: [string, 'null']}
        city: {type: [string, 'null']}
        region: {type: [string, 'null']}
        postal_code: {type: [string, 'null']}
        country_code: {type: string}
        phone: {type: [string, 'null']}
        email: {type: [string, 'null'], format: email}
        alert_email: {type: [string, 'null'], format: email}
        website_url: {type: [string, 'null']}
        time_zone: {type: string, description: IANA time zone}
        membership_renewal_run_time: {type: string, format: time, description: 'Location-local wall time HH:MM'}
        package_renewal_run_time: {type: string, format: time, description: 'Location-local wall time HH:MM'}
        autopay_run_time: {type: string, format: time, description: 'Location-local wall time HH:MM'}
        decline_email_mode: {type: string, enum: [digest, per_decline]}
        time_clock_rounding: {type: string, enum: [none, up, down]}
        time_clock_rounding_min: {type: [integer, 'null']}
        accepted_card_brands:
          type: array
          items: {type: string}
        is_gdpr_mode: {type: boolean}
        sort_order: {type: integer}
        status: {type: string, enum: [active, inactive]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    LocationCreate:
      type: object
      description: Seeds seven facility_hours rows and a scheduling_settings row.
      required: [name, time_zone, country_code]
      properties:
        name: {type: string}
        public_name: {type: string}
        slug: {type: string}
        address_line1: {type: [string, 'null']}
        address_line2: {type: [string, 'null']}
        city: {type: [string, 'null']}
        region: {type: [string, 'null']}
        postal_code: {type: [string, 'null']}
        country_code: {type: string}
        phone: {type: [string, 'null']}
        email: {type: [string, 'null'], format: email}
        alert_email: {type: [string, 'null'], format: email}
        website_url: {type: [string, 'null']}
        time_zone: {type: string, description: IANA time zone}
        membership_renewal_run_time: {type: string, format: time, description: 'Location-local wall time HH:MM'}
        package_renewal_run_time: {type: string, format: time, description: 'Location-local wall time HH:MM'}
        autopay_run_time: {type: string, format: time, description: 'Location-local wall time HH:MM'}
        decline_email_mode: {type: string, enum: [digest, per_decline]}
        time_clock_rounding: {type: string, enum: [none, up, down]}
        time_clock_rounding_min: {type: [integer, 'null']}
        accepted_card_brands:
          type: array
          items: {type: string}
        is_gdpr_mode: {type: boolean}
        sort_order: {type: integer}
    LocationUpdate:
      type: object
      properties:
        name: {type: string}
        public_name: {type: string}
        slug: {type: string}
        address_line1: {type: [string, 'null']}
        address_line2: {type: [string, 'null']}
        city: {type: [string, 'null']}
        region: {type: [string, 'null']}
        postal_code: {type: [string, 'null']}
        country_code: {type: string}
        phone: {type: [string, 'null']}
        email: {type: [string, 'null'], format: email}
        alert_email: {type: [string, 'null'], format: email}
        website_url: {type: [string, 'null']}
        time_zone: {type: string, description: IANA time zone}
        membership_renewal_run_time: {type: string, format: time, description: 'Location-local wall time HH:MM'}
        package_renewal_run_time: {type: string, format: time, description: 'Location-local wall time HH:MM'}
        autopay_run_time: {type: string, format: time, description: 'Location-local wall time HH:MM'}
        decline_email_mode: {type: string, enum: [digest, per_decline]}
        time_clock_rounding: {type: string, enum: [none, up, down]}
        time_clock_rounding_min: {type: [integer, 'null']}
        accepted_card_brands:
          type: array
          items: {type: string}
        is_gdpr_mode: {type: boolean}
        sort_order: {type: integer}
    FacilityHoursDay:
      type: object
      description: '`closes_time` 24:00 allowed.'
      required: [weekday, is_closed]
      properties:
        weekday: {type: integer, minimum: 1, maximum: 7, description: 'ISO, 1 = Monday'}
        opens_time: {type: [string, 'null'], format: time, description: 'Location-local wall time HH:MM'}
        closes_time: {type: [string, 'null'], format: time, description: 'Location-local wall time HH:MM'}
        is_closed: {type: boolean}
    FacilityHours:
      type: object
      required: [location_id, days]
      properties:
        location_id: {type: string, format: uuid}
        days:
          type: array
          items: {$ref: '#/components/schemas/FacilityHoursDay'}
    FacilityHoursReplace:
      type: object
      required: [days]
      properties:
        days:
          type: array
          minItems: 7
          maxItems: 7
          items: {$ref: '#/components/schemas/FacilityHoursDay'}
    PublicLocation:
      type: object
      required: [id, slug, public_name, time_zone]
      properties:
        id: {type: string, format: uuid}
        slug: {type: string}
        public_name: {type: string}
        time_zone: {type: string, description: IANA time zone}
        city: {type: [string, 'null']}
        region: {type: [string, 'null']}
        phone: {type: [string, 'null']}
        email: {type: [string, 'null'], format: email}
        facility_hours:
          type: array
          items: {$ref: '#/components/schemas/FacilityHoursDay'}
        logo_url: {type: [string, 'null']}
    RoleRef:
      type: object
      required: [id, name]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        system_key: {type: [string, 'null']}
    StaffUser:
      type: object
      required: [id, email, first_name, last_name, role, is_active]
      properties:
        id: {type: string, format: uuid}
        identity_id: {type: string, format: uuid}
        email: {type: string, format: email}
        first_name: {type: string}
        last_name: {type: string}
        mobile_phone: {type: [string, 'null']}
        role: {$ref: '#/components/schemas/RoleRef'}
        identity_status: {type: string, enum: [invited, active, disabled, merged]}
        is_active: {type: boolean}
        has_all_location_access: {type: boolean}
        location_ids:
          type: array
          items: {type: string, format: uuid}
        primary_location_id: {type: [string, 'null'], format: uuid}
        linked_resource_id: {type: [string, 'null'], format: uuid}
        is_attendance_notified: {type: boolean}
        ip_policy: {type: string, enum: [any, facility_networks]}
        access_expires_on: {type: [string, 'null'], format: date}
        has_permission_overrides: {type: boolean}
        last_sign_in_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
    StaffUserInvite:
      type: object
      description: Creates identity (status invited) + staff_user and emails a 7-day invite link. No admin-typed password
        (PLT-03).
      required: [email, first_name, last_name, role_id]
      properties:
        email: {type: string, format: email}
        first_name: {type: string}
        last_name: {type: string}
        mobile_phone: {type: string}
        role_id: {type: string, format: uuid}
        has_all_location_access: {type: boolean}
        location_ids:
          type: array
          items: {type: string, format: uuid}
        primary_location_id: {type: string, format: uuid}
        linked_resource_id: {type: string, format: uuid}
        access_expires_on: {type: string, format: date}
    StaffUserUpdate:
      type: object
      properties:
        first_name: {type: string}
        last_name: {type: string}
        mobile_phone: {type: [string, 'null']}
        linked_resource_id: {type: [string, 'null'], format: uuid}
        is_attendance_notified: {type: boolean}
        ip_policy: {type: string, enum: [any, facility_networks]}
        access_expires_on: {type: [string, 'null'], format: date}
    StaffUserRoleAssign:
      type: object
      required: [role_id]
      properties:
        role_id: {type: string, format: uuid}
        reset_overrides: {type: boolean}
    StaffUserLocationsAssign:
      type: object
      required: [has_all_location_access]
      properties:
        has_all_location_access: {type: boolean}
        location_ids:
          type: array
          items: {type: string, format: uuid}
        primary_location_id: {type: [string, 'null'], format: uuid}
    PermissionGrant:
      type: object
      description: Null subject = default for every subject of the key (data-model-core 9.5).
      required: [permission_key, is_allowed]
      properties:
        permission_key: {type: string}
        is_allowed: {type: boolean}
        subject_type: {type: [string, 'null'], enum: [reservation_type, null]}
        subject_id: {type: [string, 'null'], format: uuid}
    PermissionGrantsReplace:
      type: object
      required: [grants]
      properties:
        grants:
          type: array
          items: {$ref: '#/components/schemas/PermissionGrant'}
    StaffUserPermissions:
      type: object
      required: [staff_user_id, role, effective, overrides, is_diverged_from_role]
      properties:
        staff_user_id: {type: string, format: uuid}
        role: {$ref: '#/components/schemas/RoleRef'}
        effective:
          type: array
          items: {$ref: '#/components/schemas/EffectivePermission'}
        overrides:
          type: array
          items: {$ref: '#/components/schemas/PermissionGrant'}
        is_diverged_from_role: {type: boolean}
    PermissionDefinition:
      type: object
      description: Static catalogue entry declared in code (PLT-04).
      required: [key, context, label, scope]
      properties:
        key: {type: string}
        context: {type: string}
        label: {type: string}
        scope: {type: string, enum: [tenant, location, client]}
        flags:
          type: array
          items: {type: string}
        accepts_own_reach: {type: boolean}
        subject_type: {type: [string, 'null']}
        entitlement: {type: [string, 'null']}
    Role:
      type: object
      description: '`permissions` only on the single-resource read.'
      required: [id, name, is_system]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        description: {type: [string, 'null']}
        is_system: {type: boolean}
        system_key: {type: [string, 'null']}
        cloned_from_role_id: {type: [string, 'null'], format: uuid}
        default_ip_policy: {type: string, enum: [any, facility_networks]}
        staff_user_count: {type: integer}
        permissions:
          type: array
          items: {$ref: '#/components/schemas/PermissionGrant'}
    RoleCreate:
      type: object
      description: Clone-on-create copies grants once; no live inheritance.
      required: [name]
      properties:
        name: {type: string}
        description: {type: string}
        clone_from_role_id: {type: string, format: uuid}
        default_ip_policy: {type: string, enum: [any, facility_networks]}
    RoleUpdate:
      type: object
      properties:
        name: {type: string}
        description: {type: [string, 'null']}
        default_ip_policy: {type: string, enum: [any, facility_networks]}
    ResourceGroup:
      type: object
      required: [id, location_id, name, is_active]
      properties:
        id: {type: string, format: uuid}
        location_id: {type: string, format: uuid}
        name: {type: string}
        sort_order: {type: integer}
        is_active: {type: boolean}
        resource_count: {type: integer}
    ResourceGroupWrite:
      type: object
      description: Create requires location_id and name; location_id is immutable afterwards.
      properties:
        location_id: {type: string, format: uuid}
        name: {type: string}
        sort_order: {type: integer}
        is_active: {type: boolean}
    Resource:
      type: object
      description: '`staff_user_id` is the staff user whose linked_resource_id points here (trainer as a resource).'
      required: [id, location_id, kind, name, status]
      properties:
        id: {type: string, format: uuid}
        location_id: {type: string, format: uuid}
        resource_group_id: {type: [string, 'null'], format: uuid}
        parent_id: {type: [string, 'null'], format: uuid}
        kind: {type: string, enum: [venue, trainer, virtual_room]}
        name: {type: string}
        public_name: {type: [string, 'null']}
        description: {type: [string, 'null']}
        sort_order: {type: integer}
        is_online_bookable: {type: boolean}
        counts_toward_plan: {type: boolean}
        status: {type: string, enum: [active, archived]}
        child_ids:
          type: array
          items: {type: string, format: uuid}
        linked_resource_ids:
          type: array
          items: {type: string, format: uuid}
        staff_user_id: {type: [string, 'null'], format: uuid}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ResourceCreate:
      type: object
      description: A child must share its parent location; adding a child back-fills holds from the parent future bookings
        in the same transaction.
      required: [location_id, kind, name]
      properties:
        location_id: {type: string, format: uuid}
        resource_group_id: {type: [string, 'null'], format: uuid}
        parent_id: {type: [string, 'null'], format: uuid}
        kind: {type: string, enum: [venue, trainer]}
        name: {type: string}
        public_name: {type: [string, 'null']}
        description: {type: [string, 'null']}
        sort_order: {type: integer}
        is_online_bookable: {type: boolean}
        counts_toward_plan: {type: boolean}
    ResourceUpdate:
      type: object
      description: '`kind` and location are immutable. Re-parenting re-derives descendant holds and can return booking-conflict.'
      properties:
        resource_group_id: {type: [string, 'null'], format: uuid}
        parent_id: {type: [string, 'null'], format: uuid}
        kind: {type: string, enum: [venue, trainer]}
        name: {type: string}
        public_name: {type: [string, 'null']}
        description: {type: [string, 'null']}
        sort_order: {type: integer}
        is_online_bookable: {type: boolean}
        counts_toward_plan: {type: boolean}
    ResourceLinksReplace:
      type: object
      description: Default companions booked together with this resource (RES-05). Links are directional rows; the service
        writes both directions.
      required: [linked_resource_ids]
      properties:
        linked_resource_ids:
          type: array
          items: {type: string, format: uuid}
    AvailabilityWindow:
      type: object
      required: [id, resource_id, starts_on, weekdays, start_time, end_time]
      properties:
        id: {type: string, format: uuid}
        location_id: {type: string, format: uuid}
        resource_id: {type: string, format: uuid}
        starts_on: {type: string, format: date}
        ends_on: {type: [string, 'null'], format: date}
        weekdays:
          type: array
          items: {type: integer, minimum: 1, maximum: 7}
        interval_weeks: {type: integer}
        start_time: {type: string, format: time, description: 'Location-local wall time HH:MM'}
        end_time: {type: string, format: time, description: 'Location-local wall time HH:MM'}
        note: {type: [string, 'null']}
        is_active: {type: boolean}
    AvailabilityWindowWrite:
      type: object
      description: Create requires starts_on, weekdays, start_time, end_time. A one-day window has ends_on = starts_on.
      properties:
        starts_on: {type: string, format: date}
        ends_on: {type: [string, 'null'], format: date}
        weekdays:
          type: array
          items: {type: integer, minimum: 1, maximum: 7}
        interval_weeks: {type: integer}
        start_time: {type: string, format: time, description: 'Location-local wall time HH:MM'}
        end_time: {type: string, format: time, description: 'Location-local wall time HH:MM'}
        note: {type: [string, 'null']}
        is_active: {type: boolean}
    SchedulingSettings:
      type: object
      description: location_id null = tenant default; readers resolve location, then tenant.
      properties:
        location_id: {type: [string, 'null'], format: uuid}
        default_buffer_before_min: {type: integer}
        default_buffer_after_min: {type: integer}
        drag_drop_default: {type: string, enum: [ask, reschedule, move_enrollment]}
        calendar_slot_min: {type: integer, enum: [5, 10, 15, 20, 30, 60]}
        checkout_hold_min: {type: integer}
        max_series_occurrences: {type: integer}
    ReservationType:
      type: object
      description: Defaults are copied onto sessions at creation and never re-applied. Listing mode, cut-offs and waitlist
        mode are programs.session_booking_policy; allowed packages are owned by packages.
      required: [id, location_id, name, is_active]
      properties:
        id: {type: string, format: uuid}
        location_id: {type: string, format: uuid}
        name: {type: string}
        is_schedulable: {type: boolean}
        is_sellable: {type: boolean}
        revenue_category_id: {type: [string, 'null'], format: uuid}
        reservation_category_id: {type: [string, 'null'], format: uuid}
        default_capacity: {type: integer}
        default_duration_min: {type: integer}
        default_allows_free_booking: {type: boolean}
        color: {type: [string, 'null'], pattern: '^#[0-9a-f]{6}$'}
        uses_default_buffer: {type: boolean}
        buffer_before_min: {type: integer}
        buffer_after_min: {type: integer}
        is_self_bookable_default: {type: boolean}
        sort_order: {type: integer}
        is_active: {type: boolean}
    ReservationTypeCreate:
      type: object
      required: [location_id, name]
      properties:
        location_id: {type: string, format: uuid}
        name: {type: string}
        is_schedulable: {type: boolean}
        is_sellable: {type: boolean}
        revenue_category_id: {type: [string, 'null'], format: uuid}
        reservation_category_id: {type: [string, 'null'], format: uuid}
        default_capacity: {type: integer}
        default_duration_min: {type: integer}
        default_allows_free_booking: {type: boolean}
        color: {type: [string, 'null'], pattern: '^#[0-9a-f]{6}$'}
        uses_default_buffer: {type: boolean}
        buffer_before_min: {type: integer}
        buffer_after_min: {type: integer}
        is_self_bookable_default: {type: boolean}
        sort_order: {type: integer}
        is_active: {type: boolean}
    ReservationTypeUpdate:
      type: object
      description: Archive with is_active = false; never deleted.
      properties:
        name: {type: string}
        is_schedulable: {type: boolean}
        is_sellable: {type: boolean}
        revenue_category_id: {type: [string, 'null'], format: uuid}
        reservation_category_id: {type: [string, 'null'], format: uuid}
        default_capacity: {type: integer}
        default_duration_min: {type: integer}
        default_allows_free_booking: {type: boolean}
        color: {type: [string, 'null'], pattern: '^#[0-9a-f]{6}$'}
        uses_default_buffer: {type: boolean}
        buffer_before_min: {type: integer}
        buffer_after_min: {type: integer}
        is_self_bookable_default: {type: boolean}
        sort_order: {type: integer}
        is_active: {type: boolean}
    RecurrenceRule:
      type: object
      description: One generation pass. An end by count or date is mandatory (SCH-09). First occurrence and wall times come
        from the enclosing command.
      required: [pattern, range_type]
      properties:
        pattern: {type: string, enum: [single, daily, weekly, monthly_by_date, monthly_by_weekday, yearly]}
        interval_count: {type: integer}
        weekdays:
          type: array
          items: {type: integer, minimum: 1, maximum: 7}
        month_week: {type: integer, description: 1..5 or -1 (last)}
        range_type: {type: string, enum: [count, until]}
        occurrence_limit: {type: integer}
        until_on: {type: string, format: date}
    BookingResourceInput:
      type: object
      required: [resource_id]
      properties:
        resource_id: {type: string, format: uuid}
        role: {type: string, enum: [primary, additional]}
    BookingResource:
      type: object
      required: [resource_id, role]
      properties:
        resource_id: {type: string, format: uuid}
        role: {type: string, enum: [primary, additional]}
        name: {type: string}
        kind: {type: string, enum: [venue, trainer, virtual_room]}
    SessionInput:
      type: object
      description: Omitted fields are copied from the reservation type.
      properties:
        capacity: {type: integer}
        is_self_bookable: {type: boolean}
        allows_free_booking: {type: boolean}
    Session:
      type: object
      required: [id, booking_id, capacity, booked_count, fill]
      properties:
        id: {type: string, format: uuid}
        booking_id: {type: string, format: uuid}
        location_id: {type: string, format: uuid}
        capacity: {type: integer}
        booked_count: {type: integer}
        fill: {type: string, enum: [empty, partial, full]}
        is_self_bookable: {type: boolean}
        allows_free_booking: {type: boolean}
        slot_offer_id: {type: [string, 'null'], format: uuid}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        reservation_type_id: {type: [string, 'null'], format: uuid}
        title: {type: string}
        resources:
          type: array
          items: {$ref: '#/components/schemas/BookingResource'}
    SessionUpdate:
      type: object
      properties:
        is_self_bookable: {type: boolean}
        allows_free_booking: {type: boolean}
    SessionCapacityChange:
      type: object
      description: Give session_ids, or booking_series_id with scope. 0 is valid. Capacity can never drop below booked_count.
      required: [capacity]
      properties:
        session_ids:
          type: array
          items: {type: string, format: uuid}
        booking_series_id: {type: string, format: uuid}
        scope: {$ref: '#/components/schemas/SeriesScope'}
        capacity: {type: integer}
        preview: {type: boolean}
    SessionCapacityResult:
      type: object
      required: [updated_count, results]
      properties:
        updated_count: {type: integer}
        results:
          type: array
          items:
            type: object
            properties:
              session_id: {type: string, format: uuid}
              status: {type: string, enum: [updated, capacity-below-booked]}
              booked_count: {type: integer}
    Booking:
      type: object
      required: [id, location_id, booking_number, kind, starts_at, ends_at, status, resources, version]
      properties:
        id: {type: string, format: uuid}
        location_id: {type: string, format: uuid}
        booking_number: {type: integer}
        kind: {type: string, enum: [session, rental, block, game]}
        block_kind: {type: [string, 'null'], enum: [floor_shift, instruction, unpaid, unavailable, null]}
        reservation_type_id: {type: [string, 'null'], format: uuid}
        client_id: {type: [string, 'null'], format: uuid}
        title: {type: [string, 'null']}
        public_title: {type: [string, 'null']}
        notes: {type: [string, 'null']}
        buffer_before_min: {type: integer}
        buffer_after_min: {type: integer}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        status: {type: string, enum: [tentative, confirmed, cancelled]}
        expires_at: {type: [string, 'null'], format: date-time}
        cancelled_at: {type: [string, 'null'], format: date-time}
        cancel_reason:
          type: [string, 'null']
          enum: [staff, client, hold_expired, payment_failed, series_edit, other, null]
        created_via: {type: string, enum: [staff, portal, mobile, api, system]}
        booking_series_id: {type: [string, 'null'], format: uuid}
        booking_series_rule_id: {type: [string, 'null'], format: uuid}
        source_context: {type: [string, 'null']}
        source_type: {type: [string, 'null']}
        source_id: {type: [string, 'null'], format: uuid}
        resources:
          type: array
          items: {$ref: '#/components/schemas/BookingResource'}
        session:
          oneOf:
          - {$ref: '#/components/schemas/Session'}
          - {type: 'null'}
        version: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    BookingCreate:
      type: object
      description: 'Staff create of a session or time block, single or recurring. Rentals are created through /rentals, games
        through leagues, enrolments through programs: each owner calls scheduling.service. Buffers default from the type.
        `override_policy` (outside hours, blackout scope online_only) needs scheduling.booking.override_policy; double booking
        is never overridable.'
      required: [location_id, kind, starts_at, ends_at, resources]
      properties:
        location_id: {type: string, format: uuid}
        kind: {type: string, enum: [session, block]}
        block_kind: {type: string, enum: [floor_shift, instruction, unpaid, unavailable]}
        reservation_type_id: {type: [string, 'null'], format: uuid}
        title: {type: [string, 'null']}
        public_title: {type: [string, 'null']}
        notes: {type: [string, 'null']}
        buffer_before_min: {type: integer}
        buffer_after_min: {type: integer}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        resources:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/BookingResourceInput'}
        include_linked_resources: {type: boolean}
        session: {$ref: '#/components/schemas/SessionInput'}
        recurrence: {$ref: '#/components/schemas/RecurrenceRule'}
        series_label: {type: string}
        on_conflict: {type: string, enum: [skip, abort]}
        override_policy: {type: boolean}
    BookingUpdate:
      type: object
      description: Sparse patch of non-time fields. Buffer changes rewrite holds and may conflict.
      required: [version]
      properties:
        title: {type: [string, 'null']}
        public_title: {type: [string, 'null']}
        notes: {type: [string, 'null']}
        buffer_before_min: {type: integer}
        buffer_after_min: {type: integer}
        reservation_type_id: {type: [string, 'null'], format: uuid}
        block_kind: {type: string, enum: [floor_shift, instruction, unpaid, unavailable]}
        version: {type: integer}
    BookingReschedule:
      type: object
      description: Drag-and-drop and form time changes. Omit `resources` to keep them. Holds are updated in place under the
        exclusion constraint.
      required: [starts_at, ends_at, version]
      properties:
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        resources:
          type: array
          items: {$ref: '#/components/schemas/BookingResourceInput'}
        version: {type: integer}
        enrollment_action: {type: string, enum: [ask, reschedule, move_enrollment]}
        override_policy: {type: boolean}
    SeriesScope:
      type: object
      description: Covers the reference scopes (just this one, all, today, past, future, custom) and tick-box mass edit (SCH-10,
        SCH-11). `anchor_booking_id` for this|following; `booking_ids` for selected; local dates for date_range.
      required: [mode]
      properties:
        mode: {type: string, enum: [this, following, all, selected, date_range]}
        anchor_booking_id: {type: string, format: uuid}
        booking_ids:
          type: array
          items: {type: string, format: uuid}
        from_on: {type: string, format: date}
        to_on: {type: string, format: date}
    BookingCancel:
      type: object
      required: [version]
      properties:
        reason: {type: string, enum: [staff, client, other]}
        note: {type: string}
        version: {type: integer}
    BookingSeries:
      type: object
      required: [id, kind, occurrence_count]
      properties:
        id: {type: string, format: uuid}
        location_id: {type: string, format: uuid}
        kind: {type: string, enum: [session, rental, block, game]}
        label: {type: [string, 'null']}
        occurrence_count: {type: integer}
        rules:
          type: array
          items: {$ref: '#/components/schemas/BookingSeriesRule'}
    BookingSeriesRule:
      type: object
      description: Doubles as the job status resource for fan-out above 50 occurrences. `results` lists conflicts only.
      required: [id, sequence, status]
      properties:
        id: {type: string, format: uuid}
        sequence: {type: integer}
        rule: {$ref: '#/components/schemas/RecurrenceRule'}
        start_on: {type: string, format: date}
        start_time: {type: string, format: time, description: 'Location-local wall time HH:MM'}
        end_time: {type: string, format: time, description: 'Location-local wall time HH:MM'}
        end_day_offset: {type: integer}
        status: {type: string, enum: [pending, generating, completed, failed]}
        requested_count: {type: integer}
        created_count: {type: integer}
        conflict_count: {type: integer}
        results:
          type: array
          items: {$ref: '#/components/schemas/OccurrenceResult'}
        started_at: {type: [string, 'null'], format: date-time}
        finished_at: {type: [string, 'null'], format: date-time}
    OccurrenceResult:
      type: object
      required: [index, status]
      properties:
        index: {type: integer}
        local_start: {type: string}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        status:
          type: string
          enum: [ok, conflict, blackout, outside_hours, skipped_by_rule, capacity-below-booked]
        booking_id: {type: [string, 'null'], format: uuid}
        conflicts:
          type: array
          items: {$ref: '#/components/schemas/HoldConflict'}
    SeriesPreview:
      type: object
      description: Result of running the real command in a rolled-back transaction. Above 50 occurrences the preview is a
        job and `status_url` is set.
      required: [requested_count, ok_count, conflict_count, occurrences]
      properties:
        requested_count: {type: integer}
        ok_count: {type: integer}
        conflict_count: {type: integer}
        occurrences:
          type: array
          items: {$ref: '#/components/schemas/OccurrenceResult'}
        status_url: {type: [string, 'null']}
    SeriesRuleAdd:
      type: object
      description: Stacks another pass onto an existing series (add occurrences).
      required: [start_on, start_time, end_time, rule]
      properties:
        start_on: {type: string, format: date}
        start_time: {type: string, format: time, description: 'Location-local wall time HH:MM'}
        end_time: {type: string, format: time, description: 'Location-local wall time HH:MM'}
        end_day_offset: {type: integer}
        rule: {$ref: '#/components/schemas/RecurrenceRule'}
        resources:
          type: array
          items: {$ref: '#/components/schemas/BookingResourceInput'}
        on_conflict: {type: string, enum: [skip, abort]}
        preview: {type: boolean}
    SeriesEdit:
      type: object
      required: [scope, patch]
      properties:
        scope: {$ref: '#/components/schemas/SeriesScope'}
        patch:
          type: object
          description: Only supplied fields change. Times are local wall time so they survive DST.
          properties:
            title: {type: [string, 'null']}
            public_title: {type: [string, 'null']}
            notes: {type: [string, 'null']}
            buffer_before_min: {type: integer}
            buffer_after_min: {type: integer}
            reservation_type_id: {type: [string, 'null'], format: uuid}
            start_time: {type: string, format: time, description: 'Location-local wall time HH:MM'}
            duration_min: {type: integer}
            shift_days: {type: integer}
            resources:
              type: array
              items: {$ref: '#/components/schemas/BookingResourceInput'}
            session: {$ref: '#/components/schemas/SessionInput'}
        on_conflict: {type: string, enum: [skip, abort]}
        preview: {type: boolean}
    SeriesCancel:
      type: object
      required: [scope]
      properties:
        scope: {$ref: '#/components/schemas/SeriesScope'}
        reason: {type: string, enum: [staff, client, other]}
        note: {type: string}
        preview: {type: boolean}
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [ok, degraded, unavailable]}
        checks:
          type: object
          additionalProperties: {type: string, enum: [ok, failed]}
          description: 'readiness only: postgres, redis, migrations, outbox_relay'
    BookingSeriesRun:
      type: object
      description: One asynchronous series command (table booking_series_run).
      required: [id, booking_series_id, kind, status, requested_count, ok_count, conflict_count]
      properties:
        id: {type: string, format: uuid}
        booking_series_id: {type: string, format: uuid}
        booking_series_rule_id: {type: [string, 'null'], format: uuid}
        kind: {type: string, enum: [generate, edit, cancel, preview]}
        status: {type: string, enum: [pending, running, completed, failed]}
        requested_count: {type: integer}
        ok_count: {type: integer}
        conflict_count: {type: integer}
        results:
          type: array
          description: Non-ok occurrences only, unless kind = preview.
          items: {$ref: '#/components/schemas/OccurrenceResult'}
        started_at: {type: [string, 'null'], format: date-time}
        finished_at: {type: [string, 'null'], format: date-time}
    SeriesCommandResult:
      type: object
      required: [booking_series_id, affected_count, conflict_count]
      properties:
        booking_series_id: {type: string, format: uuid}
        affected_count: {type: integer}
        conflict_count: {type: integer}
        results:
          type: array
          items: {$ref: '#/components/schemas/OccurrenceResult'}
    BookingCreated:
      type: object
      description: '`booking` is the first occurrence. `results` lists skipped occurrences when on_conflict = skip.'
      required: [booking, created_count, conflict_count]
      properties:
        booking: {$ref: '#/components/schemas/Booking'}
        booking_series_id: {type: [string, 'null'], format: uuid}
        created_count: {type: integer}
        conflict_count: {type: integer}
        results:
          type: array
          items: {$ref: '#/components/schemas/OccurrenceResult'}
    CalendarEntry:
      type: object
      description: One tile per (booking, resource column). `descendant` tiles are the greyed "held" rendering on sub-venues.
        `is_unpaid` is joined from billing; `can_edit` reflects own-reach and subject grants.
      required: [booking_id, kind, title, starts_at, ends_at, resource_id, resource_role, version]
      properties:
        booking_id: {type: string, format: uuid}
        kind: {type: string, enum: [session, rental, block, game]}
        block_kind: {type: [string, 'null']}
        title: {type: string}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        buffer_before_min: {type: integer}
        buffer_after_min: {type: integer}
        status: {type: string, enum: [tentative, confirmed]}
        resource_id: {type: string, format: uuid}
        resource_role: {type: string, enum: [primary, additional, descendant]}
        color: {type: [string, 'null'], pattern: '^#[0-9a-f]{6}$'}
        reservation_type_id: {type: [string, 'null'], format: uuid}
        rental_type_id: {type: [string, 'null'], format: uuid}
        client_id: {type: [string, 'null'], format: uuid}
        client_name: {type: [string, 'null']}
        booking_series_id: {type: [string, 'null'], format: uuid}
        capacity: {type: [integer, 'null']}
        booked_count: {type: [integer, 'null']}
        fill: {type: [string, 'null'], enum: [empty, partial, full, null]}
        is_unpaid: {type: [boolean, 'null']}
        version: {type: integer}
        can_edit: {type: boolean}
    CalendarView:
      type: object
      required: [location_id, time_zone, from, to, resources, entries]
      properties:
        location_id: {type: string, format: uuid}
        time_zone: {type: string, description: IANA time zone}
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        calendar_slot_min: {type: integer}
        facility_hours:
          type: array
          items: {$ref: '#/components/schemas/FacilityHoursDay'}
        resources:
          type: array
          items: {$ref: '#/components/schemas/Resource'}
        entries:
          type: array
          items: {$ref: '#/components/schemas/CalendarEntry'}
        blackouts:
          type: array
          items: {$ref: '#/components/schemas/Blackout'}
    Blackout:
      type: object
      required: [id, location_id, name, starts_at, ends_at, scope]
      properties:
        id: {type: string, format: uuid}
        location_id: {type: string, format: uuid}
        name: {type: string}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        scope: {type: string, enum: [all, online_only]}
        note: {type: [string, 'null']}
    BlackoutWrite:
      type: object
      description: Create requires location_id, name, starts_at, ends_at. Existing bookings inside the range are returned
        as warnings, not cancelled.
      properties:
        location_id: {type: string, format: uuid}
        name: {type: string}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        scope: {type: string, enum: [all, online_only]}
        note: {type: [string, 'null']}
    SlotOffer:
      type: object
      description: An availability window split into bookable slots; a session row is materialised only when a slot gets its
        first seat.
      required: [id, availability_window_id, reservation_type_id, slot_min, capacity]
      properties:
        id: {type: string, format: uuid}
        location_id: {type: string, format: uuid}
        availability_window_id: {type: string, format: uuid}
        resource_id: {type: string, format: uuid}
        reservation_type_id: {type: string, format: uuid}
        slot_min: {type: integer}
        capacity: {type: integer}
        title: {type: string}
        public_title: {type: [string, 'null']}
        is_self_bookable: {type: boolean}
        allows_free_booking: {type: boolean}
        additional_resource_ids:
          type: array
          items: {type: string, format: uuid}
        is_active: {type: boolean}
    SlotOfferCreate:
      type: object
      required: [availability_window_id, reservation_type_id, slot_min]
      properties:
        availability_window_id: {type: string, format: uuid}
        reservation_type_id: {type: string, format: uuid}
        slot_min: {type: integer}
        capacity: {type: integer}
        title: {type: string}
        public_title: {type: [string, 'null']}
        is_self_bookable: {type: boolean}
        allows_free_booking: {type: boolean}
        additional_resource_ids:
          type: array
          items: {type: string, format: uuid}
        is_active: {type: boolean}
    SlotOfferUpdate:
      type: object
      properties:
        reservation_type_id: {type: string, format: uuid}
        slot_min: {type: integer}
        capacity: {type: integer}
        title: {type: string}
        public_title: {type: [string, 'null']}
        is_self_bookable: {type: boolean}
        allows_free_booking: {type: boolean}
        additional_resource_ids:
          type: array
          items: {type: string, format: uuid}
        is_active: {type: boolean}
    ResourceAvailability:
      type: object
      description: '`busy` includes buffers and holds inherited from parents and links.'
      required: [resource_id, busy, free]
      properties:
        resource_id: {type: string, format: uuid}
        open:
          type: array
          items: {$ref: '#/components/schemas/TimeRange'}
        busy:
          type: array
          items: {$ref: '#/components/schemas/TimeRange'}
        free:
          type: array
          items: {$ref: '#/components/schemas/TimeRange'}
    TimeRange:
      type: object
      required: [starts_at, ends_at]
      properties:
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        booking_id: {type: [string, 'null'], format: uuid}
    RentalType:
      type: object
      description: '`resource_ids` is the self-service allow-list (RNT-05).'
      required: [id, location_id, name, access, is_active]
      properties:
        id: {type: string, format: uuid}
        location_id: {type: string, format: uuid}
        name: {type: string}
        revenue_category_id: {type: string, format: uuid}
        color: {type: [string, 'null'], pattern: '^#[0-9a-f]{6}$'}
        sort_order: {type: integer}
        buffer_before_min: {type: integer}
        buffer_after_min: {type: integer}
        access: {type: string, enum: [staff_only, self_service]}
        online_rental_rate_id: {type: [string, 'null'], format: uuid}
        eligibility: {type: string, enum: [everyone, active_members, paid_up_members]}
        online_payment_mode: {type: string, enum: [pay_in_full, pay_later]}
        min_lead_min: {type: integer}
        default_length_min: {type: integer}
        min_length_min: {type: integer}
        max_length_min: {type: [integer, 'null']}
        slot_granularity_min: {type: integer, enum: [15, 30, 60]}
        online_description: {type: [string, 'null']}
        is_active: {type: boolean}
        resource_ids:
          type: array
          items: {type: string, format: uuid}
        rental_plan_ids:
          type: array
          items: {type: string, format: uuid}
    RentalTypeCreate:
      type: object
      required: [location_id, name, revenue_category_id]
      properties:
        location_id: {type: string, format: uuid}
        name: {type: string}
        revenue_category_id: {type: string, format: uuid}
        color: {type: [string, 'null'], pattern: '^#[0-9a-f]{6}$'}
        sort_order: {type: integer}
        buffer_before_min: {type: integer}
        buffer_after_min: {type: integer}
        access: {type: string, enum: [staff_only, self_service]}
        online_rental_rate_id: {type: [string, 'null'], format: uuid}
        eligibility: {type: string, enum: [everyone, active_members, paid_up_members]}
        online_payment_mode: {type: string, enum: [pay_in_full, pay_later]}
        min_lead_min: {type: integer}
        default_length_min: {type: integer}
        min_length_min: {type: integer}
        max_length_min: {type: [integer, 'null']}
        slot_granularity_min: {type: integer, enum: [15, 30, 60]}
        online_description: {type: [string, 'null']}
        is_active: {type: boolean}
        resource_ids:
          type: array
          items: {type: string, format: uuid}
    RentalTypeUpdate:
      type: object
      description: '`access = self_service` requires online_rental_rate_id and at least one resource (422).'
      properties:
        name: {type: string}
        revenue_category_id: {type: string, format: uuid}
        color: {type: [string, 'null'], pattern: '^#[0-9a-f]{6}$'}
        sort_order: {type: integer}
        buffer_before_min: {type: integer}
        buffer_after_min: {type: integer}
        access: {type: string, enum: [staff_only, self_service]}
        online_rental_rate_id: {type: [string, 'null'], format: uuid}
        eligibility: {type: string, enum: [everyone, active_members, paid_up_members]}
        online_payment_mode: {type: string, enum: [pay_in_full, pay_later]}
        min_lead_min: {type: integer}
        default_length_min: {type: integer}
        min_length_min: {type: integer}
        max_length_min: {type: [integer, 'null']}
        slot_granularity_min: {type: integer, enum: [15, 30, 60]}
        online_description: {type: [string, 'null']}
        is_active: {type: boolean}
        resource_ids:
          type: array
          items: {type: string, format: uuid}
    RentalRateRule:
      type: object
      description: First matching rule in sort_order wins. A rate rule replaces the unit price; a discount rule shows an explicit
        discount.
      required: [kind]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [rate, discount]}
        name: {type: [string, 'null']}
        sort_order: {type: integer}
        start_time: {type: [string, 'null'], format: time, description: 'Location-local wall time HH:MM'}
        end_time: {type: [string, 'null'], format: time, description: 'Location-local wall time HH:MM'}
        starts_on: {type: [string, 'null'], format: date}
        ends_on: {type: [string, 'null'], format: date}
        weekdays:
          type: [array, 'null']
          items: {type: integer, minimum: 1, maximum: 7}
        membership_type_id: {type: [string, 'null'], format: uuid}
        amount_minor: {type: [integer, 'null'], description: Minor units of tenant.currency}
        discount_pct: {type: [number, 'null']}
        discount_minor: {type: [integer, 'null'], description: Minor units of tenant.currency}
    RentalRate:
      type: object
      required: [id, rental_type_id, name, amount_minor, basis]
      properties:
        id: {type: string, format: uuid}
        rental_type_id: {type: string, format: uuid}
        name: {type: string}
        internal_note: {type: [string, 'null']}
        amount_minor: {type: integer, description: Minor units of tenant.currency}
        member_amount_minor: {type: [integer, 'null'], description: Minor units of tenant.currency}
        basis: {type: string, enum: [per_hour, per_occurrence, flat]}
        multi_resource_mode: {type: string, enum: [once, per_resource]}
        line_grouping: {type: string, enum: [combined, per_resource, per_occurrence, per_resource_occurrence]}
        tax_rate_ids:
          type: array
          items: {type: string, format: uuid}
        rules:
          type: array
          items: {$ref: '#/components/schemas/RentalRateRule'}
        sort_order: {type: integer}
        is_active: {type: boolean}
    RentalRateWrite:
      type: object
      description: Create requires name, amount_minor, basis. `rules` and `tax_rate_ids` are replaced as whole sets.
      properties:
        name: {type: string}
        internal_note: {type: [string, 'null']}
        amount_minor: {type: integer, description: Minor units of tenant.currency}
        member_amount_minor: {type: [integer, 'null'], description: Minor units of tenant.currency}
        basis: {type: string, enum: [per_hour, per_occurrence, flat]}
        multi_resource_mode: {type: string, enum: [once, per_resource]}
        line_grouping: {type: string, enum: [combined, per_resource, per_occurrence, per_resource_occurrence]}
        tax_rate_ids:
          type: array
          items: {type: string, format: uuid}
        rules:
          type: array
          items: {$ref: '#/components/schemas/RentalRateRule'}
        sort_order: {type: integer}
        is_active: {type: boolean}
    RentalCustomRate:
      type: object
      description: Needs rentals.booking.override_rate.
      required: [description, unit_amount_minor, basis]
      properties:
        description: {type: string}
        unit_amount_minor: {type: integer, description: Minor units of tenant.currency}
        basis: {type: string, enum: [per_hour, per_occurrence, flat]}
        tax_rate_ids:
          type: array
          items: {type: string, format: uuid}
    RentalChargeDecision:
      type: object
      description: bill needs rental_rate_id or custom_rate; plan needs rental_plan_purchase_id (P1, RNT-09). Maps to rental_booking.charge_state.
      required: [decision]
      properties:
        decision: {type: string, enum: [bill, unbilled, no_charge, plan]}
        rental_rate_id: {type: string, format: uuid}
        custom_rate: {$ref: '#/components/schemas/RentalCustomRate'}
        discount_minor: {type: integer, description: Minor units of tenant.currency}
        rental_plan_purchase_id: {type: string, format: uuid}
        invoice_routing: {type: string, enum: [new_single, new_per_line, date_based, existing_open, cart]}
        routing_period: {type: string, enum: [week, month]}
        existing_invoice_id: {type: string, format: uuid}
        revenue_on: {type: string, format: date}
    RentalPartyInput:
      type: object
      required: [client_id]
      properties:
        client_id: {type: string, format: uuid}
        is_charged: {type: boolean}
    RentalCreate:
      type: object
      description: Staff rental, single or recurring, one or many resources (RNT-03). Bookings and holds are written through
        scheduling.service; priced lines are handed to billing in the same transaction.
      required: [location_id, rental_type_id, client_id, resources, starts_at, ends_at, charge]
      properties:
        location_id: {type: string, format: uuid}
        rental_type_id: {type: string, format: uuid}
        client_id: {type: string, format: uuid}
        parties:
          type: array
          items: {$ref: '#/components/schemas/RentalPartyInput'}
        resources:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/BookingResourceInput'}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        title: {type: string}
        notes: {type: string}
        buffer_before_min: {type: integer}
        buffer_after_min: {type: integer}
        recurrence: {$ref: '#/components/schemas/RecurrenceRule'}
        charge: {$ref: '#/components/schemas/RentalChargeDecision'}
        on_conflict: {type: string, enum: [skip, abort]}
        override_policy: {type: boolean}
    RentalQuoteLine:
      type: object
      required: [description, basis, quantity, unit_amount_minor, amount_minor]
      properties:
        description: {type: string}
        rental_rate_id: {type: [string, 'null'], format: uuid}
        basis: {type: string, enum: [per_hour, per_occurrence, flat]}
        quantity: {type: number}
        unit_amount_minor: {type: integer, description: Minor units of tenant.currency}
        discount_minor: {type: integer, description: Minor units of tenant.currency}
        amount_minor: {type: integer, description: Minor units of tenant.currency}
        tax_minor: {type: integer, description: Minor units of tenant.currency}
        resource_id: {type: [string, 'null'], format: uuid}
        occurrence_index: {type: [integer, 'null']}
        applied_rule_id: {type: [string, 'null'], format: uuid}
        is_member_price: {type: boolean}
    RentalQuote:
      type: object
      description: Output of the deterministic pricing function; identical inputs give identical lines (RNT-02).
      required: [lines, subtotal_minor, tax_minor, total_minor, currency]
      properties:
        lines:
          type: array
          items: {$ref: '#/components/schemas/RentalQuoteLine'}
        subtotal_minor: {type: integer, description: Minor units of tenant.currency}
        discount_minor: {type: integer, description: Minor units of tenant.currency}
        tax_minor: {type: integer, description: Minor units of tenant.currency}
        total_minor: {type: integer, description: Minor units of tenant.currency}
        currency: {type: string}
    RentalPreview:
      type: object
      description: Conflict probe plus price in one call; nothing is written.
      required: [occurrences, requested_count, conflict_count, quote]
      properties:
        occurrences:
          type: array
          items: {$ref: '#/components/schemas/OccurrenceResult'}
        requested_count: {type: integer}
        conflict_count: {type: integer}
        quote: {$ref: '#/components/schemas/RentalQuote'}
    Rental:
      type: object
      description: One rental occurrence (rental_booking 1:1 booking). `status`, times and `version` are read from the booking.
      required: [id, booking_id, rental_type_id, client_id, starts_at, ends_at, status, charge_state]
      properties:
        id: {type: string, format: uuid}
        location_id: {type: string, format: uuid}
        booking_id: {type: string, format: uuid}
        booking_number: {type: integer}
        booking_series_id: {type: [string, 'null'], format: uuid}
        rental_type_id: {type: string, format: uuid}
        client_id: {type: string, format: uuid}
        parties:
          type: array
          items: {$ref: '#/components/schemas/RentalPartyInput'}
        resources:
          type: array
          items: {$ref: '#/components/schemas/BookingResource'}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        status: {type: string, enum: [tentative, confirmed, cancelled]}
        expires_at: {type: [string, 'null'], format: date-time}
        charge_state: {type: string, enum: [unbilled, no_charge, billed, plan_covered]}
        booked_via: {type: string, enum: [staff, portal, mobile, api]}
        cancelled_at: {type: [string, 'null'], format: date-time}
        amount_minor: {type: [integer, 'null'], description: Minor units of tenant.currency}
        charge_ids:
          type: array
          items: {type: string, format: uuid}
        invoice_ids:
          type: array
          items: {type: string, format: uuid}
        is_on_public_schedule: {type: boolean}
        version: {type: integer}
    RentalCreated:
      type: object
      required: [rental, created_count, conflict_count]
      properties:
        rental: {$ref: '#/components/schemas/Rental'}
        booking_series_id: {type: [string, 'null'], format: uuid}
        created_count: {type: integer}
        conflict_count: {type: integer}
        results:
          type: array
          items: {$ref: '#/components/schemas/OccurrenceResult'}
        quote: {$ref: '#/components/schemas/RentalQuote'}
        invoice_ids:
          type: array
          items: {type: string, format: uuid}
    RentalCancel:
      type: object
      description: 'Unpaid charge shares are always reversed; `charge_action` decides paid money: account credit (default),
        refund to the original method (also needs the billing refund permission), or keep. Plan-covered occurrences always
        get the balance back (RNT-08, RNT-09).'
      required: [scope, charge_action]
      properties:
        scope: {$ref: '#/components/schemas/SeriesScope'}
        reason: {type: string, enum: [staff, client, other]}
        note: {type: string}
        charge_action: {type: string, enum: [credit_account, refund, keep_charge]}
        version: {type: integer}
        preview: {type: boolean}
    RentalCancelResult:
      type: object
      required: [cancelled_count]
      properties:
        cancelled_count: {type: integer}
        reversed_minor: {type: integer, description: Minor units of tenant.currency}
        credited_minor: {type: integer, description: Minor units of tenant.currency}
        refunded_minor: {type: integer, description: Minor units of tenant.currency}
        plan_quantity_returned: {type: number}
        rentals:
          type: array
          items: {$ref: '#/components/schemas/Rental'}
    RentalSlot:
      type: object
      required: [starts_at, ends_at, resource_id, price_minor]
      properties:
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        resource_id: {type: string, format: uuid}
        resource_name: {type: string}
        price_minor: {type: integer, description: Minor units of tenant.currency}
        is_member_price: {type: boolean}
    PublicRentalType:
      type: object
      required: [id, location_id, name, slot_granularity_min]
      properties:
        id: {type: string, format: uuid}
        location_id: {type: string, format: uuid}
        name: {type: string}
        online_description: {type: [string, 'null']}
        eligibility: {type: string, enum: [everyone, active_members, paid_up_members]}
        online_payment_mode: {type: string, enum: [pay_in_full, pay_later]}
        min_lead_min: {type: integer}
        default_length_min: {type: integer}
        min_length_min: {type: integer}
        max_length_min: {type: [integer, 'null']}
        slot_granularity_min: {type: integer}
        resources:
          type: array
          items: {$ref: '#/components/schemas/BookingResource'}
        from_price_minor: {type: integer, description: Minor units of tenant.currency}
    PortalRentalCreate:
      type: object
      additionalProperties: false
      description: '`client_id` is self or a client the identity can act for. Rate is the type online rate; the client never
        picks a price.'
      required: [rental_type_id, client_id, resource_id, starts_at, ends_at]
      properties:
        rental_type_id: {type: string, format: uuid}
        client_id: {type: string, format: uuid}
        resource_id: {type: string, format: uuid}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        rental_plan_purchase_id:
          type: string
          format: uuid
          description: must satisfy can_use_entitlement(client_id, plan purchase) (ADR 0009 section 8.3), else 403
    RentalCheckout:
      type: object
      description: 'pay_in_full: tentative booking with real holds and `expires_at` (checkout clock, default 10 minutes).
        pay_later, zero price or plan-covered: confirmed at once, `expires_at` null.'
      required: [rental, quote, payment_required]
      properties:
        rental: {$ref: '#/components/schemas/Rental'}
        quote: {$ref: '#/components/schemas/RentalQuote'}
        expires_at: {type: [string, 'null'], format: date-time}
        invoice_id: {type: [string, 'null'], format: uuid}
        payment_required: {type: boolean}
    PortalRentalConfirm:
      type: object
      additionalProperties: false
      description: One of payment_method_id (stored) or provider_payment_token (PaymentProvider client token; never raw card
        data).
      properties:
        payment_method_id:
          type: string
          format: uuid
          description: must be a stored method of the identity's own client (never the renter's if that is a dependent or
            related client); else 403
        provider_payment_token: {type: string}
        save_payment_method: {type: boolean, description: saves to the identity's own client}
