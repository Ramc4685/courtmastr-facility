        renews_as_catalog_item_id: {type: [string, 'null'], format: uuid}
        revenue_category_id: {type: string, format: uuid}
        is_active: {type: boolean}
    CatalogItemWrite:
      type: object
      properties:
        location_id: {type: string, format: uuid}
        kind: {type: string, enum: [one_off, recurring]}
        description: {type: string}
        additional_description: {type: [string, 'null']}
        internal_remarks: {type: [string, 'null']}
        start_mode: {type: string, enum: [sale_date, fixed_date]}
        starts_on: {type: [string, 'null'], format: date}
        length_count: {type: [integer, 'null']}
        length_unit: {type: [string, 'null'], enum: [day, week, month, year, null]}
        recurrence_unit: {type: [string, 'null'], enum: [day, week, month, year, null]}
        recurrence_every: {type: [integer, 'null']}
        recurrence_count: {type: [integer, 'null']}
        fee_minor: {type: integer, format: int64}
        discount_pct: {type: [string, 'null'], format: decimal}
        discount_minor: {type: [integer, 'null'], format: int64}
        invoice_option: {type: string, enum: [single_invoice, invoice_per_occurrence, leave_uninvoiced]}
        is_autopay: {type: boolean}
        is_auto_renew: {type: boolean}
        renew_lead_days: {type: integer}
        renews_as_catalog_item_id: {type: [string, 'null'], format: uuid}
        revenue_category_id: {type: string, format: uuid}
        is_active: {type: boolean}
    CatalogItemSale:
