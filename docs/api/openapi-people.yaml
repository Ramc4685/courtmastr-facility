        discount_minor:
          type: [integer, 'null']
          format: int64
          description: Minor units, tenant currency
        revenue_category_id:
          type: [string, 'null']
          format: uuid
        sort_order: {type: integer}
        is_active: {type: boolean}
      required: [reservation_type_id, name, session_mode]
    PackageSettings:
      type: object
      description: package_settings row.
      properties:
        is_late_cancel_charged: {type: boolean}
        is_no_show_charged: {type: boolean}
        is_account_credit_applied_by_default: {type: boolean}
        expiry_notice_days: {type: integer}
    ClientPackage:
      type: object
      description: 'client_package row: snapshot of terms plus cached balance (PKG-14).'
      properties:
        id: {type: string, format: uuid}
        version: {type: integer}
        owner_client_id: {type: string, format: uuid}
        location_id: {type: string, format: uuid}
        package_plan_id:
          type: [string, 'null']
          format: uuid
        package_series_id:
          type: [string, 'null']
          format: uuid
        reservation_type_id: {type: string, format: uuid}
        name: {type: string}
        status:
          type: string
          enum: [active, exhausted, expired, removed]
        is_unlimited: {type: boolean}
        sessions_granted_count: {type: integer}
        sessions_reserved_count: {type: integer}
        sessions_consumed_count: {type: integer}
        sessions_forfeited_count: {type: integer}
        sessions_available_count:
          type: [integer, 'null']
          description: Computed; null when unlimited
        valid_during:
          type: array
          prefixItems:
          - type: [string, 'null']
            format: date
          - type: [string, 'null']
            format: date
          minItems: 2
          maxItems: 2
          description: Half-open [start, end); null end = unbounded
        allows_booking_after_expiry: {type: boolean}
        price_minor:
          type: integer
          format: int64
          description: Minor units, tenant currency
        unit_price_minor:
          type: [integer, 'null']
          format: int64
          description: Minor units, tenant currency
        is_complimentary: {type: boolean}
        invoice_mode:
          type: string
          enum: [single, deferred, none]
        charge_id:
          type: [string, 'null']
          format: uuid
        share_mode:
          type: string
          enum: [none, all_related, explicit]
        is_auto_renew: {type: boolean}
        renew_on:
          type: [string, 'null']
          format: date
        renewal_flagged_at:
          type: [string, 'null']
          format: date-time
        previous_package_id:
          type: [string, 'null']
          format: uuid
        source_contract_id:
          type: [string, 'null']
          format: uuid
        sold_by_staff_user_id:
          type: [string, 'null']
          format: uuid
        sales_channel: {type: string}
        client_document_id:
          type: [string, 'null']
          format: uuid
        created_at: {type: string, format: date-time}
      required: [id, version, owner_client_id, location_id, reservation_type_id, name, status, is_unlimited, sessions_granted_count, sessions_reserved_count,
        sessions_consumed_count, sessions_forfeited_count, valid_during]
    PortalClientPackagePurchase:
      type: object
      additionalProperties: false
      description: Online package purchase. Price and validity come from the plan; owner comes from the `client_id` query
        (can_act_for); location from the plan.
      required: [package_plan_id]
      properties:
        package_plan_id: {type: string, format: uuid, description: must be sold online}
        session_count:
          type: [integer, 'null']
          description: range plans only; must fall within the plan's range
        coupon_code:
          type: [string, 'null']
        payment: {$ref: '#/components/schemas/PortalPaymentInstruction'}
    PortalPaymentInstruction:
      type: object
      additionalProperties: false
      description: Portal settlement. The payer is the identity's own client; external and staff-recorded modes are not
        available.
      properties:
        mode:
          type: string
          enum: [none, stored_method, new_method, account_credit]
        payment_method_id:
          type: [string, 'null']
          format: uuid
          description: must be a stored method of the identity's own client (never a dependent's or related client's), else 403
        amount_minor:
          type: [integer, 'null']
          format: int64
          description: Minor units, tenant currency; validated against the plan's due-now minimum and the balance
        provider_payment_token:
          type: [string, 'null']
        apply_account_credit: {type: boolean, description: the payer's own credit only}
      required: [mode]
    ClientPackageSell:
      type: object
      description: Staff sale (PKG-07). Without package_plan_id an ad-hoc package is built from the fields given. Overrides of plan price or validity
        need packages.package.update.
      properties:
        owner_client_id: {type: string, format: uuid}
        location_id: {type: string, format: uuid}
        package_plan_id:
          type: [string, 'null']
          format: uuid
        reservation_type_id:
          type: [string, 'null']
          format: uuid
        name:
          type: [string, 'null']
        session_count:
          type: [integer, 'null']
        start_on:
          type: [string, 'null']
          format: date
        end_on:
          type: [string, 'null']
          format: date
        price_minor:
          type: [integer, 'null']
          format: int64
          description: Minor units, tenant currency
        discount_pct:
          type: [number, 'null']
          minimum: 0
          maximum: 100
        discount_minor:
          type: [integer, 'null']
          format: int64
          description: Minor units, tenant currency
        coupon_code:
          type: [string, 'null']
        invoice_mode:
          type: string
          enum: [single, deferred]
        is_autopay: {type: boolean}
        sold_by_staff_user_id:
          type: [string, 'null']
          format: uuid
        share_with_client_ids:
          type: array
          items: {type: string, format: uuid}
        document_handling:
          type: string
          enum: [accepted, collect_later, email_link]
        payment: {$ref: '#/components/schemas/PaymentInstruction'}
      required: [owner_client_id, location_id]
    PackageQuote:
      type: object
      description: Preview; nothing persisted.
      properties:
        session_count:
          type: [integer, 'null']
        valid_during:
          type: array
          prefixItems:
          - type: [string, 'null']
            format: date
          - type: [string, 'null']
            format: date
          minItems: 2
          maxItems: 2
          description: Half-open [start, end); null end = unbounded
        price_minor:
          type: integer
          format: int64
          description: Minor units, tenant currency
        tax_minor:
          type: integer
          format: int64
          description: Minor units, tenant currency
        account_credit_applied_minor:
          type: integer
          format: int64
          description: Minor units, tenant currency
        due_now_minor:
          type: integer
          format: int64
          description: Minor units, tenant currency
        document_requirements:
          type: array
          items: {$ref: '#/components/schemas/DocumentRequirement'}
      required: [valid_during, price_minor, due_now_minor]
    PackageSaleResult:
      type: object
      description: Result of a sale.
      properties:
        client_package: {$ref: '#/components/schemas/ClientPackage'}
        invoice_id:
          type: [string, 'null']
          format: uuid
        payment_id:
          type: [string, 'null']
          format: uuid
        pending_document_id:
          type: [string, 'null']
          format: uuid
      required: [client_package]
    ClientPackageUpdate:
      type: object
      description: Extend or shorten validity; internal remarks (PKG-04). Renewal flags are the P1 slice (PKG-05).
      properties:
        version: {type: integer}
        valid_until_on:
          type: [string, 'null']
          format: date
        allows_booking_after_expiry: {type: boolean}
        internal_remarks:
          type: [string, 'null']
        is_auto_renew: {type: boolean}
      required: [version]
    CreditLedgerEntry:
      type: object
      description: credit_ledger_entry row; append-only (PKG-14).
      properties:
        id: {type: string, format: uuid}
        client_id: {type: string, format: uuid}
        entry_type:
          type: string
          enum: [grant, reserve, release, consume, restore, forfeit, adjust]
        granted_delta: {type: integer}
        reserved_delta: {type: integer}
        consumed_delta: {type: integer}
        forfeited_delta: {type: integer}
        reason: {type: string}
        source_type:
          type: [string, 'null']
          enum: [enrollment, booking, null]
        source_id:
          type: [string, 'null']
          format: uuid
        actor_type:
          type: string
          enum: [staff, client, system]
        actor_id:
          type: [string, 'null']
          format: uuid
        note:
          type: [string, 'null']
        occurred_at: {type: string, format: date-time}
      required: [client_id, entry_type, reason, occurred_at]
    CreditAdjustment:
      type: object
      description: Posts one `adjust` entry; delta may be negative but cannot take the balance below zero.
      properties:
        version: {type: integer}
        granted_delta: {type: integer}
        note: {type: string}
      required: [version, granted_delta, note]
    PackageShare:
      type: object
      description: package_share row (FAM-05).
      properties:
        id: {type: string, format: uuid}
        client_id: {type: string, format: uuid}
        client: {$ref: '#/components/schemas/ClientSummary'}
        origin:
          type: string
          enum: [manual, plan_preset, carried_from_previous]
        revoked_at:
          type: [string, 'null']
          format: date-time
      required: [client_id]
    AssessmentField:
      type: object
      description: assessment_field row; numeric only (FIT-01).
      properties:
        id: {type: string, format: uuid}
        assessment_template_id: {type: string, format: uuid}
        name: {type: string}
        decimal_places: {type: integer}
        unit_label:
          type: [string, 'null']
        better_direction:
          type: string
          enum: [higher, lower, none]
        is_client_visible: {type: boolean}
        sort_order: {type: integer}
        is_active: {type: boolean}
      required: [name]
    AssessmentTemplate:
      type: object
      description: 'assessment_template row: the category grouping fields (FIT-01).'
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        sort_order: {type: integer}
        is_active: {type: boolean}
        fields:
          type: array
          readOnly: true
          items: {$ref: '#/components/schemas/AssessmentField'}
      required: [name]
    AssessmentValue:
      type: object
      description: One measured value.
      properties:
        assessment_field_id: {type: string, format: uuid}
        value: {type: number}
      required: [assessment_field_id, value]
    AssessmentResult:
      type: object
      description: assessment_result with its values (FIT-02). Values are rounded half-up to the field's decimal_places.
      properties:
        id: {type: string, format: uuid}
        client_id: {type: string, format: uuid}
        recorded_at: {type: string, format: date-time}
        recorded_by_staff_user_id:
          type: [string, 'null']
          format: uuid
        location_id:
          type: [string, 'null']
          format: uuid
        note:
          type: [string, 'null']
        values:
          type: array
          items: {$ref: '#/components/schemas/AssessmentValue'}
      required: [client_id, recorded_at, values]
    AssessmentSeries:
      type: object
      description: History of one field for one client, newest first (FIT-03).
      properties:
        assessment_field_id: {type: string, format: uuid}
        points:
          type: array
          items:
            type: object
            properties:
              result_id: {type: string, format: uuid}
              recorded_at: {type: string, format: date-time}
              value: {type: number}
        latest_value:
          type: [number, 'null']
        first_value:
          type: [number, 'null']
        change:
          type: [number, 'null']
        best_value:
          type: [number, 'null']
      required: [assessment_field_id]
    AssessmentSeriesList:
      type: object
      description: Series for the requested fields.
      properties:
        series:
          type: array
          items: {$ref: '#/components/schemas/AssessmentSeries'}
      required: [series]
