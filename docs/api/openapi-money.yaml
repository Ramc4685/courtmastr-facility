    CouponWrite:
      type: object
      description: Exactly one of `discount_pct`, `discount_minor`.
      properties:
        name: {type: string}
        code: {type: string}
        starts_at: {type: string, format: date-time}
        ends_at: {type: [string, 'null'], format: date-time}
        discount_pct: {type: [string, 'null'], format: decimal}
        discount_minor: {type: [integer, 'null'], format: int64}
        limit_per_client: {type: [integer, 'null']}
        is_portal_enabled: {type: boolean}
        is_active: {type: boolean}
    CouponValidateRequest:
      type: object
      required: [code, subtotal_minor, channel]
      properties:
        code: {type: string}
        redeemer_client_id: {type: [string, 'null'], format: uuid}
        subtotal_minor: {type: integer, format: int64}
        channel: {type: string, enum: [staff, pos, portal]}
    CouponQuote:
      type: object
      description: Validation only; redemption happens inside the selling command.
      required: [coupon_id, is_valid, discount_minor]
      properties:
        coupon_id: {type: string, format: uuid}
        is_valid: {type: boolean}
        invalid_reason: {type: [string, 'null'], enum: [not_started, expired, inactive, limit_reached, client_required,
            not_portal_enabled, null]}
        discount_minor: {type: integer, format: int64}
    ChargeTaxLine:
      type: object
      required: [tax_id, code, rate, amount_minor, is_excluded]
      properties:
        tax_id: {type: string, format: uuid}
        code: {type: string}
        rate: {type: string, format: decimal}
        amount_minor: {type: integer, format: int64}
        is_excluded: {type: boolean}
    Charge:
      type: object
      description: Atomic receivable (BIL-01). `internal_remarks` is never serialised on `/portal`. `invoice_id` null =
        uninvoiced.
      required: [id, location_id, kind, status, source_context, source_type, source_id, description, quantity, unit_price_minor,
