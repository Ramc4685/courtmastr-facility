        discount_pct: {type: [string, 'null'], format: decimal}
        discount_minor: {type: [integer, 'null'], format: int64}
        excluded_tax_ids: {type: array, items: {type: string, format: uuid}}
        is_auto_renew: {type: boolean}
        is_autopay: {type: boolean}
        invoice_option: {type: string, enum: [single_invoice, invoice_per_occurrence, leave_uninvoiced]}
    Coupon:
      type: object
      required: [id, name, code, starts_at, is_portal_enabled, is_active, redemption_count]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        code: {type: string}
        starts_at: {type: string, format: date-time}
        ends_at: {type: [string, 'null'], format: date-time}
        discount_pct: {type: [string, 'null'], format: decimal}
        discount_minor: {type: [integer, 'null'], format: int64}
        limit_per_client: {type: [integer, 'null']}
        is_portal_enabled: {type: boolean}
        is_active: {type: boolean}
