# Non-secret settings for the container stack (overlay for FH_ENV=production; mounted by compose.stack.yml).
# Host names are the Compose service names. For a cloud deployment copy this file and change the hosts, the
# public URL and the bucket endpoint; provide it as a mounted file (Fly: [[files]]; AWS: a config volume or a
# thin image layer). Secrets never go here: they arrive as environment variables.
app:
  web_base_url: https://localhost:18443   # must equal the origin the browser uses (links in emails, CSRF origin)
  base_domain: localhost
api:
  host: 0.0.0.0
  trusted_proxies: ["172.29.77.250/32"]    # the proxy's pinned address on THIS Compose network only; a cloud
                                           # deployment lists its own proxy's range (empty is refused at startup)
db:
  host: postgres
  port: 5432
  name: facilityhub
  sslmode: require                         # the stack's Postgres serves a self-signed certificate; a deployment
                                           # sets FH_DB_SSLMODE=verify-full with PGSSLROOTCERT (security-baseline V9)
redis:
  # TLS (rediss) is required outside dev and test. The stack's Redis has a self-signed certificate made by
  # `make stack-up`, hence ssl_cert_reqs=none; a deployment sets FH_REDIS_URL to a verified rediss:// URL.
  url: rediss://redis:6379/0?ssl_cert_reqs=none
email:
  adapter: smtp
  smtp_host: mailpit                       # only exists under `--profile mail`; set a real relay for a deployment
  smtp_port: 1025
  from_address: no-reply@facilityhub.localhost
  log_links: false
payments:
  provider: none
auth:
  cookie_secure: true
storage:
  adapter: s3
  s3: {bucket: facilityhub, endpoint_url: "http://s3:9000", region: us-east-1, path_style: true}
  scanner: clamd
  clamd_host: clamav
  clamd_port: 3310
