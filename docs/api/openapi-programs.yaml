        last_success_at: {type: [string, 'null'], format: date-time}
        disabled_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    WebhookEndpointInput:
      type: object
      description: 'Create or merge-patch an endpoint. `status` accepts active or paused (re-enable resets the failure count).
        Authorization beyond integrations.webhook.manage: each event type maps to a read permission
        (EventType.required_permission) the creating principal must hold, else 403 event-permission-denied; `*` is
        rejected unless the creator holds every mapped permission, and expands to the concrete list at save time (new
        event types are not auto-subscribed). Deliveries apply the creator''s location scope (events for locations outside
        it are dropped). When the creator''s roles, scope or key change, or the creator is deactivated, subscriptions are
        re-evaluated: lost types move to suspended_event_types and an endpoint with none left is disabled.'
      required: [url, event_types]
      properties:
        url: {type: string, format: uri}
        description: {type: [string, 'null']}
        event_types:
          type: array
          items: {type: string}
          description: event names, or '*' only when the creator holds every mapped read permission
        status: {type: string, enum: [active, paused]}
    WebhookEndpointSecret:
      type: object
      description: Endpoint with its HMAC-SHA256 signing secret, shown once.
      required: [endpoint, signing_secret]
      properties: {endpoint: {$ref: '#/components/schemas/WebhookEndpoint'}, signing_secret: {type: string}}
    WebhookDelivery:
      type: object
      description: One attempt chain delivering one event to one endpoint.
      required: [id]
      properties:
        id: {type: string, format: uuid}
        webhook_endpoint_id: {type: string, format: uuid}
        event_id: {type: string, format: uuid}
        event_type: {type: string}
        status: {type: string, enum: [pending, delivered, failed, abandoned]}
        attempt_count: {type: integer}
        next_attempt_at: {type: [string, 'null'], format: date-time}
        last_response_status: {type: [integer, 'null']}
        last_error: {type: [string, 'null']}
        delivered_at: {type: [string, 'null'], format: date-time}
        payload: {type: [object, 'null'], additionalProperties: true, description: only on GET by id}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    EventType:
      type: object
      description: A domain event that can be subscribed to.
      required: [name, context]
      properties:
        name: {type: string, description: e.g. programs.enrollment.created}
        context: {type: string}
        description: {type: string}
        required_permission:
          type: string
          description: read key a subscriber's creator must hold to receive this event (e.g. programs.registration.read)
        payload_schema: {type: object, additionalProperties: true}
    ExternalConnection:
      type: object
      description: A tenant's or location's link to an external provider (INT-07). Credentials are never returned.
      required: [id]
      properties:
        id: {type: string, format: uuid}
        location_id: {type: [string, 'null'], format: uuid, description: null = tenant-wide}
        provider:
          type: string
          enum: [quickbooks_online, zoom, smartwaiver, perkville, coachmeplus, trainingym, sms_provider, wallet_pass]
        status: {type: string, enum: [pending, active, error, disconnected]}
        external_account_id: {type: [string, 'null']}
        external_account_name: {type: [string, 'null']}
        granted_scopes: {type: array, items: {type: string}}
        settings: {type: object, additionalProperties: true}
        connected_at: {type: [string, 'null'], format: date-time}
        last_sync_at: {type: [string, 'null'], format: date-time}
        last_error: {type: [string, 'null']}
        authorize_url:
          type: [string, 'null']
          format: uri
          description: 'present while pending: send the browser here to complete OAuth'
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ExternalConnectionCreate:
      type: object
      description: Start connecting a provider.
      required: [provider]
      properties:
        provider: {type: string}
        location_id: {type: [string, 'null'], format: uuid}
        return_url: {type: string, format: uri, description: must be on a tenant domain}
    ExternalConnectionUpdate:
      type: object
      description: 'Merge-patch provider settings. QuickBooks: sync_from date, sync mode (invoice or daily summary), auto-sync
        flag.'
      required: [settings]
      properties: {settings: {type: object, additionalProperties: true}}
    SyncMapping:
      type: object
      description: Maps one posting key of the daily journal entry to a provider account or class (table sync_mapping).
      required: [kind, local_key, external_id]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [ledger_account, tender_account, tax_account, revenue_account, revenue_class]}
        local_key: {type: string, description: 'ledger account name, tender code, tax id, revenue category id, or default'}
        external_id: {type: string}
        external_name: {type: [string, 'null']}
    SyncMappings:
      type: object
      description: Full mapping set of a connection, plus the provider options to choose from. PUT replaces `mappings`.
      required: [mappings]
      properties:
        mappings: {type: array, items: {$ref: '#/components/schemas/SyncMapping'}}
        unmapped:
          type: array
          items: {type: object, additionalProperties: true}
          description: local rows still lacking a mapping
        external_options:
          type: object
          additionalProperties: true
          description: provider accounts and classes, fetched live
    AccountingExport:
      type: object
      description: One journal entry per connection, location and business day (table accounting_export, INT-07).
      required: [id, external_connection_id, location_id, business_on, status]
      properties:
        id: {type: string, format: uuid}
        external_connection_id: {type: string, format: uuid}
        location_id: {type: string, format: uuid}
        business_on: {type: string, format: date}
        status: {type: string, enum: [pending, posted, completed_with_warnings, failed, skipped]}
        totals: {type: object, additionalProperties: true, description: 'netted lines as posted, plus unmapped categories'}
        external_id: {type: [string, 'null']}
        doc_number: {type: [string, 'null']}
        supersedes_export_id: {type: [string, 'null'], format: uuid}
        attempt_count: {type: integer}
        last_error: {type: [string, 'null']}
        posted_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    SyncRun:
      type: object
      description: Parameters of a manual sync.
      properties:
        from: {type: string, format: date}
        to: {type: string, format: date}
        local_kinds: {type: array, items: {type: string}}
        retries_failed: {type: boolean}
    VideoMeeting:
      type: object
      description: 'Online meeting attached to a session: provider-created or a pasted link (SSP-18, CLS-08).'
      required: [id]
      properties:
        id: {type: string, format: uuid}
        session_id: {type: string, format: uuid}
        provider: {type: string, enum: [zoom, manual]}
        external_connection_id: {type: [string, 'null'], format: uuid}
        status: {type: string, enum: [pending, scheduled, failed, deleted]}
        join_url:
          type: [string, 'null']
          format: uri
          description: staff only; participants use the join redirect
        has_passcode: {type: boolean}
        last_error: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    VideoMeetingInput:
      type: object
      description: Attach a meeting. `manual` needs join_url; `zoom` needs an active connection and creates the meeting
        through the adapter.
      required: [provider]
      properties:
        provider: {type: string}
        join_url: {type: string, format: uri}
        passcode: {type: string}
        host_external_user_id: {type: string}
