# Non-secret settings for the local container stack (overlay for FH_ENV=stack; mounted by compose.stack.yml).
# Not production: it accepts the stack's self-signed certificates. A deployment starts from app.production.yaml.
# Secrets never go here: they arrive as environment variables.
app:
  web_base_url: https://localhost:18443   # must equal the origin the browser uses (links in emails, CSRF origin)
  base_domain: localhost
api:
  host: 0.0.0.0
  trusted_proxies: ["172.29.77.250/32"]    # the proxy's pinned address on THIS Compose network only; a cloud
                                           # deployment lists its own proxy's range (empty is refused at startup)
db:
  host: postgres
  port: 5432
  name: facilityhub
  sslmode: require                         # the stack's Postgres serves a self-signed certificate (FH_ENV=stack only)
redis:
  # The stack's Redis has a self-signed certificate made by `make stack-up`: no verification (FH_ENV=stack only).
  # redis-py checks the host name by default, which needs verification, so that is switched off too.
  url: rediss://redis:6379/0?ssl_cert_reqs=none&ssl_check_hostname=false
email:
  adapter: smtp
  smtp_host: mailpit                       # only exists under `--profile mail`; set a real relay for a deployment
  smtp_port: 1025
  from_address: no-reply@facilityhub.localhost
  log_links: false
payments:
  provider: none
auth:
  cookie_secure: true
storage:
  adapter: s3
  s3: {bucket: facilityhub, endpoint_url: "http://s3:9000", region: us-east-1, path_style: true}
  scanner: clamd
  clamd_host: clamav
  clamd_port: 3310
