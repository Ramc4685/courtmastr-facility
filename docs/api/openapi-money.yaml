      x-features: [STF-15]
      responses:
        default: {$ref: '#/components/responses/NotSpecified'}
components:
  securitySchemes:
    staffSession: {type: apiKey, in: cookie, name: fh_session, description: Opaque staff session cookie; unsafe methods
        also need the CSRF header.}
    clientSession: {type: apiKey, in: cookie, name: fh_session, description: 'Opaque client (member, guardian) session cookie.'}
    bearerToken: {type: http, scheme: bearer, description: 'Mobile session token or API key (scopes are catalogue keys,
        rbac 11).'}
    kioskDevice: {type: apiKey, in: cookie, name: __Host-fh_device, description: Device token bound to one tenant and location
        (security-baseline 10).}
    providerSignature: {type: apiKey, in: header, name: Stripe-Signature, description: 'Provider webhook signature, verified
        before any processing.'}
  parameters:
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    Cursor:
      name: cursor
      in: query
      schema: {type: string}
      description: Opaque keyset cursor.
    Sort:
      name: sort
      in: query
      schema: {type: string}
      description: Comma-separated allow-listed fields, `-` prefix for descending; `id` is the tiebreaker.
    Include:
      name: include
      in: query
      schema: {type: string}
      description: '`total` adds `page.total`.'
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, maxLength: 255}
      description: Required. Replays return the stored response for 24 hours.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: {type: string, maxLength: 255}
  responses:
    BadRequest:
      description: Malformed request or unknown query parameter.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unauthorized:
      description: Unauthenticated, or re-authentication failed.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    PaymentRequired:
      description: '`payment-declined`, with the normalised decline category in `decline_category`.'
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Forbidden:
      description: '`permission-denied`: the principal can see the resource but not perform the action.'
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotFound:
      description: '`not-found` (also for ids outside tenant or location scope) or `feature-disabled`.'
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Conflict:
      description: State conflict; see the operation's `x-problem-codes`.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unprocessable:
      description: '`validation-failed` with `errors[]` JSON Pointers, or `idempotency-key-reused`.'
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    RateLimited:
      description: '`rate-limited`.'
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
      headers:
        Retry-After:
          schema: {type: integer}
    ProviderUnavailable:
      description: '`provider-unavailable`: the payment provider did not answer. Any payment row is left `unknown` and reconciled
        by the sweep; retry only with the same Idempotency-Key.'
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotSpecified:
      description: 'P1 stub: request and response schemas are specified when the feature is scheduled.'
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem (overview 3.13).
      required: [type, title, status, code, trace_id]
      additionalProperties: true
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
        code: {type: string, description: Stable machine code; equals the last segment of `type`.}
        trace_id: {type: string}
        errors:
          type: array
          items:
            type: object
            required: [pointer, code]
            properties:
              pointer: {type: string}
              code: {type: string}
              detail: {type: string}
    Page:
      type: object
      required: [next_cursor, has_more]
      properties:
        next_cursor: {type: [string, 'null']}
        has_more: {type: boolean}
        total: {type: integer}
    ReasonRequest:
      type: object
      required: [reason]
      properties:
        reason: {type: string}
    HistoryEntry:
      type: object
      description: Projection of platform `audit_event` (ADR 0007).
      required: [id, occurred_at, actor_type, action, entity_type, entity_id]
      properties:
        id: {type: string, format: uuid}
        occurred_at: {type: string, format: date-time}
        actor_type: {type: string, enum: [staff, client, api_key, kiosk, system]}
        actor_id: {type: [string, 'null'], format: uuid}
        actor_label: {type: string}
        action: {type: string}
        entity_type: {type: string}
        entity_id: {type: string, format: uuid}
        client_id: {type: [string, 'null'], format: uuid}
        summary: {type: string}
        changes: {type: object, additionalProperties: true}
    ExportRef:
      type: object
      description: Reporting `export_job` handle; the file is behind a signed 15-minute URL.
      required: [export_job_id, status]
      properties:
        export_job_id: {type: string, format: uuid}
        status: {type: string, enum: [queued, running, completed, failed]}
        download_url: {type: [string, 'null']}
        expires_at: {type: [string, 'null'], format: date-time}
    RevenueCategory:
      type: object
      required: [id, code, label, is_active, tax_ids]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        label: {type: string}
        remarks: {type: [string, 'null']}
        parent_id: {type: [string, 'null'], format: uuid}
        is_active: {type: boolean}
        system_key: {type: [string, 'null']}
        tax_ids: {type: array, items: {type: string, format: uuid}}
    RevenueCategoryWrite:
      type: object
      description: '`code` and `label` required on create. `tax_ids` replaces the tax mapping (BIL-12).'
      properties:
        code: {type: string}
        label: {type: string}
        remarks: {type: [string, 'null']}
        parent_id: {type: [string, 'null'], format: uuid}
        is_active: {type: boolean}
        tax_ids: {type: array, items: {type: string, format: uuid}}
    TaxRate:
      type: object
      description: '`rate` is a fraction, numeric(7,6).'
      required: [id, rate, effective_from_on, is_editable]
      properties:
        id: {type: string, format: uuid}
        rate: {type: string, format: decimal}
        effective_from_on: {type: string, format: date}
        is_editable: {type: boolean}
    TaxRateWrite:
      type: object
      required: [rate, effective_from_on]
      properties:
        rate: {type: string, format: decimal}
        effective_from_on: {type: string, format: date}
    Tax:
      type: object
      required: [id, code, label, is_active, rates]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        label: {type: string}
        remarks: {type: [string, 'null']}
        is_active: {type: boolean}
        deactivated_on: {type: [string, 'null'], format: date}
        current_rate: {type: [string, 'null'], format: decimal}
        rates: {type: array, items: {$ref: '#/components/schemas/TaxRate'}}
    TaxWrite:
      type: object
      properties:
        code: {type: string}
        label: {type: string}
        remarks: {type: [string, 'null']}
        is_active: {type: boolean}
        deactivated_on: {type: [string, 'null'], format: date}
        initial_rate: {$ref: '#/components/schemas/TaxRateWrite'}
    TenderType:
      type: object
      description: '`is_available` is false for processed kinds while no provider account is active (PAY-11).'
      required: [id, kind, label, is_processed, is_optional, is_enabled, is_available, sort_order]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [card, bank_debit, cash, cheque, bank_transfer, gift_card, external, other]}
        label: {type: string}
        is_processed: {type: boolean}
        is_optional: {type: boolean}
        is_enabled: {type: boolean}
        is_available: {type: boolean}
        sort_order: {type: integer}
    TenderTypeWrite:
      type: object
      description: Only record-only tenders can be created; built-in kinds accept `label`, `is_enabled` (if optional), `sort_order`.
      properties:
        kind: {type: string, enum: [external, other]}
        label: {type: string}
        is_enabled: {type: boolean}
        sort_order: {type: integer}
    BillingSettings:
      type: object
      description: 'Resolved view: location override, else tenant default.'
      required: [location_id, is_override, is_membership_autopay_default_staff, is_membership_autopay_default_portal, save_card_default,
        card_expiry_notice_days, decline_notice_scope, decline_alert_mode, autopay_retry_offset_days, due_reminder_offset_days,
        is_portal_blocked_when_past_due, invoice_email_subject, bill_to_fields]
      properties:
        location_id: {type: [string, 'null'], format: uuid}
        is_override: {type: boolean}
        is_membership_autopay_default_staff: {type: boolean}
        is_membership_autopay_default_portal: {type: boolean}
        save_card_default: {type: string, enum: [never, ask, always]}
        card_expiry_notice_days: {type: array, items: {type: integer}}
        decline_notice_scope: {type: string, enum: ['off', all_payments, autopay_payments]}
        decline_alert_email: {type: [string, 'null'], format: email}
        decline_alert_mode: {type: string, enum: [per_event, daily_digest]}
        autopay_retry_offset_days: {type: array, items: {type: integer}}
        due_reminder_offset_days: {type: array, items: {type: integer}}
        is_portal_blocked_when_past_due: {type: boolean}
        invoice_email_subject: {type: string}
        invoice_footer: {type: [string, 'null']}
        receipt_footer: {type: [string, 'null']}
        bill_to_fields: {type: array, items: {type: string}}
    BillingSettingsWrite:
      type: object
      description: Full replacement of the addressed row; omitted fields take defaults.
      properties:
        is_membership_autopay_default_staff: {type: boolean}
        is_membership_autopay_default_portal: {type: boolean}
        save_card_default: {type: string, enum: [never, ask, always]}
        card_expiry_notice_days: {type: array, items: {type: integer}}
        decline_notice_scope: {type: string, enum: ['off', all_payments, autopay_payments]}
        decline_alert_email: {type: [string, 'null'], format: email}
        decline_alert_mode: {type: string, enum: [per_event, daily_digest]}
        autopay_retry_offset_days: {type: array, items: {type: integer}}
        due_reminder_offset_days: {type: array, items: {type: integer}}
        is_portal_blocked_when_past_due: {type: boolean}
        invoice_email_subject: {type: string}
        invoice_footer: {type: [string, 'null']}
        receipt_footer: {type: [string, 'null']}
        bill_to_fields: {type: array, items: {type: string}}
    CatalogItem:
      type: object
      required: [id, location_id, kind, description, fee_minor, invoice_option, is_autopay, is_auto_renew, revenue_category_id,
