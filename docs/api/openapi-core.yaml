# FacilityHub OpenAPI 3.1 skeleton: platform, resources, scheduling, rentals.
# Design contract for Phase 1 (GATE 1). Decisions and trade-offs are in info.description.
# Operations: 104 P0 specified, 86 P1 stubs, 3 P2 stubs. Paths: 141. Schemas: 101.
openapi: 3.1.0
info:
  title: 'FacilityHub API: core contexts (platform, resources, scheduling, rentals)'
  version: 1.0.0-skeleton
  description: "Skeleton contract for the four core contexts. Conforms to docs/architecture/overview.md 3.12 to 3.16 and\n\
    docs/architecture/data-model-core.md. Field lists are the key fields only; the data model is authoritative.\nNames are\
    \ ours (clean-room). The committed full snapshot will be generated by FastAPI at docs/api/openapi.json;\nthis file is\
    \ the design target that snapshot is diffed against until the routers exist.\n\nReading rules\n- x-priority: P0 operations\
    \ are specified; P1 (and a few P2) operations are stubs with summary only.\n- x-permission: a permission catalogue key\
    \ (rbac-matrix.md) checked at router and service; `authenticated` = any\n  active staff session (configuration reads need\
    \ no key); `self` = the principal on itself; `public` =\n  anonymous, tenant from host; `client:can_act_for` = portal\
    \ ownership policy, not the catalogue.\n  API keys use the same keys as scopes. A missing tenant entitlement is 404 feature-disabled\
    \ before any check.\n- x-features: discovery feature IDs (docs/discovery/feature-inventory.md) the operation serves.\n\
    - x-problem-codes: Problem.code values beyond the generic ones (validation-failed, permission-denied, not-found).\n- Lists:\
    \ keyset pagination, flat filters with bracket operators, sort allow-list per endpoint (overview 3.14).\n  Every location-partitioned\
    \ list accepts location_id and is implicitly limited to the caller's locations.\n- Out-of-scope ids return 404, never\
    \ 403 (no existence leak).\n\nDecisions taken in this document (alternative rejected in brackets)\n1. Rentals are created\
    \ at /rentals, not POST /bookings with kind=rental. The owner context exposes the command\n   and calls scheduling.service,\
    \ so pricing, charge routing and the hold insert share one transaction and one\n   idempotency key (RNT-03). [One polymorphic\
    \ /bookings endpoint: scheduling would need billing vocabulary.]\n2. Recurrence is a structured rule (pattern, interval_count,\
    \ weekdays, month_week, range) matching\n   booking_series_rule in the data model. [RRULE text as in ADR 0004 section\
    \ 6: harder to validate and to\n   render in a form; an RRULE string can still be derived for ICS feeds, SCH-19.]\n3.\
    \ Series commands (create, add pass, edit, cancel) return 200/201 inline up to 50 occurrences and 202 with a\n   status_url\
    \ above that; the status resource is the booking_series_run (GET /booking-series/{id}/runs/{run_id}).\n   [The\
    \ rule row as the status resource: edits and cancels have no rule to hang results on.]\n4. Preview is a sibling endpoint for creates (/bookings/preview, /rentals/preview)\
    \ and a `preview` flag on\n   series edits and cancels. Both run the real code in a rolled-back transaction (SCH-09, SCH-12).\n\
    \   [Client-side conflict probing: cannot see buffers, descendants or links.]\n5. Series scope is one object {mode: this|following|all|selected|date_range}\
    \ for edit, cancel and capacity\n   (SCH-10, SCH-11, CLS-04). [One endpoint per reference scope name.]\n6. Time changes\
    \ are a verb (/bookings/{id}/reschedule) and carry `version`; other fields are PATCH. A stale\n   drag-and-drop is 409\
    \ version-conflict (SCH-12). [If-Match/ETag: overview 3.1 puts the version in the body.]\n7. GET /calendar is one bounded,\
    \ unpaginated range query returning tiles per resource column, including\n   descendant \"held\" tiles and fill (SCH-01,\
    \ SCH-06). [Paging /bookings from the client.]\n8. Online rental checkout is two steps, POST /portal/rentals (tentative\
    \ booking, real holds, expires_at) then\n   /confirm (payment in-request through the PaymentProvider port); both require\
    \ Idempotency-Key (RNT-06).\n   [Single pay-and-book call: the slot could be lost while the payer is in 3-D Secure.]\n\
    9. Public availability search is advisory; the exclusion constraint at hold insert is the only truth\n   (booking-conflict).\
    \ No forced-overlap override exists for any role.\n10. Staff credential reset sends a link only (PLT-03). [Admin-typed\
    \ or emailed temporary passwords.]\n11. Role grants and per-user overrides are replaced as whole sets with PUT (PLT-04,\
    \ PLT-05); the response\n    carries is_diverged_from_role. [Per-grant POST/DELETE: many round trips, no atomic review.]\n\
    12. Configuration aggregates are archived through PATCH is_active; resources and locations use explicit\n    archive verbs\
    \ because they have guards (future holds). No hard delete except unused roles, availability\n    windows, blackouts and\
    \ unused rental plans.\n\nOwned elsewhere, deliberately absent here\n- Enrolment, roster, attendance, waitlist, session\
    \ booking policy, portal session booking (CLS-01..03, CLS-06,\n  CLS-09, CLS-10, SCH-03 listing mode): programs. scheduling\
    \ exposes only the seat counter and capacity.\n- Equipment catalogue, loan and return (RNT-14, RNT-15, RNT-16): pos.\n\
    - API keys, webhooks, calendar feeds (SCH-19): integrations. Kiosk devices: access.\n- Shared bookings (SCH-17): packages\
    \ (share rows); only the direct link is here.\n- League venue mapping and site options (RES-06, PLT-12): leagues. Client\
    \ export (IMP-03) and rental plan sales\n  report (RNT-12): reporting. Padlocks (RES-09, P2), UI switch (PLT-09), release\
    \ notes and training\n  (ONB-02, ONB-04, ONB-05): not specified.\n- PLT-15 (cloud delivery) has no endpoint; GET /healthz\
    \ and /readyz are unversioned and outside this document.\n"
servers:
- url: /api/v1
  description: Tenant resolved from host (subdomain or custom domain)
tags:
- name: platform
  description: Tenants, locations, identity and sessions, staff users, RBAC, audit, imports. PLT, RES-01, RES-02, IMP, ONB.
- name: resources
  description: Venues, sub-venues, trainers as resources, groups, links, availability windows, lockers. RES-03..RES-08, SCH-15,
    SCH-18.
- name: scheduling
  description: Reservation types, bookings, holds, recurrence, series edits, blackouts, sessions (seat counter), calendar.
    SCH, CLS-04.
- name: rentals
  description: Rental types, rates, staff and online rentals, rental plans, locker leases. RNT.
security:
- sessionCookie: []
  csrfHeader: []
- bearerToken: []
paths:
  /health/live:
    get:
      operationId: getLiveness
      tags: [platform]
      summary: Process liveness (no dependencies checked)
      description: Used by the container orchestrator. Mounted outside tenant resolution; no database access.
      x-priority: P0
      x-permission: public
      x-features: [PLT-15]
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthStatus'}
  /health/ready:
    get:
      operationId: getReadiness
      tags: [platform]
      summary: Readiness (PostgreSQL, Redis, migration head, outbox relay lag)
      description: 503 when a dependency is down or the oldest unpublished outbox_event is older than the SLO threshold. Carries
        no tenant data; the SLO targets themselves are in security-baseline.md.
      x-priority: P0
      x-permission: public
      x-features: [PLT-15]
      security: []
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthStatus'}
        '503':
          description: Not ready
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthStatus'}
  /auth/sign-in:
    post:
      operationId: signIn
      tags: [platform]
      summary: Sign in with email and password
      x-priority: P0
      x-permission: public
      x-features: [PLT-02, PLT-03]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SignInRequest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthSession'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/RateLimited'}
        default: {$ref: '#/components/responses/Problem'}
      x-problem-codes: [invalid-credentials, identity-locked, mfa-required, rate-limited]
  /auth/magic-links:
    post:
      operationId: requestMagicLink
      tags: [platform]
      summary: Email a single-use 15-minute sign-in link
      x-priority: P0
      x-permission: public
      x-features: [PLT-02, PLT-03]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmailLinkRequest'}
      responses:
        '202':
          description: Accepted
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/RateLimited'}
        default: {$ref: '#/components/responses/Problem'}
  /auth/magic-links/consume:
    post:
      operationId: consumeMagicLink
      tags: [platform]
      summary: Exchange a magic-link token for a session
      x-priority: P0
      x-permission: public
      x-features: [PLT-02]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TokenConsumeRequest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthSession'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/RateLimited'}
        default: {$ref: '#/components/responses/Problem'}
      x-problem-codes: [token-invalid, token-expired]
  /auth/password-resets:
    post:
      operationId: requestPasswordReset
      tags: [platform]
      summary: Email a password-reset link (self-service)
      x-priority: P0
      x-permission: public
      x-features: [PLT-03]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmailLinkRequest'}
      responses:
        '202':
          description: Accepted
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/RateLimited'}
        default: {$ref: '#/components/responses/Problem'}
  /auth/password-resets/consume:
    post:
      operationId: consumePasswordReset
      tags: [platform]
      summary: Set a new password from a reset token; revokes other sessions
      x-priority: P0
      x-permission: public
      x-features: [PLT-03]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TokenConsumeRequest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthSession'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/RateLimited'}
        default: {$ref: '#/components/responses/Problem'}
      x-problem-codes: [token-invalid, token-expired, password-too-weak]
  /auth/invitations/accept:
    post:
      operationId: acceptInvitation
      tags: [platform]
      summary: Accept a staff or client invite and activate the identity
      x-priority: P0
      x-permission: public
      x-features: [PLT-02, PLT-13]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TokenConsumeRequest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthSession'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/RateLimited'}
        default: {$ref: '#/components/responses/Problem'}
      x-problem-codes: [token-invalid, token-expired]
  /auth/refresh:
    post:
      operationId: refreshSession
      tags: [platform]
      summary: Rotate the refresh token and mint a new access token
      x-priority: P0
      x-permission: session:refresh
      x-features: [PLT-02]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RefreshRequest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthSession'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/RateLimited'}
        default: {$ref: '#/components/responses/Problem'}
      x-problem-codes: [session-revoked, refresh-reuse-detected]
  /auth/sign-out:
    post:
      operationId: signOut
      tags: [platform]
      summary: Revoke the current session
      x-priority: P0
      x-permission: self
      x-features: [PLT-02]
      responses:
        '204':
          description: No content
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Problem'}
  /auth/session:
    get:
      operationId: getCurrentSession
      tags: [platform]
      summary: Current session (expiry, MFA and step-up state)
      x-priority: P0
      x-permission: self
      x-features: [PLT-02]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthSession'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Problem'}
  /me:
    get:
      operationId: getMe
      tags: [platform]
      summary: Current principal, tenant, effective permissions and permitted locations
      x-priority: P0
      x-permission: self
      x-features: [PLT-01, PLT-04, PLT-05, REL-05]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      operationId: updateMe
      tags: [platform]
      summary: Edit own profile and UI preferences
      x-priority: P2
      x-permission: self
      x-features: [PLT-10]
      responses:
        default: {$ref: '#/components/responses/Problem'}
  /auth/password:
    post:
      operationId: changeOwnPassword
      tags: [platform]
      summary: Change own password (requires current password or step-up)
      x-priority: P1
      x-permission: self
      x-features: [PLT-03]
      responses:
        default: {$ref: '#/components/responses/Problem'}
  /auth/sessions:
    get:
      operationId: listOwnSessions
      tags: [platform]
      summary: List own active sessions
      x-priority: P1
      x-permission: self
      x-features: [PLT-02]
      responses:
        default: {$ref: '#/components/responses/Problem'}
  /auth/sessions/{session_id}:
    delete:
      operationId: revokeOwnSession
      tags: [platform]
      summary: Revoke one of own sessions
      x-priority: P1
      x-permission: self
      x-features: [PLT-02]
      parameters:
      - name: session_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        default: {$ref: '#/components/responses/Problem'}
  /auth/step-up:
    post:
      operationId: stepUp
      tags: [platform]
      summary: Recent-auth step-up before a sensitive action (sets elevated_until_at)
      x-priority: P1
      x-permission: self
      x-features: [PLT-05]
      responses:
        default: {$ref: '#/components/responses/Problem'}
  /auth/mfa/factors:
    post:
      operationId: enrollMfaFactor
      tags: [platform]
      summary: Enrol a TOTP factor and issue recovery codes
      x-priority: P1
      x-permission: self
      x-features: [PLT-02]
      responses:
        default: {$ref: '#/components/responses/Problem'}
  /auth/mfa/verify:
    post:
      operationId: verifyMfa
      tags: [platform]
      summary: Verify a TOTP or recovery code for the current session
      x-priority: P1
      x-permission: self
      x-features: [PLT-02]
      responses:
        default: {$ref: '#/components/responses/Problem'}
  /auth/oidc/{provider_key}/start:
    get:
      operationId: startOidc
      tags: [platform]
      summary: Begin OIDC sign-in with a configured provider
      x-priority: P1
      x-permission: public
      x-features: [PLT-02]
      parameters:
      - name: provider_key
        in: path
        required: true
        schema: {type: string}
      responses:
        default: {$ref: '#/components/responses/Problem'}
  /auth/oidc/{provider_key}/callback:
    get:
      operationId: completeOidc
      tags: [platform]
      summary: OIDC redirect target; links external_login and creates a session
      x-priority: P1
      x-permission: public
      x-features: [PLT-02]
      parameters:
      - name: provider_key
        in: path
        required: true
        schema: {type: string}
      responses:
        default: {$ref: '#/components/responses/Problem'}
  /identity-providers:
    get:
      operationId: listIdentityProviders
      tags: [platform]
      summary: List configured OIDC providers
      x-priority: P1
      x-permission: platform.security.manage
      x-features: [PLT-02]
      responses:
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createIdentityProvider
      tags: [platform]
      summary: Configure an OIDC provider (secret stored by reference)
      x-priority: P1
      x-permission: platform.security.manage
      x-features: [PLT-02]
      responses:
        default: {$ref: '#/components/responses/Problem'}
  /security-settings:
    get:
      operationId: getSecuritySettings
      tags: [platform]
      summary: Password, session and staff MFA policy
      x-priority: P1
      x-permission: platform.security.manage
      x-features: [PLT-07]
      responses:
        default: {$ref: '#/components/responses/Problem'}
    patch:
      operationId: updateSecuritySettings
      tags: [platform]
      summary: Change password, session and staff MFA policy
      x-priority: P1
      x-permission: platform.security.manage
      x-features: [PLT-07]
      responses:
        default: {$ref: '#/components/responses/Problem'}
  /tenant:
    get:
      operationId: getTenant
      tags: [platform]
      summary: Tenant account profile
      x-priority: P0
      x-permission: authenticated
      x-features: [PLT-01]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Tenant'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      operationId: updateTenant
      tags: [platform]
      summary: Update tenant profile, locale and settings
      x-priority: P0
      x-permission: platform.tenant.update
      x-features: [PLT-01]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TenantUpdate'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Tenant'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Problem'}
      x-problem-codes: [invalid-state-transition]
  /tenant/entitlements:
    get:
      operationId: listTenantEntitlements
      tags: [platform]
      summary: Modules and metered limits with current usage
      x-priority: P1
      x-permission: authenticated
      x-features: [PLT-14]
      responses:
        default: {$ref: '#/components/responses/Problem'}
  /tenant/subscription:
    get:
      operationId: getTenantSubscription
      tags: [platform]
      summary: Platform subscription plan and billing cycle
      x-priority: P1
      x-permission: platform.tenant.manage_subscription
      x-features: [PLT-14]
      responses:
        default: {$ref: '#/components/responses/Problem'}
    patch:
      operationId: changeTenantSubscription
      tags: [platform]
      summary: Change plan, cycle or add-ons
      x-priority: P1
      x-permission: platform.tenant.manage_subscription
      x-features: [PLT-14]
      responses:
        default: {$ref: '#/components/responses/Problem'}
  /tenant/onboarding-checklist:
    get:
      operationId: getOnboardingChecklist
      tags: [platform]
      summary: Setup checklist computed from actual state
      x-priority: P1
      x-permission: authenticated
      x-features: [ONB-01]
      responses:
        default: {$ref: '#/components/responses/Problem'}
  /tenant/onboarding-checklist/{step_key}/dismiss:
    post:
      operationId: dismissOnboardingStep
      tags: [platform]
      summary: Dismiss a checklist step
      x-priority: P1
      x-permission: platform.tenant.update
      x-features: [ONB-01]
      parameters:
      - name: step_key
        in: path
        required: true
        schema: {type: string}
      responses:
        default: {$ref: '#/components/responses/Problem'}
  /locations:
    get:
      operationId: listLocations
      tags: [platform]
      summary: List locations the caller may act in
      x-priority: P0
      x-permission: authenticated
      x-features: [PLT-01, RES-01]
      parameters:
      - name: status
        in: query
        schema: {type: string, enum: [active, inactive]}
      - {$ref: '#/components/parameters/Q'}
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Cursor'}
      - {$ref: '#/components/parameters/Sort'}
      - {$ref: '#/components/parameters/Include'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Location'}
                  page: {$ref: '#/components/schemas/PageInfo'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createLocation
      tags: [platform]
      summary: Create a location
      x-priority: P0
      x-permission: platform.location.create
      x-features: [PLT-01, RES-01]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LocationCreate'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Location'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Problem'}
      x-problem-codes: [already-exists, entitlement-limit-reached]
  /locations/{location_id}:
    get:
      operationId: getLocation
      tags: [platform]
      summary: Location profile and operational settings
      x-priority: P0
      x-permission: authenticated
      x-features: [RES-01]
      parameters:
      - name: location_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Location'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      operationId: updateLocation
      tags: [platform]
      summary: Update profile, time zone, job run times and rounding
      x-priority: P0
      x-permission: platform.location.update
      x-features: [RES-01, PLT-16]
      parameters:
      - name: location_id
        in: path
        required: true
        schema: {type: string, format: uuid}
