[project]
name = "facilityhub-backend"
version = "0.1.0"
description = "FacilityHub API: modular monolith (FastAPI, SQLAlchemy 2, PostgreSQL 16 with RLS)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.9",
    "email-validator>=2.1",
    "pyyaml>=6.0",
    "argon2-cffi>=23.1",
    "dramatiq[redis]>=1.17",
    "cryptography>=50.0.2",
    "httpx>=0.28.1",
    "nh3>=0.3.7",
    "fpdf2>=2.9.0",
    "boto3>=1.44.0",
    "pyotp>=2.10",
    "pyjwt>=2.10",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.6",
    "schemathesis>=4.33.2",
    "mypy>=2.4.1",
    "import-linter>=2.16",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
# DTZ bans naive datetimes; the clock is injected through app.core.clock (overview 3.7).
select = ["E", "F", "I", "UP", "B", "DTZ"]
ignore = [
    "B008",  # FastAPI Depends() in argument defaults
    "E501",  # the formatter owns line length; long SQL and message strings stay on one line
]

[tool.pytest.ini_options]
testpaths = ["tests", "app"]
addopts = "-q --show-capture=no --cov=app --cov-branch --cov-report=term:skip-covered"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.coverage.run]
omit = ["*/tests/*"]

# mypy: checks backend/app (tests excluded). Lenient by default; `app.core` and `app.ports` are strict.
# Ratchet rule (docs/dev/checks.md): to tighten a module, delete its line below and fix what mypy then reports.
# Never add `# type: ignore` to domain code: add the module to the right list with a reason instead.
[tool.mypy]
python_version = "3.12"
files = ["app"]
exclude = ["/tests/"]
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["app.core.*", "app.ports.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
warn_return_any = true
no_implicit_optional = true

# Strict-mode gaps in core (missing annotations on decorators, bare generics, Any returns). Each line is one
# file that does not yet pass the strict flags above; its other checks stay on. Drop a line once the file passes.
[[tool.mypy.overrides]]
module = [
    "app.core.audit",
    "app.core.auth.permissions",
    "app.core.events",
    "app.core.inbound_webhooks",
    "app.core.jobs",
    "app.core.networks",
    "app.core.pagination",
    "app.core.ratelimit",
    "app.core.settings",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false

# Files that report errors even in lenient mode (mostly Optional narrowing and Literal-typed str values from
# SQLAlchemy rows). Nothing in them is hidden by a type: ignore; the list is the debt, one file per line.
[[tool.mypy.overrides]]
module = [
    "app.adapters.fake_payments",
