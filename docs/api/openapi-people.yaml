      security: [{clientSession: []}]
      responses:
        2XX:
          description: Specified with the P1 slice.
        default: {$ref: '#/components/responses/Problem'}
  /portal/assessment-bests:
    get:
      operationId: portalListAssessmentBests
      tags: [assessments]
      summary: Personal bests per client-visible field
      x-priority: P1
      x-surface: portal
      x-permission: portal:can_act_for
      x-features: [FIT-05]
      security: [{clientSession: []}]
      responses:
        2XX:
          description: Specified with the P1 slice.
        default: {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    staffSession:
      type: apiKey
      in: cookie
      name: fh_session
      description: Opaque staff session cookie; unsafe methods also need the X-CSRF-Token header.
    apiKey:
      type: http
      scheme: bearer
      description: Tenant API key with scopes that are a subset of the permission catalogue.
    clientSession:
      type: http
      scheme: bearer
      description: Client identity session (cookie on web, bearer on mobile).
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      schema: {type: string}
      description: Opaque keyset cursor.
    Sort:
      name: sort
      in: query
      schema: {type: string}
      description: Comma-separated allow-listed fields, `-` prefix for descending; id is the tiebreaker.
    Include:
      name: include
      in: query
      schema: {type: string}
      description: '`total` adds page.total.'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: {type: string, maxLength: 255}
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, maxLength: 255}
    ActForClientId:
      name: client_id
      in: query
      required: false
      schema: {type: string, format: uuid}
      description: Client to act for; default is the identity's primary client. Checked by can_act_for.
  responses:
    Problem:
      description: Any other error (5xx carries only trace_id).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unauthenticated:
      description: 401 unauthenticated.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    PermissionDenied:
      description: '403 permission-denied: visible but action not allowed.'
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotFound:
      description: 404 not-found; also for ids outside the caller's tenant, location or acting scope.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    PaymentDeclined:
      description: 402 payment-declined with the provider decline category.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Conflict:
      description: 409 state conflict; see x-problem-codes on the operation.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Gone:
      description: 410 token expired or superseded.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    ValidationFailed:
      description: 422 validation-failed with JSON Pointer errors; 422 idempotency-key-reused.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    RateLimited:
      description: 429 rate-limited with Retry-After.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem document (overview 3.13). `code` is the stable contract.
      required: [type, title, status, code, trace_id]
      additionalProperties: true
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
        code: {type: string}
        trace_id: {type: string}
        errors:
          type: array
          items:
            type: object
            properties:
              pointer: {type: string}
              code: {type: string}
              detail: {type: string}
        blockers:
          type: array
          items: {type: object, additionalProperties: true}
          description: Present on merge-blocked, document-required, removal-blocked.
    Page:
      type: object
      description: Keyset page envelope (overview 3.14).
      properties:
        next_cursor:
          type: [string, 'null']
        has_more: {type: boolean}
        total:
          type: integer
          description: Only with include=total
      required: [next_cursor, has_more]
    PublicTokenRequest:
      type: object
      additionalProperties: false
      description: Bearer secret from an emailed link, sent in the body (never the URL path or query). Hashed at rest,
        short-lived, redacted from logs; single-use where the operation consumes it.
      required: [token]
      properties:
        token: {type: string}
    FileRef:
      type: object
      description: Reference to a platform stored_file uploaded through the platform upload endpoint.
      properties:
        file_id: {type: string, format: uuid}
      required: [file_id]
    SignedUrl:
      type: object
      description: Short-lived signed download URL issued after the permission check.
      properties:
        url: {type: string}
        expires_at: {type: string, format: date-time}
      required: [url, expires_at]
    PaymentInstruction:
      type: object
      description: Placeholder; canonical schema lives in the billing (money) OpenAPI. How the amount due now is settled.
      properties:
        mode:
          type: string
          enum: [none, stored_method, new_method, account_credit, external]
        payment_method_id:
          type: [string, 'null']
          format: uuid
        amount_minor:
          type: [integer, 'null']
          format: int64
          description: Minor units, tenant currency
        provider_payment_token:
          type: [string, 'null']
        apply_account_credit: {type: boolean}
      required: [mode]
    JobAccepted:
      type: object
      description: Async job handle.
      properties:
        job_id: {type: string, format: uuid}
        status:
          type: string
          enum: [queued, running, completed, failed]
      required: [job_id, status]
    ClientEmail:
      type: object
      description: client_email row.
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        is_primary: {type: boolean}
        label:
          type: [string, 'null']
        verified_at:
          type: [string, 'null']
          format: date-time
      required: [email, is_primary]
    ClientSummary:
      type: object
      description: List row. Contact fields need clients.client.read; no sensitive fields.
      properties:
        id: {type: string, format: uuid}
        first_name: {type: string}
        last_name: {type: string}
        preferred_name:
          type: [string, 'null']
        primary_email:
          type: [string, 'null']
        phone_mobile:
          type: [string, 'null']
        member_number:
          type: [string, 'null']
        status:
          type: string
          enum: [active, disabled]
        home_location_id: {type: string, format: uuid}
        client_category_id:
          type: [string, 'null']
          format: uuid
        photo_url:
          type: [string, 'null']
        created_at: {type: string, format: date-time}
      required: [id, first_name, last_name, status, home_location_id]
    Client:
      type: object
      description: Full profile. birth_on, address, medical_notes are omitted without clients.client.read_sensitive (CLI-18, RPT-28). Membership
        standing, balance and waiver flag are composed by the caller from memberships, billing and documents endpoints.
      properties:
        id: {type: string, format: uuid}
        version: {type: integer}
        first_name: {type: string}
        last_name: {type: string}
        preferred_name:
          type: [string, 'null']
        gender:
          type: [string, 'null']
          enum: [female, male, non_binary, undisclosed, null]
        birth_on:
          type: [string, 'null']
          format: date
        organization_name:
          type: [string, 'null']
        phone_mobile:
          type: [string, 'null']
        phone_home:
          type: [string, 'null']
        phone_work:
          type: [string, 'null']
        address:
          type: object
          properties:
            line1:
              type: [string, 'null']
            line2:
              type: [string, 'null']
            city:
              type: [string, 'null']
            region:
              type: [string, 'null']
            postal_code:
              type: [string, 'null']
            country_code:
              type: [string, 'null']
        emails:
          type: array
          items: {$ref: '#/components/schemas/ClientEmail'}
        tag_ids:
          type: array
          items: {type: string, format: uuid}
        home_location_id: {type: string, format: uuid}
        client_category_id:
          type: [string, 'null']
          format: uuid
        referral_category_id:
          type: [string, 'null']
          format: uuid
        referral_source:
          type: [string, 'null']
        default_trainer_staff_user_id:
          type: [string, 'null']
          format: uuid
        default_salesperson_staff_user_id:
          type: [string, 'null']
          format: uuid
        custom_values: {type: object, additionalProperties: true}
        discount_pct: {type: number, minimum: 0, maximum: 100}
        member_number:
          type: [string, 'null']
        member_number_source:
          type: [string, 'null']
          enum: [generated, manual, scanned, null]
        comments:
          type: [string, 'null']
        medical_notes:
          type: [string, 'null']
        status:
          type: string
          enum: [active, disabled]
        merged_into_id:
          type: [string, 'null']
          format: uuid
        photo_url:
          type: [string, 'null']
        created_via:
          type: string
          enum: [staff, portal, registration, kiosk, api, import, provider]
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
      required: [id, version, first_name, last_name, home_location_id, status]
    ClientCreate:
      type: object
      description: Validated against client_field_policy for capture_context=staff (CLI-04). Emails written atomically (CLI-02).
      properties:
        first_name: {type: string}
        last_name: {type: string}
        home_location_id: {type: string, format: uuid}
        emails:
          type: array
          items: {$ref: '#/components/schemas/ClientEmail'}
        phone_mobile:
          type: [string, 'null']
        birth_on:
          type: [string, 'null']
          format: date
        gender:
          type: [string, 'null']
        client_category_id:
          type: [string, 'null']
          format: uuid
        tag_ids:
          type: array
          items: {type: string, format: uuid}
        custom_values: {type: object, additionalProperties: true}
        allow_duplicate:
          type: boolean
          default: false
          description: 'False: a likely duplicate returns 409 duplicate-candidate with candidates.'
      required: [first_name, last_name, home_location_id]
    ClientUpdate:
      type: object
      description: Partial update; same fields as Client. The whole emails and tag_ids lists replace the stored ones.
      properties:
        version: {type: integer}
        first_name: {type: string}
        last_name: {type: string}
        emails:
          type: array
          items: {$ref: '#/components/schemas/ClientEmail'}
        tag_ids:
          type: array
          items: {type: string, format: uuid}
        custom_values: {type: object, additionalProperties: true}
      required: [version]
    EmergencyContact:
      type: object
      description: client_emergency_contact row (CLI-18).
      properties:
        position: {type: integer}
        name: {type: string}
        relationship_label:
          type: [string, 'null']
        phone:
          type: [string, 'null']
        phone_alt:
          type: [string, 'null']
        email:
          type: [string, 'null']
        notes:
          type: [string, 'null']
      required: [position, name]
    EmergencyContactList:
      type: object
      description: Whole-list replace.
      properties:
        contacts:
          type: array
          items: {$ref: '#/components/schemas/EmergencyContact'}
      required: [contacts]
    MemberNumberAssign:
      type: object
      description: MEM-19. mode=generated draws from tenant_counter with the configured prefix.
      properties:
        mode:
          type: string
          enum: [generated, manual, scanned]
        member_number:
          type: [string, 'null']
      required: [mode]
    Lookup:
      type: object
      description: client_category / referral_category / note_subject row.
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        sort_order: {type: integer}
        is_active: {type: boolean}
      required: [name]
    Tag:
      type: object
      description: tag row (CLI-08).
      properties:
        id: {type: string, format: uuid}
        kind:
          type: string
          enum: [sport, season, custom]
        label: {type: string}
        is_active: {type: boolean}
      required: [kind, label]
    FieldPolicy:
      type: object
      description: client_field_policy row (CLI-04). Locked fields are rejected.
      properties:
        field_key: {type: string}
        capture_context:
          type: string
          enum: [staff, registration, portal]
        requirement:
          type: string
          enum: [hidden, optional, required]
        is_locked: {type: boolean, readOnly: true}
      required: [field_key, capture_context, requirement]
    FieldPolicyList:
      type: object
      description: Effective policy including code defaults.
      properties:
        policies:
          type: array
          items: {$ref: '#/components/schemas/FieldPolicy'}
      required: [policies]
    ClientSettings:
      type: object
      description: client_settings row.
      properties:
        default_gender:
          type: [string, 'null']
        is_member_number_auto_generated: {type: boolean}
        member_number_trigger:
          type: string
          enum: [client_created, membership_sold]
        member_number_prefix: {type: string}
        is_verification_email_enabled: {type: boolean}
        is_own_clients_scope_enabled: {type: boolean}
    ClientLocationSettings:
      type: object
      description: client_location_settings row.
      properties:
        location_id: {type: string, format: uuid}
        is_portal_photo_edit_enabled: {type: boolean}
      required: [location_id]
    RelationshipType:
      type: object
      description: relationship_type row (FAM-01).
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        label: {type: string}
        inverse_type_id:
          type: [string, 'null']
          format: uuid
        grants_acting_rights: {type: boolean}
        is_guardianship: {type: boolean}
        is_portal_selectable: {type: boolean}
        is_system: {type: boolean}
        is_active: {type: boolean}
      required: [code, label]
    Relationship:
      type: object
      description: One row per pair, rendered from the viewed client's side (FAM-01).
      properties:
        id: {type: string, format: uuid}
        other_client: {$ref: '#/components/schemas/ClientSummary'}
        relationship_type_id: {type: string, format: uuid}
        label: {type: string}
        direction:
          type: string
          enum: [from, to]
        status:
          type: string
          enum: [pending, active, declined, ended]
        can_act_for_other: {type: boolean}
        created_via: {type: string}
        confirmed_at:
          type: [string, 'null']
          format: date-time
      required: [id, other_client, relationship_type_id, label, direction, status]
    RelationshipCreate:
      type: object
      description: Staff link; starts active.
      properties:
        other_client_id: {type: string, format: uuid}
        relationship_type_id: {type: string, format: uuid}
      required: [other_client_id, relationship_type_id]
    PortalAccess:
      type: object
      description: client_portal_access row (CLI-15).
      properties:
        client_id: {type: string, format: uuid}
        identity_id:
          type: [string, 'null']
          format: uuid
        is_primary: {type: boolean}
        status:
          type: string
          enum: [none, invited, active, revoked]
        invited_at:
          type: [string, 'null']
          format: date-time
        activated_at:
          type: [string, 'null']
          format: date-time
        revoked_at:
          type: [string, 'null']
          format: date-time
      required: [client_id, status]
    PortalInvite:
      type: object
      description: Requires at least one client_email. Sends a single-use set-credential link; no staff-typed passwords.
      properties:
        email: {type: string, format: email}
      required: [email]
    ActableClient:
      type: object
      description: A client the signed-in identity may act for (FAM-03).
      properties:
        client: {$ref: '#/components/schemas/ClientSummary'}
        basis:
          type: string
          enum: [self, managed_profile, relationship]
        relationship_label:
          type: [string, 'null']
      required: [client, basis]
    PortalClientUpdate:
      type: object
      additionalProperties: false
      description: Validated against client_field_policy for capture_context=portal (SSP-10).
      properties:
        version: {type: integer}
        first_name: {type: string}
        last_name: {type: string}
        phone_mobile:
          type: [string, 'null']
        emails:
          type: array
          items: {$ref: '#/components/schemas/PortalClientEmailInput'}
        custom_values: {type: object, additionalProperties: true}
      required: [version]
    PortalClientEmailInput:
      type: object
      additionalProperties: false
      description: Portal-settable email fields only. The server owns id and verified_at; an address added or changed
        through the portal is unverified until the double opt-in link is confirmed, and cannot be primary or used for
        sign-in until then.
      properties:
        email: {type: string, format: email}
        label:
          type: [string, 'null']
        is_primary: {type: boolean, description: accepted only for an already-verified address; else 422}
      required: [email]
    DependentCreate:
      type: object
      description: Creates a client without its own login plus an active relationship (FAM-02).
      properties:
        first_name: {type: string}
        last_name: {type: string}
        birth_on:
          type: [string, 'null']
          format: date
        gender:
          type: [string, 'null']
        relationship_type_id: {type: string, format: uuid}
      required: [first_name, last_name, relationship_type_id]
    RelationshipRequest:
      type: object
      description: Link to an existing account holder; creates a pending row and mails a confirmation token (FAM-02). Response never reveals whether
        the email matched.
      properties:
        email: {type: string, format: email}
        relationship_type_id: {type: string, format: uuid}
        from_client_id:
          type: string
          format: uuid
          description: must be a client the identity holds direct portal access to; default its primary client
      required: [email, relationship_type_id]
    RelationshipDecision:
      type: object
      description: Token holder's decision. The token is in the body, never the URL.
      additionalProperties: false
      properties:
        token: {type: string, description: 'emailed confirmation secret; single-use, short-lived, never logged'}
        decision:
          type: string
          enum: [accept, decline]
      required: [token, decision]
    MemberCard:
      type: object
      description: MEM-19. Code payload is rendered client-side as QR or barcode.
      properties:
        client_id: {type: string, format: uuid}
        member_number: {type: string}
        display_name: {type: string}
        photo_url:
          type: [string, 'null']
        code_payload: {type: string}
        code_format:
          type: string
          enum: [qr, code128]
      required: [client_id, member_number, display_name, code_payload, code_format]
    DocumentTemplate:
      type: object
      description: document_template with its current published version (DOC-01).
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        kind:
          type: string
          enum: [agreement, consent]
        is_waiver: {type: boolean}
        description:
          type: [string, 'null']
        signature_validity_days:
          type: [integer, 'null']
        requires_guardian_for_minors: {type: boolean}
        minor_age_years: {type: integer}
        status:
          type: string
          enum: [draft, active, archived]
        current_version:
          anyOf: [{$ref: '#/components/schemas/DocumentTemplateVersion'}, {type: 'null'}]
        has_draft: {type: boolean}
        last_used_at:
          type: [string, 'null']
          format: date-time
      required: [name, kind]
    DocumentTemplateVersion:
      type: object
      description: Immutable once published.
      properties:
        id: {type: string, format: uuid}
        version_number: {type: integer}
        body_html: {type: string}
        acceptance_text: {type: string}
        body_sha256: {type: string}
        published_at:
          type: [string, 'null']
          format: date-time
        change_note:
          type: [string, 'null']
      required: [body_html, acceptance_text]
    DocumentTemplateDraft:
      type: object
      description: Upserts the single open draft version; HTML is sanitised on write.
      properties:
        body_html: {type: string}
        acceptance_text: {type: string}
        change_note:
          type: [string, 'null']
      required: [body_html, acceptance_text]
    DocumentBinding:
      type: object
      description: document_binding row (DOC-08, DOC-14).
      properties:
        id: {type: string, format: uuid}
        scope_type:
          type: string
          enum: [membership_plan, package_plan, program_group, program_default, rental_plan, portal_terms]
        scope_id:
          type: [string, 'null']
          format: uuid
        template_id:
          type: [string, 'null']
          format: uuid
        custom_text:
          type: [string, 'null']
        frequency:
          type: string
          enum: [first_purchase, every_purchase]
        is_enforced_online: {type: boolean}
        is_enforced_at_desk: {type: boolean}
        is_active: {type: boolean}
      required: [scope_type]
    DocumentRequirement:
      type: object
      description: Result of documents.service.requirements_for; what must be accepted before the sale completes.
      properties:
        binding_id: {type: string, format: uuid}
        template_id:
          type: [string, 'null']
          format: uuid
        title: {type: string}
        is_satisfied: {type: boolean}
        satisfied_by_document_id:
          type: [string, 'null']
          format: uuid
        pending_document_id:
          type: [string, 'null']
          format: uuid
        requires_guardian: {type: boolean}
        is_blocking: {type: boolean}
      required: [binding_id, title, is_satisfied, is_blocking]
    DocumentRequirementList:
      type: object
      description: Requirements for one scope and client.
      properties:
        requirements:
          type: array
          items: {$ref: '#/components/schemas/DocumentRequirement'}
      required: [requirements]
    ClientDocument:
      type: object
      description: client_document row with its evidence (DOC-02, DOC-06).
      properties:
        id: {type: string, format: uuid}
        version: {type: integer}
        client_id: {type: string, format: uuid}
        location_id: {type: string, format: uuid}
        template_id:
          type: [string, 'null']
          format: uuid
        template_version_id:
          type: [string, 'null']
          format: uuid
        title: {type: string}
        origin:
          type: string
          enum: [manual, sale, registration, bulk_send, consent, external_provider, import]
        acceptance_method:
          type: string
          enum: [paper, checkbox, drawn_signature, email_link]
        status:
          type: string
          enum: [pending, accepted, declined, expired, voided]
        requires_guardian: {type: boolean}
        issued_at: {type: string, format: date-time}
        decided_at:
          type: [string, 'null']
          format: date-time
        expires_on:
          type: [string, 'null']
          format: date
        is_paper_signed: {type: boolean}
        content_sha256: {type: string}
        source_type:
          type: [string, 'null']
        source_id:
          type: [string, 'null']
          format: uuid
        deleted_at:
          type: [string, 'null']
          format: date-time
        acceptances:
          type: array
          items: {$ref: '#/components/schemas/DocumentAcceptance'}
      required: [id, client_id, location_id, title, acceptance_method, status]
    ClientDocumentCreate:
      type: object
      description: Issue a document for one client (DOC-02). Renders and stores the PDF snapshot.
      properties:
        client_id: {type: string, format: uuid}
        template_id: {type: string, format: uuid}
        location_id: {type: string, format: uuid}
        acceptance_method:
          type: string
          enum: [paper, checkbox, drawn_signature, email_link]
        recipient_emails:
          type: array
          items: {type: string, format: email}
