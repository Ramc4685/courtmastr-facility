        catalog_item_id: {type: string, format: uuid}
        client_id: {type: string, format: uuid}
        location_id: {type: string, format: uuid}
        sold_on: {type: string, format: date}
        starts_on: {type: string, format: date}
        ends_on: {type: [string, 'null'], format: date}
        is_auto_renew: {type: boolean}
        renew_on: {type: [string, 'null'], format: date}
        status: {type: string, enum: [active, renewed, ended, cancelled]}
