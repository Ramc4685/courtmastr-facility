# import-linter: the boundaries of docs/architecture/overview.md section 2. Run `make boundaries`.
# One contract per context lists the contexts it must NOT import (everything its "May call" column omits).
# Existing breaches are `ignore_imports` entries, each with a reason; shrink the list, never grow it
# (docs/dev/checks.md). `integrations` may import any service interface, so it has no context contract.
[tool.importlinter]
root_packages = ["app"]
include_external_packages = false
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "core and ports import no module or adapter"
type = "forbidden"
source_modules = ["app.core", "app.ports"]
forbidden_modules = ["app.modules", "app.adapters"]
allow_indirect_imports = true
ignore_imports = [
    "app.modules.*.tests.** -> app.**",  # pytest modules may import anything
]

[[tool.importlinter.contracts]]
name = "modules do not import adapters (they use ports)"
type = "forbidden"
source_modules = ["app.modules"]
forbidden_modules = ["app.adapters"]
allow_indirect_imports = true
ignore_imports = [
    "app.modules.integrations.service -> app.adapters.accounting",  # integrations picks the accounting adapter directly; should resolve it through a port or the adapter registry
    "app.modules.integrations.service -> app.adapters.video",  # same for the video-meeting adapter
    "app.modules.integrations.quickbooks -> app.adapters.accounting",  # same for the QuickBooks connection adapter
    "app.modules.integrations.meetings -> app.adapters.video",  # same for the Zoom adapter
    "app.modules.*.tests.** -> app.**",  # pytest modules may import anything
]

[[tool.importlinter.contracts]]
name = "platform imports only its allowed contexts"
type = "forbidden"
source_modules = ["app.modules.platform"]
forbidden_modules = ["app.modules.resources", "app.modules.clients", "app.modules.scheduling", "app.modules.billing", "app.modules.documents", "app.modules.memberships", "app.modules.packages", "app.modules.rentals", "app.modules.programs", "app.modules.pos", "app.modules.access", "app.modules.leagues", "app.modules.staff", "app.modules.assessments", "app.modules.engagement", "app.modules.reporting", "app.modules.integrations"]
allow_indirect_imports = true
ignore_imports = [
    "app.modules.platform.privacy -> app.modules.clients.service",  # platform (L0) calls up into clients to run erasure; section 2 rule 3 says upward flow is an event or handler registry
    "app.modules.*.tests.** -> app.**",  # pytest modules may import anything
]

[[tool.importlinter.contracts]]
name = "resources imports only its allowed contexts"
type = "forbidden"
source_modules = ["app.modules.resources"]
forbidden_modules = ["app.modules.clients", "app.modules.scheduling", "app.modules.billing", "app.modules.documents", "app.modules.memberships", "app.modules.packages", "app.modules.rentals", "app.modules.programs", "app.modules.pos", "app.modules.access", "app.modules.leagues", "app.modules.staff", "app.modules.assessments", "app.modules.engagement", "app.modules.reporting", "app.modules.integrations"]
