      properties:
        id: {type: string, format: uuid}
        client_id: {type: [string, 'null'], format: uuid}
        location_id: {type: string, format: uuid}
        invoice_id: {type: [string, 'null'], format: uuid}
        kind: {type: string, enum: [standard, adjustment, reversal, surcharge]}
        status: {type: string, enum: [active, reversed, voided]}
        source_context: {type: string}
        source_type: {type: string}
        source_id: {type: string, format: uuid}
        description: {type: string}
        additional_description: {type: [string, 'null']}
        internal_remarks: {type: [string, 'null']}
        quantity: {type: string, format: decimal}
        unit_price_minor: {type: integer, format: int64}
        discount_pct: {type: [string, 'null'], format: decimal}
        discount_minor: {type: integer, format: int64}
        coupon_id: {type: [string, 'null'], format: uuid}
        net_minor: {type: integer, format: int64}
        tax_minor: {type: integer, format: int64}
        total_minor: {type: integer, format: int64}
        applied_minor: {type: integer, format: int64}
        balance_minor: {type: integer, format: int64}
        bill_on: {type: string, format: date}
        revenue_on: {type: string, format: date}
        service_starts_on: {type: [string, 'null'], format: date}
        service_ends_on: {type: [string, 'null'], format: date}
        revenue_category_id: {type: string, format: uuid}
        reverses_charge_id: {type: [string, 'null'], format: uuid}
        adjusts_charge_id: {type: [string, 'null'], format: uuid}
        reason: {type: [string, 'null']}
        taxes: {type: array, items: {$ref: '#/components/schemas/ChargeTaxLine'}}
        adjustments: {type: array, items: {type: string, format: uuid}}
        created_by_staff_user_id: {type: [string, 'null'], format: uuid}
        created_at: {type: string, format: date-time}
    ChargeCreate:
      type: object
      description: 'Manual charge (`source_type: manual`). Other contexts create charges through the billing service, not
        this route.'
      required: [client_id, location_id, description, unit_price_minor, revenue_category_id]
      properties:
        client_id: {type: string, format: uuid}
        location_id: {type: string, format: uuid}
        description: {type: string}
        additional_description: {type: [string, 'null']}
        internal_remarks: {type: [string, 'null']}
        quantity: {type: string, format: decimal}
        unit_price_minor: {type: integer, format: int64}
        discount_pct: {type: [string, 'null'], format: decimal}
        discount_minor: {type: [integer, 'null'], format: int64}
        revenue_category_id: {type: string, format: uuid}
        revenue_on: {type: string, format: date}
        service_starts_on: {type: [string, 'null'], format: date}
        service_ends_on: {type: [string, 'null'], format: date}
        excluded_tax_ids: {type: array, items: {type: string, format: uuid}}
        invoice_id: {type: [string, 'null'], format: uuid}
    ChargeUpdate:
      type: object
      description: Text and service-period fields update in place. Any money field posts an `adjustment` charge and needs
        `reason`.
      properties:
        description: {type: string}
        additional_description: {type: [string, 'null']}
        internal_remarks: {type: [string, 'null']}
        service_starts_on: {type: [string, 'null'], format: date}
        service_ends_on: {type: [string, 'null'], format: date}
        quantity: {type: string, format: decimal}
        unit_price_minor: {type: integer, format: int64}
        discount_pct: {type: [string, 'null'], format: decimal}
        discount_minor: {type: [integer, 'null'], format: int64}
        excluded_tax_ids: {type: array, items: {type: string, format: uuid}}
        revenue_on: {type: string, format: date}
        reason: {type: string}
    ChargePreview:
      type: object
      required: [net_minor, tax_minor, total_minor, taxes]
      properties:
        net_minor: {type: integer, format: int64}
        tax_minor: {type: integer, format: int64}
        total_minor: {type: integer, format: int64}
        taxes: {type: array, items: {$ref: '#/components/schemas/ChargeTaxLine'}}
    ChargeReverseRequest:
      type: object
      description: Creates the negating row and releases live allocations to account credit (BIL-07).
      required: [reason]
      properties:
        reason: {type: string}
        revenue_on_mode: {type: string, enum: [original, today]}
    PaymentScheduleRow:
      type: object
      required: [seq, due_on, amount_minor, covered_minor]
      properties:
        seq: {type: integer}
        due_on: {type: string, format: date}
        amount_minor: {type: integer, format: int64}
        covered_minor: {type: integer, format: int64}
    PaymentScheduleRowInput:
      type: object
      required: [due_on, amount_minor]
      properties:
        due_on: {type: string, format: date}
        amount_minor: {type: integer, format: int64}
    PaymentSchedulePut:
      type: object
      description: Rows must sum to the invoice total (BIL-06).
      required: [rows]
      properties:
        rows: {type: array, items: {$ref: '#/components/schemas/PaymentScheduleRowInput'}}
    PaymentScheduleGenerateRequest:
      type: object
      description: Pure generator with largest-remainder split; writes nothing.
      required: [starts_on, every, unit, count]
      properties:
        starts_on: {type: string, format: date}
        every: {type: integer}
        unit: {type: string, enum: [day, week, half_month, month, year]}
        count: {type: integer}
    PaymentSchedule:
      type: object
      required: [invoice_id, rows]
      properties:
        invoice_id: {type: string, format: uuid}
        rows: {type: array, items: {$ref: '#/components/schemas/PaymentScheduleRow'}}
    Invoice:
      type: object
      required: [id, number, location_id, origin, invoice_on, due_on, is_autopay, status, total_minor, balance_minor, dunning_state,
        attempt_count, version, created_at]
      properties:
        id: {type: string, format: uuid}
        number: {type: integer}
        bill_to_client_id: {type: [string, 'null'], format: uuid}
        location_id: {type: string, format: uuid}
        origin: {type: string, enum: [staff, portal, pos, kiosk, api, system]}
        invoice_on: {type: string, format: date}
        due_on: {type: string, format: date}
        is_autopay: {type: boolean}
        status: {type: string, enum: [open, payment_pending, partially_paid, paid, voided]}
        total_minor: {type: integer, format: int64}
        balance_minor: {type: integer, format: int64}
        past_due_since_on: {type: [string, 'null'], format: date}
        dunning_state: {type: string, enum: [none, retrying, awaiting_method, exhausted]}
        attempt_count: {type: integer}
        next_attempt_on: {type: [string, 'null'], format: date}
        comments: {type: [string, 'null']}
        organization_name: {type: [string, 'null']}
        created_by_staff_user_id: {type: [string, 'null'], format: uuid}
        voided_at: {type: [string, 'null'], format: date-time}
        void_reason: {type: [string, 'null']}
        version: {type: integer}
        created_at: {type: string, format: date-time}
    InvoiceDetail:
      allOf:
      - {$ref: '#/components/schemas/Invoice'}
      - type: object
        required: [charges, payment_schedule, allocations]
        properties:
          charges: {type: array, items: {$ref: '#/components/schemas/Charge'}}
          payment_schedule: {type: array, items: {$ref: '#/components/schemas/PaymentScheduleRow'}}
          allocations: {type: array, items: {$ref: '#/components/schemas/PaymentAllocation'}}
    InvoiceCreate:
      type: object
      description: All charges must share payer and location; mixed selections go through a bulk action, which splits per
        payer.
      required: [charge_ids]
      properties:
        charge_ids: {type: array, items: {type: string, format: uuid}}
        invoice_on: {type: string, format: date}
        due_on: {type: string, format: date}
        is_autopay: {type: boolean}
        comments: {type: [string, 'null']}
        organization_name: {type: [string, 'null']}
    InvoiceUpdate:
      type: object
      required: [version]
      properties:
        version: {type: integer}
        invoice_on: {type: string, format: date}
        due_on: {type: string, format: date}
        is_autopay: {type: boolean}
        comments: {type: [string, 'null']}
        organization_name: {type: [string, 'null']}
    InvoiceChargesAdd:
      type: object
      required: [charge_ids]
      properties:
        charge_ids: {type: array, items: {type: string, format: uuid}}
    ChargeMoveRequest:
      type: object
      description: Same payer and location required.
      required: [target_invoice_id]
      properties:
        target_invoice_id: {type: string, format: uuid}
    InvoiceVoidRequest:
      type: object
      description: 'Charges are detached to uninvoiced. A partially paid or paid invoice needs `release_allocations: true`
        (BIL-08).'
      required: [reason]
      properties:
        reason: {type: string}
        release_allocations: {type: boolean}
    DocumentSendRequest:
      type: object
      description: An ad-hoc `to_email` is not written back to the client.
      required: [channel]
      properties:
        channel: {type: string, enum: [email, print, download]}
        to_email: {type: [string, 'null'], format: email}
    BillingDocumentDelivery:
      type: object
      required: [id, document_kind, channel, status, created_at]
      properties:
        id: {type: string, format: uuid}
        document_kind: {type: string, enum: [invoice, receipt]}
        invoice_id: {type: [string, 'null'], format: uuid}
        payment_id: {type: [string, 'null'], format: uuid}
        channel: {type: string, enum: [email, print, download]}
        to_email: {type: [string, 'null'], format: email}
        status: {type: string, enum: [queued, sent, failed]}
        failure_message: {type: [string, 'null']}
        download_url: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
    BillingBulkActionCreate:
      type: object
      description: '`params`: reason and revenue-date mode for reversal, `catalog_item_id` for add-item. `create_invoices`
        splits per payer.'
      required: [location_id, action]
      properties:
        location_id: {type: string, format: uuid}
        action: {type: string, enum: [create_invoices, reverse_charges, email_invoices, render_invoices, add_catalog_item]}
        charge_ids: {type: array, items: {type: string, format: uuid}}
        invoice_ids: {type: array, items: {type: string, format: uuid}}
        client_ids: {type: array, items: {type: string, format: uuid}}
        params: {type: object, additionalProperties: true}
        is_dry_run: {type: boolean}
    BillingBulkAction:
      type: object
      required: [id, location_id, action, is_dry_run, status, item_count, done_count, failed_count, requested_by_staff_user_id,
        created_at]
      properties:
        id: {type: string, format: uuid}
        location_id: {type: string, format: uuid}
        action: {type: string}
        is_dry_run: {type: boolean}
        status: {type: string, enum: [queued, running, completed, completed_with_errors]}
        item_count: {type: integer}
        done_count: {type: integer}
        failed_count: {type: integer}
        requested_by_staff_user_id: {type: string, format: uuid}
        finished_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
    BillingBulkActionItem:
      type: object
      required: [id, subject_type, subject_id, status]
      properties:
        id: {type: string, format: uuid}
        subject_type: {type: string, enum: [charge, invoice]}
        subject_id: {type: string, format: uuid}
        status: {type: string, enum: [pending, done, failed, skipped]}
        result_type: {type: [string, 'null']}
        result_id: {type: [string, 'null'], format: uuid}
        error_code: {type: [string, 'null']}
    AllocationInput:
      type: object
      required: [charge_id, amount_minor]
      properties:
        charge_id: {type: string, format: uuid}
        amount_minor: {type: integer, format: int64}
    PaymentAllocation:
      type: object
      required: [id, payment_id, charge_id, amount_minor, status]
      properties:
        id: {type: string, format: uuid}
        payment_id: {type: string, format: uuid}
        charge_id: {type: string, format: uuid}
        invoice_id: {type: [string, 'null'], format: uuid}
        amount_minor: {type: integer, format: int64}
        status: {type: string, enum: [provisional, applied, released]}
        applied_at: {type: [string, 'null'], format: date-time}
        released_at: {type: [string, 'null'], format: date-time}
        release_reason: {type: [string, 'null'], enum: [unapplied, charge_reversed, charge_adjusted, payment_voided, payment_failed,
            dispute_opened, invoice_voided, null]}
    PaymentNextAction:
      type: object
      description: Handed to the provider's hosted element; never logged.
      required: [kind, provider, provider_client_secret, provider_account_ref]
      properties:
        kind: {type: string, enum: [confirm_with_provider, verify_bank_account]}
        provider: {type: string, enum: [stripe, fake]}
        provider_client_secret: {type: string}
        provider_account_ref: {type: string}
    Payment:
      type: object
      description: '`card_brand`, `card_last4` are null without `billing.payment_method.read` (rbac 6.10, 8).'
      required: [id, receipt_number, location_id, tender_type_id, tender_kind, amount_minor, currency, status, origin, received_at,
        unapplied_minor, refunded_minor]
      properties:
        id: {type: string, format: uuid}
        receipt_number: {type: integer}
        client_id: {type: [string, 'null'], format: uuid}
        location_id: {type: string, format: uuid}
        tender_type_id: {type: string, format: uuid}
        tender_kind: {type: string, enum: [card, bank_debit, cash, cheque, bank_transfer, gift_card, external, other]}
        amount_minor: {type: integer, format: int64}
        currency: {type: string}
        status: {type: string, enum: [initiated, requires_action, processing, succeeded, failed, unknown, cancelled, disputed,
            charged_back, voided]}
        origin: {type: string, enum: [staff, portal, pos, kiosk, autopay, api]}
        payment_method_id: {type: [string, 'null'], format: uuid}
        card_brand: {type: [string, 'null']}
        card_last4: {type: [string, 'null']}
        wallet: {type: [string, 'null'], enum: [apple_pay, google_pay, null]}
        external_reference: {type: [string, 'null']}
        memo: {type: [string, 'null']}
        received_at: {type: string, format: date-time}
        settled_at: {type: [string, 'null'], format: date-time}
        failure_category: {type: [string, 'null']}
        failure_message: {type: [string, 'null']}
        unapplied_minor: {type: integer, format: int64}
        refunded_minor: {type: integer, format: int64}
        taken_by_staff_user_id: {type: [string, 'null'], format: uuid}
        voided_at: {type: [string, 'null'], format: date-time}
        void_reason: {type: [string, 'null']}
        next_action: {oneOf: [{$ref: '#/components/schemas/PaymentNextAction'}, {type: 'null'}]}
    PaymentDetail:
      allOf:
      - {$ref: '#/components/schemas/Payment'}
      - type: object
        required: [allocations, refunds]
        properties:
          allocations: {type: array, items: {$ref: '#/components/schemas/PaymentAllocation'}}
          refunds: {type: array, items: {$ref: '#/components/schemas/Refund'}}
    PaymentCreate:
      type: object
      description: 'Processed tenders need `payment_method_id` or a provider-hosted token. `allocate: none` leaves the whole
        amount as account credit (BIL-21). Sum of allocations must not exceed the amount; the rest is credit.'
      required: [client_id, location_id, tender_type_id, amount_minor]
      properties:
        client_id: {type: string, format: uuid}
        location_id: {type: string, format: uuid}
        tender_type_id: {type: string, format: uuid}
        amount_minor: {type: integer, format: int64}
        payment_method_id: {type: [string, 'null'], format: uuid}
        provider_confirmation_token: {type: [string, 'null']}
        save_method: {type: boolean}
        set_autopay_method: {type: boolean}
        allocations: {type: array, items: {$ref: '#/components/schemas/AllocationInput'}}
        allocate: {type: string, enum: [explicit, oldest_first, none]}
        invoice_ids: {type: array, items: {type: string, format: uuid}}
        external_reference: {type: [string, 'null']}
        memo: {type: [string, 'null']}
        received_at: {type: string, format: date-time}
    AllocationsCreate:
      type: object
      required: [allocate]
      properties:
        allocations: {type: array, items: {$ref: '#/components/schemas/AllocationInput'}}
        allocate: {type: string, enum: [explicit, oldest_first]}
    Refund:
      type: object
      required: [id, payment_id, location_id, amount_minor, method, status, refund_on, reason, created_at]
      properties:
        id: {type: string, format: uuid}
        payment_id: {type: string, format: uuid}
        client_id: {type: [string, 'null'], format: uuid}
        location_id: {type: string, format: uuid}
        amount_minor: {type: integer, format: int64}
        method: {type: string, enum: [original, external]}
        status: {type: string, enum: [pending, succeeded, failed, cancelled]}
        refund_on: {type: string, format: date}
        reason: {type: string}
        comments: {type: [string, 'null']}
        refund_batch_id: {type: [string, 'null'], format: uuid}
        failure_message: {type: [string, 'null']}
        issued_by_staff_user_id: {type: [string, 'null'], format: uuid}
        created_at: {type: string, format: date-time}
    RefundCreate:
      type: object
      description: '`amount_minor` is bounded by the payment''s `unapplied_minor`. `original` goes through the provider
        port (PAY-05).'
      required: [amount_minor, method, reason]
      properties:
        amount_minor: {type: integer, format: int64}
        method: {type: string, enum: [original, external]}
        reason: {type: string}
        comments: {type: [string, 'null']}
        refund_on: {type: string, format: date}
    AccountCredit:
      type: object
      description: Credit is the pooled unapplied remainder of the client's payments.
      required: [client_id, credit_minor, payments]
      properties:
        client_id: {type: string, format: uuid}
        credit_minor: {type: integer, format: int64}
        payments: {type: array, items: {$ref: '#/components/schemas/Payment'}}
    CreditIssueRequest:
      type: object
      description: Manual goodwill credit. Storage shape is open question 1.
      required: [location_id, amount_minor, reason]
      properties:
        location_id: {type: string, format: uuid}
        amount_minor: {type: integer, format: int64}
        reason: {type: string}
    CreditApplyRequest:
      type: object
      description: Spends credit oldest payment first (BIL-21).
      required: [allocate]
      properties:
        allocations: {type: array, items: {$ref: '#/components/schemas/AllocationInput'}}
        allocate: {type: string, enum: [explicit, oldest_first]}
        invoice_ids: {type: array, items: {type: string, format: uuid}}
    CreditRefundRequest:
      type: object
      description: Refunds credit newest payment first; one `refund` per payment, grouped by `refund_batch_id`.
      required: [location_id, amount_minor, method, reason]
      properties:
        location_id: {type: string, format: uuid}
        amount_minor: {type: integer, format: int64}
        method: {type: string, enum: [original, external]}
        reason: {type: string}
        comments: {type: [string, 'null']}
    RefundBatch:
      type: object
      required: [refund_batch_id, amount_minor, refunds]
      properties:
        refund_batch_id: {type: string, format: uuid}
        amount_minor: {type: integer, format: int64}
        refunds: {type: array, items: {$ref: '#/components/schemas/Refund'}}
    ClientBillingSummary:
      type: object
      required: [client_id, credit_minor, open_balance_minor, past_due_minor, collections_status]
      properties:
        client_id: {type: string, format: uuid}
        credit_minor: {type: integer, format: int64}
        open_balance_minor: {type: integer, format: int64}
        past_due_minor: {type: integer, format: int64}
        oldest_past_due_on: {type: [string, 'null'], format: date}
        collections_status: {type: string, enum: [normal, tagged, in_collections]}
        autopay_payment_method_id: {type: [string, 'null'], format: uuid}
    PaymentMethod:
      type: object
      description: Display data and provider references only; no card or bank numbers exist in this system.
      required: [id, client_id, kind, last4, is_autopay, status, created_at]
      properties:
        id: {type: string, format: uuid}
        client_id: {type: string, format: uuid}
        kind: {type: string, enum: [card, bank_account]}
        brand: {type: [string, 'null']}
        last4: {type: string}
        exp_month: {type: [integer, 'null']}
        exp_year: {type: [integer, 'null']}
        funding: {type: [string, 'null'], enum: [credit, debit, prepaid, unknown, null]}
        wallet: {type: [string, 'null'], enum: [apple_pay, google_pay, null]}
        is_autopay: {type: boolean}
        status: {type: string, enum: [pending_verification, active, suspended, removed]}
        verified_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
    SetupIntent:
      type: object
      description: Secret for the provider-hosted card or bank element.
      required: [provider, provider_client_secret, provider_account_ref, provider_publishable_key]
      properties:
        provider: {type: string, enum: [stripe, fake]}
        provider_client_secret: {type: string}
        provider_account_ref: {type: string}
        provider_publishable_key: {type: string}
    InvoiceLinkTokenRequest:
      type: object
      additionalProperties: false
      description: Signed invoice-link token in the body, never the URL.
      required: [link_token]
      properties:
        link_token: {type: string}
    SetupIntentCreate:
      type: object
      description: Shared by staff and portal; holds no privileged field. The owning client comes from the path (staff) or
        the identity's own client (portal), never the body.
      required: [kind]
      properties:
        kind: {type: string, enum: [card, bank_account]}
    PaymentMethodAttach:
      type: object
      description: Reference returned by the hosted element after confirmation. Shared by staff and portal; holds no
        privileged field. The provider ref must come from a setup intent created for the same client.
      required: [provider_setup_ref]
      properties:
        provider_setup_ref: {type: string}
        is_autopay: {type: boolean}
    PaymentMethodUpdate:
      type: object
      description: Setting true clears the flag on the client's other methods in the same transaction. Shared by staff and
        portal; holds no privileged field.
      required: [is_autopay]
      properties:
        is_autopay: {type: boolean}
    BankVerifyRequest:
      type: object
      description: Micro-deposit verification (PAY-10). Shared by staff and portal; holds no privileged field.
      properties:
        amounts_minor: {type: array, items: {type: integer}}
        descriptor_code: {type: string}
    AutopayRun:
      type: object
      required: [id, location_id, business_on, status, selected_count, succeeded_count, failed_count, collected_minor, started_at]
      properties:
        id: {type: string, format: uuid}
        location_id: {type: string, format: uuid}
        business_on: {type: string, format: date}
        status: {type: string, enum: [running, completed, completed_with_errors]}
        selected_count: {type: integer}
        succeeded_count: {type: integer}
        failed_count: {type: integer}
        collected_minor: {type: integer, format: int64}
        started_at: {type: string, format: date-time}
        finished_at: {type: [string, 'null'], format: date-time}
    AutopayRunCreate:
      type: object
      description: Unique per location and date; a repeat resumes pending attempts.
      required: [location_id]
      properties:
        location_id: {type: string, format: uuid}
        business_on: {type: string, format: date}
    AutopayAttempt:
      type: object
      required: [id, autopay_run_id, invoice_id, attempt_no, amount_minor, credit_applied_minor, status, created_at]
      properties:
        id: {type: string, format: uuid}
        autopay_run_id: {type: string, format: uuid}
        invoice_id: {type: string, format: uuid}
        client_id: {type: [string, 'null'], format: uuid}
        attempt_no: {type: integer}
        amount_minor: {type: integer, format: int64}
        credit_applied_minor: {type: integer, format: int64}
        payment_method_id: {type: [string, 'null'], format: uuid}
        payment_id: {type: [string, 'null'], format: uuid}
        status: {type: string, enum: [pending, succeeded, processing, failed, skipped]}
        failure_category: {type: [string, 'null']}
        failure_message: {type: [string, 'null']}
        error_cleared_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
    ProviderAccount:
      type: object
      required: [id, provider, status, has_card, has_bank_debit, has_wallets, is_payouts_enabled]
      properties:
        id: {type: string, format: uuid}
        location_id: {type: [string, 'null'], format: uuid}
        provider: {type: string, enum: [stripe, fake]}
        status: {type: string, enum: [pending, restricted, active, disabled]}
        has_card: {type: boolean}
        has_bank_debit: {type: boolean}
        has_wallets: {type: boolean}
        is_payouts_enabled: {type: boolean}
        requirements_due: {type: [object, 'null'], additionalProperties: true}
        connected_at: {type: [string, 'null'], format: date-time}
        disabled_at: {type: [string, 'null'], format: date-time}
    ProviderAccountCreate:
      type: object
      required: [provider, return_url, refresh_url]
      properties:
        provider: {type: string, enum: [stripe, fake]}
        return_url: {type: string}
        refresh_url: {type: string}
    OnboardingLink:
      type: object
      description: Provider-hosted onboarding; single use.
      required: [provider_account_id, url, expires_at]
      properties:
        provider_account_id: {type: string, format: uuid}
        url: {type: string}
        expires_at: {type: string, format: date-time}
    OnboardingLinkCreate:
      type: object
      required: [return_url, refresh_url]
      properties:
        return_url: {type: string}
        refresh_url: {type: string}
    BillingNotice:
      type: object
