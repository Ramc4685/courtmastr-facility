# FacilityHub OpenAPI 3.1 skeleton: programs, leagues, engagement, reporting, integrations.
# P0 operations are specified; P1 operations are stubs (x-priority: P1). See info.description for conventions and decisions.
# Source of truth for fields: docs/architecture/data-model-programs.md. Merged into docs/api/openapi.json at build time.
openapi: 3.1.0
info:
  title: 'FacilityHub API: programs, leagues, engagement, reporting, integrations'
  version: 1.0.0-skeleton
  description: |
    Skeleton for the contexts **programs, leagues, engagement, reporting, integrations**. Conventions are those of
    `docs/architecture/overview.md` section 3; field-level truth is `docs/architecture/data-model-programs.md`.
    Schemas here carry key fields only.

    ## Reading this document
    - `x-priority`: `P0` operations are fully specified; `P1` operations are path stubs (summary, permission,
      features; parameters, bodies and responses are deliberately absent, which OpenAPI 3.1 allows).
    - `x-features`: discovery feature IDs (`docs/discovery/feature-inventory.md`).
    - `x-permission`: key from the static permission catalogue (`docs/architecture/rbac-matrix.md`). A **list** means
      the key is selected by a request discriminator named in the description (target kind, channel), not any-of.
      Special values: `client:self` (client identity; ownership policy `can_act_for`, overview 3.16), `public`
      (anonymous, tenant from host, rate-limited), `signature` (provider signature), `authenticated` (any staff
      principal; row filtering in the service), `reporting.<family>.run` (family key of the report, see
      `x-report-families`), `oauth-state` (signed state parameter).
    - `x-problem-codes`: operation-specific problem `code` values, in addition to the generic `not-found`,
      `permission-denied`, `validation-failed`, `version-conflict`, `rate-limited`.

    ## Conventions applied (overview 3.12 to 3.16)
    - Lists: keyset pagination `{data, page}`; `limit` default 50, max 200; `sort` allow-list per endpoint; filters
      are flat query parameters with bracket operators; unknown parameters are 400.
    - Errors: `application/problem+json` (RFC 9457) through the shared `Problem` schema; 404 for anything outside
      the caller's tenant or location scope.
    - Money: integer minor units; timestamps UTC `date-time`; ids UUIDv7.
    - `Idempotency-Key`: required where marked (portal, mobile and API-key writes that create enrolments, move
      money or start bulk sends), optional elsewhere.
    - Surfaces: `/api/v1/<resource>` staff session or scoped API key (the public REST API is these same resources:
      INT-01, INT-02, INT-04, INT-06, LGE-27); `/api/v1/portal/*` client identity (web portal and mobile app; this is
      also the member-context API of SSP-19 and INT-05); `/api/v1/public/*` anonymous; `/webhooks/*` unversioned.

    ## Decisions taken in this skeleton (alternative rejected)
    1. **One `*Input` schema per aggregate for POST and PATCH.** PATCH is `application/merge-patch+json` over the
       same schema; `required` applies to POST only. Rejected: separate Create and Update schemas (doubles the
       schema count for no contract value at skeleton stage; split per aggregate when a field becomes create-only).
    2. **Singleton configuration is `GET` + `PUT` on the owner** (`registration-config`, `portal-settings`,
       `session-booking-policy`, `app-config`). Rejected: PATCH on singletons (partial updates of wide config rows
       make "reset to inherited" ambiguous; PUT with nulls states it).
    3. **Enrolment is one resource for sessions and groups** (`/enrollments`, discriminated by target), matching
       the single `enrollment` table. Rejected: `/session-bookings` plus `/registrations` (two rosters, two
       cancel flows, two webhook shapes). Cost: the permission is selected by target kind, because the RBAC
       matrix keeps session keys under `scheduling.*` (CLS-01..06) and group keys under `programs.*` (REG-07..09).
    4. **Money-taking enrolment always goes through `registration-checkouts`** (staff and portal); the bare
       `POST /enrollments` only consumes an existing entitlement, books free, or raises a charge for later
       payment (staff). Rejected: a `payment` object on `POST /enrollments` (duplicates billing's confirm flow and
       idempotency in two places). SSP-08 inline package purchase is a checkout line.
    5. **Non-CRUD transitions are verb sub-resources** (`/complete`, `/publish`, `/promote`, `/commit`, `/send`),
       each mapped to one state-machine edge (data model section 7); illegal edges are `409
       invalid-state-transition`. Rejected: `PATCH {status}` (hides side effects such as seat release, bookings,
       sends).
    6. **Schedule generation and commit are jobs returning 202 with the `ScheduleRun`**; clients poll the run.
       Commit requires `Idempotency-Key` because it creates bookings. Rejected: synchronous commit (hundreds of
       holds in one request) and server-sent progress (not needed for v1).
    7. **Results are `PUT /games/{id}/result`** (both sides in one document), so standings and bracket advancement
       are one transaction (LGE-06, LGE-12, LGE-14). Rejected: one resource per side.
    8. **Reports are one generic run resource** keyed by `report_key`; parameters are validated against the
       registry's JSON Schema served by `/report-definitions`. Rejected: one endpoint per report (about 60 paths
       that differ only in parameters; the catalogue is code, data model 4.1). Cost: OpenAPI does not type each
       report's parameters; the definition endpoint does.
    9. **Exports are always `export-jobs`** (overview 3.14), including campaign recipients, rosters and game cards.
    10. **API keys are served under the integrations tag** although the row lives in `platform` (the permission
        is `integrations.api_key.manage`). No OAuth client-credentials token endpoint in v1 (data model open
        question 6).
    11. **Capacity edits of sessions (CLS-04), rental booking (SSP-04), self sign-up accounts (SSP-05), profile
        and payment methods (SSP-10), invoices and documents (SSP-20), the membership card (APP-06) and in-app
        payment sheets (APP-19) are not in this file**; they belong to scheduling, rentals, platform, clients,
        billing, documents and access. Their feature IDs appear here only where this file contributes an endpoint.
servers: [{url: /api/v1}]
tags:
- name: programs
  description: Groups, online registration, class and clinic enrolment, waitlists, forms. Features REG-*, CLS-*, SSP-02/03/08/17.
- name: leagues
  description: Competitions, teams, rosters, schedule generation, results, standings, brackets, officials. Features LGE-*.
- name: engagement
  description: Email and push campaigns, reminders, notification routing, consent, portal and app content. Features MKT-*,
    SSP-*, APP-*.
- {name: reporting, description: 'Report registry, runs, saved reports, exports. Features RPT-*.'}
- name: integrations
  description: API keys, outbound webhooks, provider connections (QuickBooks, Zoom), virtual meetings, calendar feeds. Features
    INT-*.
x-report-families:
  description: P0 report keys by permission family (createReportRun). P1 reports are registry entries added without API
    change; see data model 4.5.
  families:
    reporting.financial.run: {revenue_summary: RPT-03, deposits: RPT-04, invoices: RPT-05, open_invoices: RPT-06}
    reporting.membership.run: {memberships_by_status: RPT-12}
    reporting.attendance.run: {attendance: RPT-21, attendance_overview: RPT-21}
    reporting.pos.run: {pos_sales: RPT-30, daily_register: RPT-32}
    reporting.time_clock.run: {time_clock: RPT-37}
x-features-without-own-path:
  SSP-04: P0. Only the allows_rental_booking switch is here (putPortalSettings); rules and flow are rentals and scheduling.
  SSP-20: P0. Portal invoices, balances, pay-balance and documents are billing and documents routes under /portal.
  APP-06: P0. Only card_number_mode is here (putAppConfig); the signed QR credential and wallet pass are access routes.
  INT-03 INT-06 LGE-27: P1. The public API is the staff resources of each context under an API key whose scopes are permission
    keys; league reads use listCompetitions, listGames, listStandings with scope leagues.*.read behind the leagues entitlement.
  INT-05: P1. Member-context API is /portal/* under a client identity.
  LGE-26: P1. League Admin and Scorekeeper are platform roles; no endpoint here.
  LGE-32 RPT-07..11 RPT-13..20 RPT-22..26 RPT-28 RPT-29 RPT-31 RPT-33 RPT-34 RPT-39 RPT-40 RPT-41: P1. Registry entries
    run through createReportRun; no new paths.
  MKT-12: P1. Segment definition source `form` on createSegment and createCampaign.
  SSP-09 APP-18: P1. Fields of SessionBookingPolicy (listing_mode unlisted, hides_full_sessions, visible_range_days); signed
    direct links are scheduling.registration_link.
paths:
  /program-groups:
    get:
      operationId: listProgramGroups
      tags: [programs]
      summary: List group nodes
      x-priority: P0
      x-permission: programs.registration.read
      x-features: [REG-01, REG-02, REG-04]
      security: [{staffSession: []}, {apiKey: []}]
      parameters:
      - {$ref: '#/components/parameters/LocationId'}
      - {$ref: '#/components/parameters/Q'}
      - {name: 'status[in]', in: query, schema: {type: string}}
      - {name: kind, in: query, schema: {type: string}}
      - name: parent_id
        in: query
        schema: {type: string, format: uuid}
        description: direct children
      - name: root_id
        in: query
        schema: {type: string, format: uuid}
        description: whole subtree
      - {name: is_root, in: query, schema: {type: boolean}}
      - name: is_deleted
        in: query
        schema: {type: boolean}
        description: include soft-deleted (restore list)
      - {name: 'starts_on[gte]', in: query, schema: {type: string, format: date}}
      - {name: 'ends_on[lte]', in: query, schema: {type: string, format: date}}
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Cursor'}
      - {$ref: '#/components/parameters/Sort'}
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/ProgramGroup'}}
                  page: {$ref: '#/components/schemas/Page'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createProgramGroup
      tags: [programs]
      summary: Create a group or child node
      description: Depth is capped at 5. With the location default on, a null revenue category is copied from the parent
        at write time (REG-02).
      x-priority: P0
      x-permission: programs.program.manage
      x-features: [REG-01, REG-02, CLS-10]
      security: [{staffSession: []}, {apiKey: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ProgramGroupInput'}}}
      responses:
        '201':
          description: Created.
          content: {application/json: {schema: {$ref: '#/components/schemas/ProgramGroup'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
      x-problem-codes: [already-exists]
  /program-groups/{program_group_id}:
    parameters:
    - name: program_group_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    get:
      operationId: getProgramGroup
      tags: [programs]
      summary: Get a group node
      x-priority: P0
      x-permission: programs.registration.read
      x-features: [REG-01]
      security: [{staffSession: []}, {apiKey: []}]
      responses:
        '200':
          description: OK.
          content: {application/json: {schema: {$ref: '#/components/schemas/ProgramGroup'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: updateProgramGroup
      tags: [programs]
      summary: Update a group node
      description: Lowering capacity below the enrolled count is 409 capacity-full (mirror of the session rule, CLS-04).
      x-priority: P0
      x-permission: programs.program.manage
      x-features: [REG-01, REG-02, CLS-04]
      security: [{staffSession: []}, {apiKey: []}]
      requestBody:
        required: true
        content: {application/merge-patch+json: {schema: {$ref: '#/components/schemas/ProgramGroupInput'}}}
      responses:
        '200':
          description: OK.
          content: {application/json: {schema: {$ref: '#/components/schemas/ProgramGroup'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
      x-problem-codes: [capacity-full, version-conflict]
    delete:
      operationId: deleteProgramGroup
      tags: [programs]
      summary: Soft-delete a group subtree
      description: Blocked while pending enrolments exist.
      x-priority: P0
      x-permission: programs.program.delete
      x-features: [REG-05]
      security: [{staffSession: []}, {apiKey: []}]
      responses:
        '204': {description: No content.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
      x-problem-codes: [invalid-state-transition]
  /program-groups/{program_group_id}/restore:
    parameters:
    - name: program_group_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    post:
      operationId: restoreProgramGroup
      tags: [programs]
      summary: Restore a soft-deleted group
      x-priority: P0
      x-permission: programs.program.delete
      x-features: [REG-05]
      security: [{staffSession: []}, {apiKey: []}]
      responses:
        '200':
          description: OK.
          content: {application/json: {schema: {$ref: '#/components/schemas/ProgramGroup'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
      x-problem-codes: [invalid-state-transition]
  /program-groups/{program_group_id}/complete:
    parameters:
    - name: program_group_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    post:
      operationId: completeProgramGroup
      tags: [programs]
      summary: Mark a group completed (clears open waitlist entries)
      x-priority: P0
      x-permission: programs.program.manage
      x-features: [REG-05]
      security: [{staffSession: []}, {apiKey: []}]
      responses:
        '200':
          description: OK.
          content: {application/json: {schema: {$ref: '#/components/schemas/ProgramGroup'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
      x-problem-codes: [invalid-state-transition]
  /program-groups/{program_group_id}/archive:
    parameters:
    - name: program_group_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    post:
      operationId: archiveProgramGroup
      tags: [programs]
      summary: Archive a completed group
      x-priority: P0
      x-permission: programs.program.manage
      x-features: [REG-05]
      security: [{staffSession: []}, {apiKey: []}]
      responses:
        '200':
          description: OK.
          content: {application/json: {schema: {$ref: '#/components/schemas/ProgramGroup'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
      x-problem-codes: [invalid-state-transition]
  /program-groups/{program_group_id}/reopen:
    parameters:
    - name: program_group_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    post:
      operationId: reopenProgramGroup
      tags: [programs]
      summary: Reopen a completed or archived group
      x-priority: P0
      x-permission: programs.program.manage
      x-features: [REG-05]
      security: [{staffSession: []}, {apiKey: []}]
      responses:
        '200':
          description: OK.
          content: {application/json: {schema: {$ref: '#/components/schemas/ProgramGroup'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
      x-problem-codes: [invalid-state-transition]
  /program-groups/{program_group_id}/tree:
    parameters:
    - name: program_group_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    get:
      operationId: getProgramGroupTree
      tags: [programs]
      summary: Get a root with all descendants and counters
      x-priority: P0
      x-permission: programs.registration.read
      x-features: [REG-02]
      security: [{staffSession: []}, {apiKey: []}]
      responses:
        '200':
          description: OK.
          content: {application/json: {schema: {$ref: '#/components/schemas/ProgramGroupTree'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /program-groups/{program_group_id}/sessions:
    parameters:
    - name: program_group_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    get:
      operationId: listProgramSessions
      tags: [programs]
      summary: List sessions linked to a group node
      x-priority: P0
      x-permission: programs.registration.read
      x-features: [CLS-10]
      security: [{staffSession: []}, {apiKey: []}]
      parameters:
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Cursor'}
      - {$ref: '#/components/parameters/Sort'}
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/ProgramSessionLink'}}
                  page: {$ref: '#/components/schemas/Page'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      operationId: addProgramSessions
      tags: [programs]
      summary: Link or create sessions for a group node
      description: Creation goes through scheduling.service, so the hold exclusion constraint applies; conflicts are reported
        per occurrence in `conflicts`.
      x-priority: P0
      x-permission: programs.program.manage
      x-features: [CLS-10]
      security: [{staffSession: []}, {apiKey: []}]
      parameters:
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Cursor'}
      - {$ref: '#/components/parameters/Sort'}
