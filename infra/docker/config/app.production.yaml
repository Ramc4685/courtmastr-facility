# Non-secret settings for a deployment (overlay for FH_ENV=production). The local container stack uses
# app.stack.yaml instead. Host names below are examples; copy this file and change the hosts, the
# public URL and the bucket endpoint; provide it as a mounted file (Fly: [[files]]; AWS: a config volume or a
# thin image layer). Secrets never go here: they arrive as environment variables.
app:
  web_base_url: https://localhost:18443   # must equal the origin the browser uses (links in emails, CSRF origin)
  base_domain: localhost
api:
  host: 0.0.0.0
  trusted_proxies: ["172.29.77.250/32"]    # the proxy's pinned address on THIS Compose network only; a cloud
                                           # deployment lists its own proxy's range (empty is refused at startup)
db:
  host: postgres
  port: 5432
  name: facilityhub
  sslmode: verify-full                     # with PGSSLROOTCERT=<CA bundle path> in the environment (security-baseline V9)
redis:
  # TLS with the server's certificate and host name verified (refused otherwise). A private CA: set FH_REDIS_URL
  # to rediss://<host>:6379/0?ssl_ca_certs=<CA bundle path>.
  url: rediss://redis:6379/0
email:
  adapter: smtp
  smtp_host: mailpit                       # only exists under `--profile mail`; set a real relay for a deployment
  smtp_port: 1025
  from_address: no-reply@facilityhub.localhost
  log_links: false
payments:
  provider: none
auth:
  cookie_secure: true
storage:
  adapter: s3
  s3: {bucket: facilityhub, endpoint_url: "http://s3:9000", region: us-east-1, path_style: true}
  scanner: clamd
  clamd_host: clamav
  clamd_port: 3310
