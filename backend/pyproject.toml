[project]
name = "facilityhub-backend"
version = "0.1.0"
description = "FacilityHub API: modular monolith (FastAPI, SQLAlchemy 2, PostgreSQL 16 with RLS)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.9",
    "email-validator>=2.1",
    "pyyaml>=6.0",
    "argon2-cffi>=23.1",
    "dramatiq[redis]>=1.17",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
# DTZ bans naive datetimes; the clock is injected through app.core.clock (overview 3.7).
select = ["E", "F", "I", "UP", "B", "DTZ"]
ignore = [
    "B008",  # FastAPI Depends() in argument defaults
    "E501",  # the formatter owns line length; long SQL and message strings stay on one line
]

[tool.pytest.ini_options]
testpaths = ["tests", "app"]
addopts = "-q --show-capture=no --cov=app --cov-branch --cov-report=term:skip-covered"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.coverage.run]
omit = ["*/tests/*"]
